</head>



<body>


<div class="header">


<h1>
📊 KIỂM TRA TỔNG HỢP HỌC SINH LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>





<div class="container">


<div class="box center">


<button class="btn"
onclick="veTrangChu()">

🏠 Về trang chủ quản lý lớp 97

</button>


</div>





<div class="box center">


<h2>
📅 Chọn đợt kiểm tra
</h2>


<select id="dotKiemTra"
onchange="hienThiBang()">


<option>
Giữa kỳ 1
</option>


<option>
Cuối kỳ 1
</option>


<option>
Giữa kỳ 2
</option>


<option>
Cuối kỳ 2
</option>


</select>


</div>






<div class="box">


<table>


<thead>

<tr>


<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Toán
</th>


<th>
Ngữ văn
</th>


<th>
Ngoại ngữ 1
</th>


<th>
GDCD
</th>


<th>
KHTN
</th>


<th>
Lịch sử và Địa lí
</th>


<th>
Công nghệ
</th>


<th>
Tin học
</th>


<th>
GDTC
</th>


<th>
Nghệ thuật
</th>


<th>
HĐTN-HN
</th>


<th>
GD địa phương
</th>



</tr>


</thead>



<tbody id="bangDiem">


</tbody>


</table>



<div class="center">


<button 
class="btn save"
onclick="luuDiem()">

💾 Lưu điểm

</button>


</div>


</div>



</div>





<script>



// =============================
// DANH SÁCH MÔN
// =============================


const monHoc=[


"Toán",

"Ngữ văn",

"Ngoại ngữ 1",

"GDCD",

"KHTN",

"Lịch sử và Địa lí",

"Công nghệ",

"Tin học",

"GDTC",

"Nghệ thuật",

"HĐTN-HN",

"GD địa phương"


];





// =============================
// MÔN NHẬN XÉT
// =============================


const monNhanXet=[


"GDTC",

"Nghệ thuật",

"HĐTN-HN",

"GD địa phương"


];






function layDiem(){


let data=

localStorage.getItem(
"diemKiemTra97"
);



return data?

JSON.parse(data)

:

[];

}




function luuDiemMoi(data){


localStorage.setItem(

"diemKiemTra97",

JSON.stringify(data)

);


}






function hienThiBang(){


let ds=

layDanhSachHocSinh();



let dot=

document.getElementById(
"dotKiemTra"
).value;



let data=

layDiem();



let html="";



ds.forEach((hs,index)=>{



let old=data.find(

x=>

x.id==hs.id

&&

x.dot==dot

);



html+=`

<tr data-id="${hs.id}">


<td>${index+1}</td>


<td>
<b>${hs.hoTen}</b>
</td>




${monHoc.map(mon=>{


let value=

old?.diem?.[mon] || "";



if(monNhanXet.includes(mon)){


return `

<td>

<select class="${mon}">

<option ${value=="Đ"?"selected":""}>
Đ
</option>

<option ${value=="KĐ"?"selected":""}>
KĐ
</option>

</select>

</td>

`;

}


return `

<td>

<input 
class="${mon}"
value="${value}">

</td>

`;


}).join("")}



</tr>


`;



});




document.getElementById(

"bangDiem"

).innerHTML=html;



}







function luuDiem(){


let dot=

document.getElementById(
"dotKiemTra"
).value;



let data=

layDiem();





document.querySelectorAll(

"#bangDiem tr"

)

.forEach(row=>{



let id=

Number(
row.dataset.id
);



let obj={

id:id,

dot:dot,

diem:{}

};





monHoc.forEach(mon=>{


obj.diem[mon]=

row.querySelector("."+mon).value;


});





let old=data.find(

x=>

x.id==id

&&

x.dot==dot

);



if(old){

Object.assign(old,obj);

}

else{


data.push(obj);


}


});





luuDiemMoi(data);



alert(

"Đã lưu "+dot

);



}







function veTrangChu(){


window.location.href=

"trangchu.html";


}




khoiTaoDuLieu();


hienThiBang();



</script>


</body>


</html>
