<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Sao lưu dữ liệu lớp 97</title>


<style>

body{

font-family:Arial;
background:#eef5ff;
padding:30px;

}


.container{

max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;

}


h1{

color:#1565c0;

}


.info{

background:#f2f7ff;
padding:15px;
border-radius:15px;
margin:20px;

}


button{

background:#1565c0;
color:white;
border:none;
padding:15px 25px;
border-radius:10px;
font-size:18px;
margin:10px;
cursor:pointer;

}


button:hover{

background:#0d47a1;

}


input{

margin:15px;

}


</style>


</head>



<body>


<div class="container">


<h1>
💾 SAO LƯU - KHÔI PHỤC DỮ LIỆU
</h1>


<div class="info">

<h3>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h3>

<p>
📘 Lớp: <b>97</b>
</p>

<p>
👨‍🏫 GVCN: <b>Trần Sáng</b>
</p>


<p id="thoigian">

</p>


</div>



<button onclick="saoLuu()">

📥 Tạo file sao lưu

</button>


<hr>



<h3>
♻️ Khôi phục dữ liệu
</h3>


<input 
type="file"
id="fileBackup"
accept=".json">


<br>


<button onclick="khoiPhuc()">

♻️ Khôi phục

</button>



<br><br>


<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>



</div>





<script>


// Các dữ liệu cần bảo vệ

const danhSachDuLieu = {


truong:

"THCS Trần Phú",


lop:

"97",


gvcn:

"Trần Sáng",


thoiGian:

new Date().toLocaleString("vi-VN"),



danhSachHocSinh:

localStorage.getItem(
"danhSachHocSinh"
),



thiDua:

localStorage.getItem(
"lichSuTuan97"
),



hanhKiem:

localStorage.getItem(
"hanhKiem97"
),



nhanXetAI:

localStorage.getItem(
"baoCaoNhanXet97"
),



nhanXetChung:

localStorage.getItem(
"nhanXetChung97"
)


};





function saoLuu(){



let duLieu={


thongTin:{


truong:"THCS Trần Phú",

lop:"97",

gvcn:"Trần Sáng",

ngay:
new Date().toLocaleString("vi-VN")


},


duLieu:danhSachDuLieu


};





let file = new Blob(

[

JSON.stringify(
duLieu,
null,
2
)

],

{

type:"application/json"

}

);



let link=document.createElement("a");


link.href=
URL.createObjectURL(file);



link.download=

"Backup_Lop97_TranSang.json";



link.click();



alert(

"✅ Đã tạo file sao lưu thành công!"

);



}





function khoiPhuc(){



let file =

document.getElementById(
"fileBackup"
).files[0];



if(!file){


alert(
"Thầy hãy chọn file backup trước!"
);


return;


}



let reader=new FileReader();



reader.onload=function(e){



let data=

JSON.parse(
e.target.result
);



if(

data.thongTin.lop!="97"

){


alert(
"❌ File không đúng dữ liệu lớp 97!"
);


return;


}




if(

confirm(

"Dữ liệu hiện tại sẽ bị thay thế. Tiếp tục?"

)

){



let duLieu=data.duLieu;



if(duLieu.thiDua)

localStorage.setItem(
"lichSuTuan97",
duLieu.thiDua
);



if(duLieu.hanhKiem)

localStorage.setItem(
"hanhKiem97",
duLieu.hanhKiem
);



if(duLieu.nhanXetAI)

localStorage.setItem(
"baoCaoNhanXet97",
duLieu.nhanXetAI
);



if(duLieu.nhanXetChung)

localStorage.setItem(
"nhanXetChung97",
duLieu.nhanXetChung
);



alert(

"✅ Khôi phục dữ liệu thành công!"

);



location.href="index.html";



}



};



reader.readAsText(file);



}





document.getElementById("thoigian").innerHTML=

"⏰ Hôm nay: "

+

new Date().toLocaleDateString("vi-VN");



</script>



</body>

</html>
