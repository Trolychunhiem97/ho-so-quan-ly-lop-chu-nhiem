<body>


<div class="header">


<h1>
👨‍🎓 HỒ SƠ HỌC SINH LỚP 97
</h1>


<p>
GVCN Trần Sáng
</p>


</div>





<div class="container">


<div class="box">


<button class="back"
onclick="quayLai()">

⬅ Về trang chủ

</button>



<h2>
📚 Danh sách 33 học sinh
</h2>



<table>


<thead>


<tr>

<th>
STT
</th>


<th>
Họ và tên
</th>


<th>
Tổ hiện tại
</th>


<th>
Phân tổ
</th>


</tr>


</thead>



<tbody id="bangHocSinh">


</tbody>



</table>



<br>


<button onclick="luuPhanTo()">

💾 Lưu phân tổ

</button>



</div>


</div>





<script>


let nguoiDung = layNguoiDung();



if(!nguoiDung ||
nguoiDung.quyen!=="gvcn"){


alert(
"Chỉ GVCN được phân tổ"
);


window.location.href="trangchu.html";


}





function hienThiDanhSach(){



let html="";



danhSachHocSinh.forEach(

(hs,index)=>{


let tenTo="Chưa phân";



if(hs.to===1)
tenTo="Tổ 1";


if(hs.to===2)
tenTo="Tổ 2";


if(hs.to===3)
tenTo="Tổ 3";




html+=`

<tr>

<td>
${index+1}
</td>


<td>
${hs.hoTen}
</td>


<td>
${tenTo}
</td>


<td>

<select id="to_${hs.id}">


<option value="0"
${hs.to===0?"selected":""}>

Chưa phân

</option>


<option value="1"
${hs.to===1?"selected":""}>

Tổ 1

</option>


<option value="2"
${hs.to===2?"selected":""}>

Tổ 2

</option>


<option value="3"
${hs.to===3?"selected":""}>

Tổ 3

</option>


</select>


</td>


</tr>

`;



}

);



document.getElementById(

"bangHocSinh"

).innerHTML=html;



}



hienThiDanhSach();







function luuPhanTo(){



danhSachHocSinh.forEach(

hs=>{


let chon = document.getElementById(

"to_"+hs.id

);



hs.to = Number(chon.value);



});



localStorage.setItem(

"danhSachHocSinh",

JSON.stringify(danhSachHocSinh)

);



alert(

"Đã lưu phân tổ thành công"

);


}





function quayLai(){


window.location.href="trangchu.html";


}



</script>



</body>

</html>
