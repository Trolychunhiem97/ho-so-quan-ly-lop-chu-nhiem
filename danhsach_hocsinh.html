<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Hồ sơ học sinh lớp 97
</title>


<script src="phanquyen.js"></script>
<script src="danhsach.js"></script>
<script src="dulieu.js"></script>



<style>


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:35px;

text-align:center;

}


.header h1{

margin:0;

font-size:36px;

}



.container{

padding:30px;

max-width:1400px;

margin:auto;

}



.card{

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 8px 20px #ddd;

}



button{

border:none;

padding:14px 25px;

border-radius:15px;

cursor:pointer;

font-size:16px;

font-weight:bold;

}



.btn-home{

background:#1565c0;

color:white;

margin-bottom:25px;

}



.btn-save{

background:#00897b;

color:white;

display:block;

margin:30px auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:15px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



select{

padding:8px 15px;

border-radius:10px;

font-size:16px;

}



tr:hover{

background:#f5f9ff;

}



</style>


</head>


<body>



<div class="header">


<h1>
👨‍🎓 HỒ SƠ HỌC SINH LỚP 97
</h1>


<p>
GVCN Trần Sáng
</p>


</div>






<div class="container">



<button class="btn-home"
onclick="veTrangChu()">

← Về trang chủ

</button>






<div class="card">


<h2>
📚 Danh sách 33 học sinh
</h2>



<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ và tên
</th>


<th>
Tổ hiện tại
</th>


<th>
Phân tổ
</th>


</tr>


</thead>



<tbody id="bangHocSinh">

</tbody>



</table>





<button class="btn-save"
onclick="luuPhanTo()">

💾 Lưu phân tổ

</button>



</div>


</div>







<script>


// =================================
// HIỂN THỊ DANH SÁCH
// =================================



function hienThiDanhSach(){



let ds =
layDanhSachHocSinh();



let html="";



ds.forEach((hs,index)=>{


html+=`

<tr data-id="${hs.id}">


<td>
${index+1}
</td>


<td>
${hs.hoTen}
</td>


<td>

${
hs.to

?

"Tổ "+hs.to

:

"Chưa phân"

}

</td>


<td>


<select>


<option value="0"
${!hs.to?"selected":""}>

Chưa phân

</option>


<option value="1"
${hs.to==1?"selected":""}>

Tổ 1

</option>


<option value="2"
${hs.to==2?"selected":""}>

Tổ 2

</option>


<option value="3"
${hs.to==3?"selected":""}>

Tổ 3

</option>


</select>


</td>



</tr>


`;



});



document.getElementById(
"bangHocSinh"
).innerHTML=html;



}







// =================================
// LƯU PHÂN TỔ
// =================================


function luuPhanTo(){



let ds =
layDanhSachHocSinh();




document
.querySelectorAll(
"#bangHocSinh tr"
)
.forEach(row=>{


let id =
row.dataset.id;



let to =
Number(
row.querySelector("select").value
);



let hs =
ds.find(
x=>x.id==id
);



if(hs){


hs.to = to;


}



});





luuDanhSachHocSinh(ds);



alert(
"✅ Đã lưu phân tổ thành công!"
);



hienThiDanhSach();



}







function veTrangChu(){


window.location.href=
"trangchu.html";


}







khoiTaoDuLieu();


hienThiDanhSach();



</script>


</body>

</html>
