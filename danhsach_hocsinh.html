<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Hồ sơ học sinh lớp 97
</title>


<!-- KẾT NỐI DỮ LIỆU GỐC -->

<script src="js/danhsach.js"></script>



<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px #bbb;

}



.header{

background:linear-gradient(135deg,#1565c0,#42a5f5);

color:white;

padding:25px;

border-radius:20px;

text-align:center;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}



.box{

background:#f8fbff;

padding:20px;

margin-top:20px;

border-radius:20px;

}



input,textarea,select{

width:100%;

padding:12px;

margin:8px 0;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

}



textarea{

height:90px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 20px;

border-radius:12px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.ai{

background:#fff8e1;

padding:20px;

border-radius:15px;

white-space:pre-line;

line-height:1.6;

}



</style>


</head>



<body>


<div class="container">


<div class="header">


<h1>
👨‍🎓 HỒ SƠ HỌC SINH LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>





<div class="box">


<h2>
📋 Chọn học sinh
</h2>


<select id="chonHocSinh"

onchange="hienThiHoSo()">


<option>
-- Chọn học sinh --
</option>


</select>


</div>






<div class="grid">


<div class="box">


<h2>
📝 Thông tin cá nhân
</h2>


<input id="hoTen"

readonly>



<input id="ngaySinh"

placeholder="Ngày sinh">


<select id="gioiTinh">


<option>
Nam
</option>


<option>
Nữ
</option>


</select>



<input id="phuHuynh"

placeholder="Họ tên phụ huynh">



<input id="soDT"

placeholder="Số điện thoại">



<textarea id="hoanCanh"

placeholder="Hoàn cảnh gia đình">

</textarea>



</div>






<div class="box">


<h2>
⭐ Đánh giá GVCN
</h2>



<textarea id="uuDiem"

placeholder="Điểm mạnh">

</textarea>



<textarea id="hanChe"

placeholder="Điểm cần cải thiện">

</textarea>



<button onclick="luuThongTin()">

💾 Lưu hồ sơ

</button>



<button onclick="phanTichAI()">

🤖 AI phân tích

</button>



</div>


</div>








<div class="box">


<h2>
📊 Danh sách 33 học sinh lớp 97
</h2>


<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Xếp loại
</th>


<th>
AI
</th>


</tr>


</thead>



<tbody id="bangHocSinh">


</tbody>


</table>


</div>








<div class="box">


<h2>
🤖 Nhận xét AI
</h2>


<div id="ketQuaAI"

class="ai">

Chọn học sinh để phân tích...

</div>


</div>



</div>







<script>


// ================================
// LẤY DỮ LIỆU
// ================================


let danhSach = layHoSoHocSinh();






// ================================
// HIỂN THỊ MENU HỌC SINH
// ================================


function khoiTaoDanhSach(){


let select=document.getElementById(

"chonHocSinh"

);



danhSach.forEach(hs=>{


select.innerHTML +=`

<option value="${hs.hoTen}">

${hs.stt}. ${hs.hoTen}

</option>

`;

});


}




// ================================
// HIỂN THỊ HỒ SƠ
// ================================


function hienThiHoSo(){


let ten=document.getElementById(

"chonHocSinh"

).value;



let hs=timHocSinh(ten);



if(!hs)

return;




document.getElementById("hoTen").value=hs.hoTen;


document.getElementById("ngaySinh").value=hs.ngaySinh;


document.getElementById("phuHuynh").value=hs.phuHuynh;


document.getElementById("soDT").value=hs.soDT;


document.getElementById("hoanCanh").value=hs.hoanCanh;


document.getElementById("uuDiem").value=hs.uuDiem;


document.getElementById("hanChe").value=hs.hanChe;


}







// ================================
// LƯU HỒ SƠ
// ================================


function luuThongTin(){



let ten=document.getElementById(

"hoTen"

).value;



capNhatHocSinh(

ten,

{


ngaySinh:

document.getElementById("ngaySinh").value,


gioiTinh:

document.getElementById("gioiTinh").value,


phuHuynh:

document.getElementById("phuHuynh").value,


soDT:

document.getElementById("soDT").value,


hoanCanh:

document.getElementById("hoanCanh").value,


uuDiem:

document.getElementById("uuDiem").value,


hanChe:

document.getElementById("hanChe").value


}

);



alert(

"✅ Đã lưu hồ sơ"

);



}







// ================================
// AI NHẬN XÉT
// ================================


function phanTichAI(){


let ten=document.getElementById(

"hoTen"

).value;



let hs=timHocSinh(ten);



if(!hs)

return;



let text=`

🤖 PHÂN TÍCH HỌC SINH


👨‍🎓 ${hs.hoTen}


⭐ Điểm mạnh:

${hs.uuDiem || "Chưa cập nhật"}


⚠ Hạn chế:

${hs.hanChe || "Chưa cập nhật"}


👨‍👩‍👧 Hoàn cảnh:

${hs.hoanCanh || "Chưa cập nhật"}



📌 Đề xuất:


- GVCN tiếp tục theo dõi sự tiến bộ.

- Phối hợp phụ huynh thường xuyên.

- Động viên học sinh phát huy điểm mạnh.


`;



document.getElementById(

"ketQuaAI"

).innerText=text;



}






// ================================
// BẢNG DANH SÁCH
// ================================


function hienThiBang(){


let bang=document.getElementById(

"bangHocSinh"

);



danhSach.forEach(hs=>{


bang.innerHTML+=`

<tr>

<td>${hs.stt}</td>

<td>${hs.hoTen}</td>

<td>${hs.xepLoai || ""}</td>

<td>

<button onclick="chon('${hs.hoTen}')">

Xem

</button>

</td>

</tr>

`;

});


}



function chon(ten){


document.getElementById(

"chonHocSinh"

).value=ten;


hienThiHoSo();


}







window.onload=function(){


khoiTaoDanhSach();


hienThiBang();


};


</script>


</body>

</html>
