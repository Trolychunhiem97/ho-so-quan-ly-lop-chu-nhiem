<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Quản lý thi đua lớp 97</title>

<link rel="stylesheet" href="style.css">


<style>

body{
font-family:Arial;
background:#f2f7ff;
padding:20px;
}


.container{

background:white;
padding:25px;
border-radius:20px;

}


h1{

text-align:center;
color:#1565c0;

}


table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th{

background:#1565c0;
color:white;
padding:10px;

}


td{

border:1px solid #ddd;
padding:8px;
text-align:center;

}


button{

background:#1565c0;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
margin:10px;

}


</style>


</head>



<body>


<div class="container">


<h1>
📊 QUẢN LÝ THI ĐUA LỚP 97
</h1>



<h2>
📅 Kết quả tuần
</h2>



<table id="bangTuan">


<tr>

<th>Tuần</th>

<th>Ngày lưu</th>

<th>Điểm TB lớp</th>

<th>Số HS xuất sắc</th>

</tr>


</table>





<h2>
👨‍🎓 Chi tiết học sinh tuần gần nhất
</h2>



<table id="bangHocSinh">


<tr>

<th>STT</th>

<th>Họ và tên</th>

<th>Điểm</th>

<th>Xếp loại</th>

</tr>


</table>




<button onclick="location.href='thidua_tuan.html'">

⬅ Thi đua tuần

</button>


<button onclick="location.href='thidua_thang.html'">

📈 Thi đua tháng

</button>


<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>



</div>





<script>


let duLieu = 
JSON.parse(localStorage.getItem("ketQuaTuan97"));



let bangTuan =
document.getElementById("bangTuan");


let bangHS =
document.getElementById("bangHocSinh");





if(duLieu){


let tong=0;

let soXuatSac=0;



duLieu.hocSinh.forEach(hs=>{


tong += hs.diem;


if(hs.diem>=100)

soXuatSac++;


});



let diemTB=
(tong/duLieu.hocSinh.length).toFixed(2);



bangTuan.innerHTML += `

<tr>

<td>
Tuần ${duLieu.soTuan}
</td>


<td>
${duLieu.ngay}
</td>


<td>
${diemTB}
</td>


<td>
${soXuatSac}
</td>


</tr>

`;






duLieu.hocSinh.forEach((hs,index)=>{


bangHS.innerHTML += `

<tr>

<td>${index+1}</td>

<td>${hs.ten}</td>

<td>${hs.diem}</td>

<td>${hs.xeploai}</td>

</tr>


`;

});


}

else{


bangTuan.innerHTML +=`

<tr>

<td colspan="4">

Chưa có dữ liệu tuần. Vui lòng lưu kết quả từ Thi đua tuần.

</td>

</tr>

`;

}




</script>



</body>


</html>
