<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý thi đua lớp 97</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Arial;
background:#f2f7ff;
padding:20px;
}

.container{
background:white;
padding:25px;
border-radius:15px;
}

h1{
text-align:center;
color:#1565c0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#1565c0;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

button{
background:#1565c0;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
margin:10px;
}

button:hover{
background:#0d47a1;
}

input{
padding:8px;
}

</style>

</head>


<body>

<div class="container">


<h1>
📊 QUẢN LÝ THI ĐUA LỚP 97
</h1>


<h3>
Tổng hợp kết quả các tuần
</h3>


<table id="bang">

<tr>

<th>Tuần</th>

<th>Thời gian</th>

<th>Điểm TB lớp</th>

<th>Số HS xuất sắc</th>

<th>Ghi chú</th>

</tr>


</table>



<h3>
🏆 XẾP HẠNG THI ĐUA THÁNG
</h3>


<table id="xephang">

<tr>

<th>Hạng</th>

<th>Họ và tên</th>

<th>Điểm tháng</th>

<th>Xếp loại</th>

</tr>


</table>



<button onclick="themTuan()">
➕ Thêm tuần
</button>


<button onclick="xoaDuLieu()">
🗑 Xóa dữ liệu
</button>


<button onclick="location.href='index.html'">
⬅ Trang chủ
</button>


</div>



<script>


let danhSachTuan = 
JSON.parse(localStorage.getItem("tuan97")) || [];



function hienThi(){


let bang=document.getElementById("bang");


bang.innerHTML=
`
<tr>
<th>Tuần</th>
<th>Thời gian</th>
<th>Điểm TB lớp</th>
<th>Số HS xuất sắc</th>
<th>Ghi chú</th>
</tr>
`;



danhSachTuan.forEach((t,i)=>{


let row=bang.insertRow();


row.innerHTML=
`
<td>Tuần ${i+1}</td>

<td>${t.ngay}</td>

<td>${t.diem}</td>

<td>${t.xs}</td>

<td>${t.ghichu}</td>

`;

});


}


function themTuan(){


let ngay=
prompt("Nhập thời gian tuần:");

if(!ngay) return;


let diem=
prompt("Nhập điểm trung bình lớp:");

let xs=
prompt("Nhập số học sinh xuất sắc:");

let ghichu=
prompt("Ghi chú:");



danhSachTuan.push({

ngay:ngay,

diem:diem,

xs:xs,

ghichu:ghichu

});



localStorage.setItem(
"tuan97",
JSON.stringify(danhSachTuan)
);



hienThi();


}



function xoaDuLieu(){

if(confirm("Xóa toàn bộ dữ liệu?")){


localStorage.removeItem("tuan97");


location.reload();


}

}


hienThi();


</script>


</body>
</html>
