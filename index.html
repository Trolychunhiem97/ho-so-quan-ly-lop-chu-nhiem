<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Trợ lý quản lý lớp 97
</title>


<script src="phanquyen.js"></script>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:"Segoe UI",Arial,sans-serif;

background:linear-gradient(
135deg,
#1565c0,
#90caf9
);

}




.container{

width:420px;

background:white;

padding:35px;

border-radius:30px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

}



.logo{

text-align:center;

font-size:60px;

}



h1{

text-align:center;

color:#1565c0;

font-size:28px;

}



.subtitle{

text-align:center;

color:#666;

margin-bottom:30px;

}



label{

font-weight:bold;

display:block;

margin-bottom:8px;

}



select,
input{

width:100%;

padding:14px;

border-radius:15px;

border:1px solid #ccc;

font-size:16px;

margin-bottom:18px;

}



.password-box{

position:relative;

}



.password-box button{


position:absolute;

right:8px;

top:5px;

width:45px;

height:45px;

border:none;

background:#eef5ff;

border-radius:10px;

cursor:pointer;

font-size:18px;

}



.login{


width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#1565c0;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.login:hover{

background:#0d47a1;

}



#error{

text-align:center;

color:red;

font-weight:bold;

height:25px;

}



.footer{

text-align:center;

margin-top:25px;

color:#777;

font-size:14px;

}



</style>


</head>



<body>



<div class="container">



<div class="logo">

🤖

</div>




<h1>

TRỢ LÝ QUẢN LÝ LỚP 97

</h1>



<p class="subtitle">

🏫 Trường THCS Trần Phú

<br>

GVCN Trần Sáng

</p>





<label>

👤 Vai trò

</label>



<select id="vaiTro">


<option value="gvcn">

Giáo viên chủ nhiệm

</option>


<option value="loptruong">

Lớp trưởng

</option>


<option value="hoctap">

Lớp phó học tập

</option>


<option value="laodong">

Lớp phó lao động

</option>


<option value="totruong">

Tổ trưởng

</option>


</select>






<label>

Tên đăng nhập

</label>


<input 

id="taiKhoan"

placeholder="Nhập tài khoản">







<label>

Mật khẩu

</label>



<div class="password-box">


<input

id="matKhau"

type="password"

placeholder="Nhập mật khẩu">



<button onclick="anHienMatKhau()">

👁

</button>



</div>








<button class="login"

onclick="dangNhap()">

🔐 Đăng nhập hệ thống

</button>





<p id="error"></p>






<div class="footer">


🤖 Trợ lý quản lý lớp 97

<br>

GVCN Trần Sáng

</div>



</div>








<script>


// =============================
// XỬ LÝ ĐĂNG NHẬP
// =============================


function dangNhap(){



let user = document.getElementById(
"taiKhoan"
).value.trim();



let pass = document.getElementById(
"matKhau"
).value.trim();



let thongBao =
document.getElementById("error");





if(user==="" || pass===""){


thongBao.innerHTML=
"⚠ Vui lòng nhập đầy đủ thông tin";


return;


}





let ketQua = dangNhapTaiKhoan(
user,
pass
);






if(ketQua){



window.location.href="trangchu.html";



}

else{


thongBao.innerHTML=
"❌ Sai tài khoản hoặc mật khẩu";


}



}







// =============================
// ẨN HIỆN MẬT KHẨU
// =============================


function anHienMatKhau(){



let o =
document.getElementById(
"matKhau"
);



if(o.type==="password"){


o.type="text";


}

else{


o.type="password";


}



}



</script>



</body>


</html>
