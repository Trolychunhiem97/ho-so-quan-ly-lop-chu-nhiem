<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>

<link rel="stylesheet" href="style_mobile.css">


<link rel="manifest" href="manifest.json">


<meta name="theme-color" content="#1565c0">



<script src="phanquyen.js"></script>


<style>

body{

font-family:Arial,sans-serif;

background:#eef5ff;

margin:0;

padding:15px;

}


.container{

max-width:1200px;

margin:auto;

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 10px 30px #ccc;

}



h1,h2{

text-align:center;

color:#1565c0;

}



.header{

text-align:center;

background:#e3f2fd;

padding:20px;

border-radius:20px;

}



.user{

margin-top:15px;

background:white;

padding:15px;

border-radius:15px;

}



.menu{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:25px;

}



.card{

background:#f8fbff;

border-radius:20px;

padding:25px;

text-align:center;

border:1px solid #ddd;

}



.card h3{

color:#1565c0;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 25px;

border-radius:12px;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



.hide{

display:none;

}



.footer{

margin-top:40px;

text-align:center;

color:#666;

border-top:1px solid #ddd;

padding-top:20px;

}



@media(max-width:600px){


.menu{

grid-template-columns:1fr;

}



button{

width:100%;

margin-top:10px;

}


}


</style>


</head>

<script>


// ============================
// KIỂM TRA ĐĂNG NHẬP
// ============================



let user = layNguoiDung();



if(!user){


location.href="dangnhap.html";


}





document.getElementById(

"nguoiDung"

).innerHTML=

`

👤 Xin chào:

<b>${user.ten}</b>

<br>

🔐 Quyền:

<b>${user.quyen}</b>

`;









// ============================
// PHÂN QUYỀN HIỂN THỊ
// ============================



function anTatCa(){


document.querySelectorAll(

".card"

)

.forEach(

(x)=>x.style.display="none"

);


}





function hienTheoQuyen(){



anTatCa();





if(user.quyen=="gvcn"){


document.querySelectorAll(

".card"

)

.forEach(

(x)=>x.style.display="block"

);


}





if(user.quyen=="loptruong"){


document.querySelectorAll(

".loptruong"

)

.forEach(

(x)=>x.style.display="block"

);


}





if(user.quyen=="hoc_tap"){


document.querySelectorAll(

".hoc_tap"

)

.forEach(

(x)=>x.style.display="block"

);


}





if(user.quyen=="lao_dong"){


document.querySelectorAll(

".lao_dong"

)

.forEach(

(x)=>x.style.display="block"

);


}





if(user.quyen=="to_truong"){


document.querySelectorAll(

".to_truong"

)

.forEach(

(x)=>x.style.display="block"

);


}



}







function moTrang(trang){


location.href=trang;


}






hienTheoQuyen();








// PWA

if(

"serviceWorker" in navigator

){


navigator.serviceWorker.register(

"service-worker.js"

);


}


</script>
