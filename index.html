<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Trợ lý quản lý lớp 97
</title>


<script src="phanquyen.js"></script>


<style>


body{

font-family:"Segoe UI",Arial,sans-serif;

background:#eef5ff;

margin:0;

padding:20px;

}


.container{

max-width:1200px;

margin:auto;

background:white;

border-radius:25px;

padding:30px;

box-shadow:0 10px 30px #ccc;

}



.header{

text-align:center;

}



.header h2{

color:#1565c0;

font-size:32px;

}



.header h1{

color:#1565c0;

font-size:42px;

}



.user{

margin-top:20px;

background:#eaf3ff;

padding:20px;

border-radius:20px;

text-align:center;

font-size:22px;

}



.menu{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(230px,1fr));

gap:20px;

margin-top:30px;

}



.card{

background:#f8fbff;

border-radius:20px;

padding:25px;

text-align:center;

border:1px solid #ddd;

}



.card h3{

color:#1565c0;

}



button{

background:#1565c0;

color:white;

border:none;

padding:13px 30px;

border-radius:12px;

font-size:17px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



.footer{

text-align:center;

margin-top:40px;

color:#666;

border-top:1px solid #ddd;

padding-top:20px;

}



</style>

</head>



<body>


<div class="container">



<div class="header">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
🤖 TRỢ LÝ QUẢN LÝ LỚP 97
</h1>


<p>

GVCN:

<b>
Trần Sáng
</b>

</p>


</div>





<div class="user" id="userBox">

</div>







<div class="menu">



<div class="card gvcn">

<h3>
📊 Tổng hợp năm
</h3>

<button onclick="moTrang('tonghop_nam.html')">
Mở
</button>

</div>



<div class="card gvcn">

<h3>
📄 Xuất báo cáo
</h3>

<button onclick="moTrang('xuat_tonghop_word.html')">
Mở
</button>

</div>



<div class="card gvcn">

<h3>
👨‍👩‍👧 Quản lý phụ huynh
</h3>

<button onclick="moTrang('quanly_phuhuynh.html')">
Mở
</button>

</div>



<div class="card gvcn">

<h3>
🔔 Thông báo phụ huynh
</h3>

<button onclick="moTrang('thongbao_phuhuynh.html')">
Mở
</button>

</div>



<div class="card gvcn">

<h3>
💾 Sao lưu dữ liệu
</h3>

<button onclick="moTrang('backup.html')">
Mở
</button>

</div>




<div class="card loptruong">

<h3>
🏆 Thi đua tuần
</h3>

<button onclick="moTrang('thidua_tuan.html')">
Mở
</button>

</div>




<div class="card hoc_tap">

<h3>
📚 Học tập
</h3>

<button onclick="moTrang('hoctap.html')">
Mở
</button>

</div>




<div class="card lao_dong">

<h3>
🧹 Lao động
</h3>

<button onclick="moTrang('laodong.html')">
Mở
</button>

</div>




<div class="card to_truong">

<h3>
👥 Tổ trưởng
</h3>

<button onclick="moTrang('totruong.html')">
Mở
</button>

</div>



</div>




<br>


<div style="text-align:center">


<button onclick="dangXuat()">

🚪 Đăng xuất

</button>


</div>





<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>



</div>






<script>


// ================================
// LẤY NGƯỜI DÙNG
// ================================


let user = layNguoiDung();





if(!user){


location.href="dangnhap.html";


}





// ================================
// SỬA QUYỀN CŨ ADMIN
// ================================


if(user.quyen=="admin"){


user.quyen="gvcn";


localStorage.setItem(

"nguoiDungDangNhap",

JSON.stringify(user)

);


}







document.getElementById(

"userBox"

).innerHTML=


`

👤 Xin chào:

<b>${user.ten}</b>

<br>

🔐 Quyền:

<b>${user.quyen}</b>

`;








// ================================
// ẨN TẤT CẢ MENU
// ================================


document.querySelectorAll(".card")

.forEach(

x=>x.style.display="none"

);







// ================================
// HIỂN THỊ THEO QUYỀN
// ================================


if(user.quyen=="gvcn"){



document.querySelectorAll(".card")

.forEach(

x=>x.style.display="block"

);



}




if(user.quyen=="loptruong"){


document.querySelector(".loptruong")

.style.display="block";


}



if(user.quyen=="hoc_tap"){


document.querySelector(".hoc_tap")

.style.display="block";


}



if(user.quyen=="lao_dong"){


document.querySelector(".lao_dong")

.style.display="block";


}



if(user.quyen=="to_truong"){


document.querySelector(".to_truong")

.style.display="block";


}







function moTrang(trang){

location.href=trang;

}



</script>



</body>

</html>
