<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Trợ lý quản lý lớp 97
</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:"Segoe UI",Arial;

background:linear-gradient(
135deg,
#1565c0,
#90caf9
);

}



.container{


width:420px;

background:white;

padding:35px;

border-radius:30px;

box-shadow:0 15px 40px rgba(0,0,0,.25);


}



.logo{

text-align:center;

font-size:60px;

}



h1{

text-align:center;

color:#1565c0;

font-size:28px;

}



.sub{

text-align:center;

color:#666;

margin-bottom:30px;

}



label{

font-weight:bold;

display:block;

margin-bottom:8px;

}



select,input{


width:100%;

padding:14px;

margin-bottom:20px;

border-radius:15px;

border:1px solid #ccc;

font-size:16px;


}



.password{

position:relative;

}



.password button{


position:absolute;

right:8px;

top:7px;

width:45px;

padding:8px;

background:#eee;

color:#1565c0;

font-size:18px;


}



.login{


width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#1565c0;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;


}



.login:hover{

background:#0d47a1;

}



#error{


color:red;

text-align:center;

font-weight:bold;

height:25px;

}



.footer{

margin-top:30px;

text-align:center;

color:#777;

font-size:14px;

}


</style>


</head>


<body>



<div class="container">



<div class="logo">
🤖
</div>



<h1>
TRỢ LÝ QUẢN LÝ LỚP 97
</h1>


<p class="sub">

GVCN Trần Sáng

</p>





<label>
👤 Vai trò
</label>


<select id="vaiTro">


<option value="gvcn">

Giáo viên chủ nhiệm

</option>


<option value="loptruong">

Lớp trưởng

</option>


<option value="to1">

Tổ trưởng tổ 1

</option>


<option value="to2">

Tổ trưởng tổ 2

</option>


<option value="to3">

Tổ trưởng tổ 3

</option>


<option value="to4">

Tổ trưởng tổ 4

</option>


</select>





<label>

Tên đăng nhập

</label>


<input id="taiKhoan"

placeholder="Nhập tài khoản">





<label>

Mật khẩu

</label>



<div class="password">


<input id="matKhau"

type="password"

placeholder="Nhập mật khẩu">


<button onclick="anHienMatKhau()">

👁

</button>


</div>





<button class="login"

onclick="dangNhap()">

🔐 Đăng nhập hệ thống

</button>




<p id="error"></p>






<div class="footer">

Trường THCS Trần Phú

<br>

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>



</div>








<script>


// ================================
// TÀI KHOẢN HỆ THỐNG
// ================================



const USERS={


gvcn:{


username:"gvcn97",

password:"123456",

name:"GVCN Trần Sáng",

role:"all"


},



loptruong:{


username:"loptruong97",

password:"123456",

name:"Lớp trưởng",

role:"thi_dua"


},



to1:{


username:"to1",

password:"123456",

name:"Tổ trưởng tổ 1",

role:"to"


},



to2:{


username:"to2",

password:"123456",

name:"Tổ trưởng tổ 2",

role:"to"


},



to3:{


username:"to3",

password:"123456",

name:"Tổ trưởng tổ 3",

role:"to"


},



to4:{


username:"to4",

password:"123456",

name:"Tổ trưởng tổ 4",

role:"to"


}


};






// ================================
// ĐĂNG NHẬP
// ================================


function dangNhap(){



let vaiTro=document.getElementById(

"vaiTro"

).value;



let user=document.getElementById(

"taiKhoan"

).value.trim();



let pass=document.getElementById(

"matKhau"

).value.trim();



let error=document.getElementById(

"error"

);




let data=USERS[vaiTro];





if(

user===data.username &&

pass===data.password

){



localStorage.setItem(

"nguoiDung97",

JSON.stringify({

ten:data.name,

vaiTro:vaiTro,

quyen:data.role

})

);



window.location.href="trangchu.html";



}

else{


error.innerHTML=

"❌ Sai tài khoản hoặc mật khẩu";


}



}







// ================================
// ẨN HIỆN MẬT KHẨU
// ================================


function anHienMatKhau(){



let mk=document.getElementById(

"matKhau"

);



if(mk.type==="password"){


mk.type="text";


}

else{


mk.type="password";


}



}



</script>



</body>

</html>
