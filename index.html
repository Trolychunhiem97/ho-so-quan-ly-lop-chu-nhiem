<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Trợ lý quản lý lớp 97
</title>


<script src="phanquyen.js"></script>


<style>


body{

font-family:Arial;

background:#eef5ff;

margin:0;

padding:20px;

}



.container{

max-width:1100px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

}



h1,h2{

text-align:center;

color:#1565c0;

}



.user{

text-align:center;

background:#e3f2fd;

padding:20px;

border-radius:20px;

font-size:18px;

}



.menu{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}



.card{

background:#f8fbff;

padding:25px;

border-radius:20px;

text-align:center;

border:1px solid #ddd;

}



button{

background:#1565c0;

color:white;

padding:12px 25px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

}



.hide{

display:none;

}



</style>


</head>



<body>


<div class="container">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
🤖 TRỢ LÝ QUẢN LÝ LỚP 97
</h1>



<div class="user" id="userBox">

</div>



<div class="menu">



<div class="card gvcn">

<h3>
📊 Tổng hợp năm
</h3>

<button onclick="mo('tonghop_nam.html')">
Mở
</button>

</div>



<div class="card gvcn">

<h3>
📄 Xuất báo cáo
</h3>

<button onclick="mo('xuat_tonghop_word.html')">
Mở
</button>

</div>



<div class="card gvcn">

<h3>
👨‍👩‍👧 Quản lý phụ huynh
</h3>

<button onclick="mo('quanly_phuhuynh.html')">
Mở
</button>

</div>




<div class="card loptruong">

<h3>
🏆 Thi đua tuần
</h3>

<button onclick="mo('thidua_tuan.html')">
Mở
</button>

</div>



<div class="card hoc_tap">

<h3>
📚 Học tập
</h3>

<button onclick="mo('hoctap.html')">
Mở
</button>

</div>



<div class="card lao_dong">

<h3>
🧹 Lao động
</h3>

<button onclick="mo('laodong.html')">
Mở
</button>

</div>




<div class="card to_truong">

<h3>
👥 Tổ trưởng
</h3>

<button onclick="mo('totruong.html')">
Mở
</button>

</div>



</div>


<br>


<div style="text-align:center">

<button onclick="dangXuat()">

🚪 Đăng xuất

</button>

</div>



</div>





<script>


let user=

layNguoiDung();





if(!user){


location.href="dangnhap.html";


}





document.getElementById(

"userBox"

).innerHTML=


`

👤 Xin chào:

<b>${user.ten}</b>

<br>

🔐 Quyền:

<b>${user.quyen}</b>

`;





// Ẩn toàn bộ

document.querySelectorAll(".card")

.forEach(

(x)=>x.style.display="none"

);





// GVCN xem tất cả


if(user.quyen=="gvcn"){


document.querySelectorAll(".card")

.forEach(

(x)=>x.style.display="block"

);


}




// Các quyền khác


if(user.quyen=="loptruong"){


document.querySelectorAll(".loptruong")

.forEach(

(x)=>x.style.display="block"

);


}



if(user.quyen=="hoc_tap"){


document.querySelectorAll(".hoc_tap")

.forEach(

(x)=>x.style.display="block"

);


}



if(user.quyen=="lao_dong"){


document.querySelectorAll(".lao_dong")

.forEach(

(x)=>x.style.display="block"

);


}



if(user.quyen=="to_truong"){


document.querySelectorAll(".to_truong")

.forEach(

(x)=>x.style.display="block"

);


}




function mo(trang){

location.href=trang;

}



</script>



</body>

</html>
