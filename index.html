<script>


// Kiểm tra đăng nhập


let nguoiDung =

localStorage.getItem(

"nguoiDungDangNhap"

);



if(!nguoiDung){


alert(

"⚠ Vui lòng đăng nhập trước!"

);


location.href="dangnhap.html";


}





// Hiển thị thông tin người dùng


function hienThiNguoiDung(){


let user=

JSON.parse(

nguoiDung

);



document.getElementById(

"nguoiDung"

).innerHTML=


"👤 Xin chào: <b>"

+

user.ten

+

"</b> | Quyền: "

+

user.quyen;



}





// Đăng xuất


function dangXuat(){



if(

confirm(

"Bạn muốn đăng xuất?"

)

){



localStorage.removeItem(

"nguoiDungDangNhap"

);



location.href="dangnhap.html";



}


}






window.onload=function(){



hienThiNguoiDung();



if(typeof apDungPhanQuyen==="function"){


apDungPhanQuyen();



}



}
