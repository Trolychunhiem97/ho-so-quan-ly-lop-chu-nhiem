<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Trợ lý quản lý lớp 97</title>


<script src="phanquyen.js"></script>



<style>


body{

font-family:Arial,sans-serif;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:35px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}



h1,h2{

text-align:center;

color:#1565c0;

}



.user{

text-align:center;

background:#f2f7ff;

padding:20px;

border-radius:15px;

font-size:18px;

}



.menu{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:30px;

}



.box{

background:#f7fbff;

padding:25px;

border-radius:20px;

text-align:center;

border:1px solid #ddd;

}



.box h3{

color:#1565c0;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

cursor:pointer;

font-size:16px;

}



button:hover{

background:#0d47a1;

}



.footer{

text-align:center;

margin-top:40px;

border-top:1px solid #ddd;

padding-top:20px;

color:#555;

}



.an{

display:none;

}



</style>


</head>



<body>



<div class="container">



<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>



<h1>
🤖 TRỢ LÝ QUẢN LÝ LỚP 97
</h1>




<div class="user" id="nguoiDung">

</div>






<div class="menu">



<!-- GVCN -->

<div class="box gvcn">


<h3>
📊 Tổng hợp năm
</h3>


<button onclick="moTrang('tonghop_nam.html')">

Mở

</button>


</div>





<div class="box gvcn">


<h3>
📄 Xuất báo cáo Word
</h3>


<button onclick="moTrang('xuat_tonghop_word.html')">

Mở

</button>


</div>





<div class="box gvcn">


<h3>
👨‍👩‍👧 Quản lý phụ huynh
</h3>


<button onclick="moTrang('quanly_phuhuynh.html')">

Mở

</button>


</div>





<div class="box gvcn">


<h3>
🔔 Thông báo phụ huynh
</h3>


<button onclick="moTrang('thongbao_phuhuynh.html')">

Mở

</button>


</div>



<!-- Lớp trưởng -->


<div class="box loptruong">


<h3>
🏆 Thi đua tuần
</h3>


<button onclick="moTrang('thidua_tuan.html')">

Mở

<!-- Học tập -->

<h3>
📚 Theo dõi học tập
</h3>

</button>


</div>





<!-- Lao động -->


<div class="box lao_dong">


<h3>
🧹 Theo dõi lao động
</h3>


<button onclick="moTrang('laodong.html')">

Mở

</button>


</div>





<!-- Tổ trưởng -->


<div class="box to_truong">


<h3>
👥 Đánh giá tổ
</h3>


<button onclick="moTrang('totruong.html')">

Mở

</button>


</div>

<script>


// ==================================
// LẤY NGƯỜI DÙNG HIỆN TẠI
// ==================================


let user = layNguoiDung();





if(!user){


alert(

"Vui lòng đăng nhập!"

);


location.href="dangnhap.html";


}





document.getElementById(

"nguoiDung"

).innerHTML=


`
👤 Xin chào:

<b>

${user.ten}

</b>

<br>

Quyền:

<b>

${user.quyen}

</b>

`;









// ==================================
// ẨN HIỆN MENU THEO QUYỀN
// ==================================


function hienThiQuyen(){



let cacBox=

document.querySelectorAll(

".box"

);





cacBox.forEach(box=>{


box.style.display="none";


});








// GVCN xem tất cả


if(user.quyen=="gvcn"){



document.querySelectorAll(

".gvcn"

)

.forEach(

(x)=>x.style.display="block"

);



document.querySelectorAll(

".loptruong,.hoc_tap,.lao_dong,.to_truong"

)

.forEach(

(x)=>x.style.display="block"

);



}






// Lớp trưởng


if(user.quyen=="loptruong"){


document.querySelectorAll(

".loptruong"

)

.forEach(

(x)=>x.style.display="block"

);



}








// Lớp phó học tập


if(user.quyen=="hoc_tap"){


document.querySelectorAll(

".hoc_tap"

)

.forEach(

(x)=>x.style.display="block"

);



}








// Lớp phó lao động


if(user.quyen=="lao_dong"){


document.querySelectorAll(

".lao_dong"

)

.forEach(

(x)=>x.style.display="block"

);



}








// Tổ trưởng


if(user.quyen=="to_truong"){


document.querySelectorAll(

".to_truong"

)

.forEach(

(x)=>x.style.display="block"

);



}





}









// ==================================
// MỞ TRANG
// ==================================



function moTrang(trang){



location.href=trang;



}








// ==================================
// ĐĂNG XUẤT
// ==================================



function dangXuat(){



localStorage.removeItem(

"nguoiDungDangNhap"

);



location.href="dangnhap.html";



}






// thêm nút đăng xuất


document.querySelector(

".user"

).innerHTML +=



`

<br><br>

<button onclick="dangXuat()">

🚪 Đăng xuất

</button>

`;









window.onload=function(){


hienThiQuyen();


};



</script>



</body>

</html>
