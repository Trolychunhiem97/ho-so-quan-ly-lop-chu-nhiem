<title>

<style>


*{

box-sizing:border-box;

}



body{

margin:0;

font-family:"Segoe UI",Arial,sans-serif;

135deg,

);

}





.container{

}

}

color:#1565c0;

}



.sub{

}





.input-group{

}



label{

display:block;

font-weight:bold;

margin-bottom:8px;

}



input,select{

}

<body>



<div class="container">


<div class="logo">

🤖

</div>



<h1>

TRỢ LÝ QUẢN LÝ LỚP 97

</h1>



<p class="sub">

GVCN Trần Sáng

</p>





<div class="input-group">


<label>

👤 Vai trò

</label>


<select id="vaiTro">


<option value="gvcn">

Giáo viên chủ nhiệm

</option>


<option value="loptruong">

Lớp trưởng

</option>


<option value="to1">

Tổ trưởng tổ 1

</option>


<option value="to2">

Tổ trưởng tổ 2

</option>


<option value="to3">

Tổ trưởng tổ 3

</option>


<option value="to4">

Tổ trưởng tổ 4

</option>


</select>


</div>







<div class="input-group">


<label>

Tên đăng nhập

</label>


<input id="taiKhoan"

placeholder="Nhập tài khoản">


</div>







<div class="input-group">


<label>

Mật khẩu

</label>


<input id="matKhau"

type="password"

placeholder="Nhập mật khẩu">


</div>







<button onclick="dangNhap()">

🔐 Đăng nhập hệ thống

</button>



<p id="error"></p>







<div class="note">


<b>Tài khoản mẫu:</b>


<br>


👨‍🏫 GVCN:

<br>

gvcn97 / 123456


<br><br>


👑 Lớp trưởng:

<br>

loptruong97 / 123456


</div>







<div class="footer">


Trường THCS Trần Phú

<br>

Trợ lý quản lý lớp 97 - GVCN Trần Sáng


</div>



</div>





<script>


<script>


// ======================================
// HỆ THỐNG ĐĂNG NHẬP LỚP 97
// ======================================



const taiKhoanHeThong = {



gvcn:{


ten:"Giáo viên chủ nhiệm",


matKhau:"123456",


quyen:"all"



},




loptruong:{


ten:"Lớp trưởng",


matKhau:"123456",


quyen:"thi_dua"



},





to1:{


ten:"Tổ trưởng tổ 1",


matKhau:"123456",


quyen:"to"



},




to2:{


ten:"Tổ trưởng tổ 2",


matKhau:"123456",


quyen:"to"



},




to3:{


ten:"Tổ trưởng tổ 3",


matKhau:"123456",


quyen:"to"



},




to4:{


ten:"Tổ trưởng tổ 4",


matKhau:"123456",


quyen:"to"



}



};








// ======================================
// ĐĂNG NHẬP
// ======================================


function dangNhap(){



let vaiTro = document.getElementById(

"vaiTro"

).value;




let matKhau = document.getElementById(

"matKhau"

).value;




let taiKhoan = document.getElementById(

"taiKhoan"

).value.trim();







let thongBao = document.getElementById(

"error"

);





if(!taiKhoan || !matKhau){


thongBao.innerHTML=

"⚠ Vui lòng nhập đầy đủ thông tin";


return;


}







let user = taiKhoanHeThong[vaiTro];






if(

taiKhoan == vaiTro+"97"

&&

matKhau == user.matKhau

){





let nguoiDung={


taiKhoan:taiKhoan,


vaiTro:vaiTro,


ten:user.ten,


quyen:user.quyen


};






localStorage.setItem(

"nguoiDung97",

JSON.stringify(nguoiDung)

);






window.location.href=

"trangchu.html";





}

else{



thongBao.innerHTML=

"❌ Sai tài khoản hoặc mật khẩu";



}



}





</script>
