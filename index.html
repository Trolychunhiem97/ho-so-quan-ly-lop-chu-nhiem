<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Đăng nhập - Trợ lý quản lý lớp 97
</title>


<script src="phanquyen.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

font-family:"Segoe UI",Arial;

background:linear-gradient(135deg,#1565c0,#90caf9);

}



.box{

width:420px;

background:white;

padding:35px;

border-radius:30px;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}



.logo{

text-align:center;

font-size:60px;

}



h1{

text-align:center;

color:#1565c0;

font-size:28px;

}



p.title{

text-align:center;

color:#666;

}



label{

font-weight:bold;

display:block;

margin-top:15px;

}



select,input{

width:100%;

padding:14px;

margin-top:8px;

border-radius:15px;

border:1px solid #ccc;

font-size:16px;

}



.pass{

position:relative;

}



.pass button{

position:absolute;

right:8px;

top:8px;

border:none;

background:#eee;

padding:10px;

border-radius:10px;

cursor:pointer;

}



.login{

margin-top:25px;

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#1565c0;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.login:hover{

background:#0d47a1;

}



#error{

color:red;

text-align:center;

height:25px;

font-weight:bold;

}



.footer{

text-align:center;

margin-top:25px;

color:#777;

font-size:14px;

}


</style>

</head>



<body>


<div class="box">


<div class="logo">
🤖
</div>


<h1>
TRỢ LÝ QUẢN LÝ LỚP 97
</h1>


<p class="title">

🏫 Trường THCS Trần Phú

<br>

GVCN Trần Sáng

</p>




<label>
👤 Vai trò
</label>


<select id="vaiTro">


<option value="gvcn">
Giáo viên chủ nhiệm
</option>


<option value="loptruong">
Lớp trưởng
</option>


<option value="hoctap">
Lớp phó học tập
</option>


<option value="laodong">
Lớp phó lao động
</option>


<option value="totruong">
Tổ trưởng
</option>


</select>




<label>
Tên đăng nhập
</label>


<input id="taiKhoan"
placeholder="Nhập tài khoản">





<label>
Mật khẩu
</label>


<div class="pass">


<input id="matKhau"
type="password"
placeholder="Nhập mật khẩu">


<button onclick="hienMatKhau()">
👁
</button>


</div>




<button class="login"
onclick="dangNhap()">

🔐 Đăng nhập hệ thống

</button>



<p id="error"></p>



<div class="footer">

Trợ lý quản lý lớp 97

<br>

GVCN Trần Sáng

</div>



</div>






<script>


function dangNhap(){


let user=document.getElementById("taiKhoan").value.trim();

let pass=document.getElementById("matKhau").value.trim();


let tb=document.getElementById("error");



if(user=="" || pass==""){


tb.innerHTML="⚠ Chưa nhập đủ thông tin";

return;

}



let ketqua=dangNhapTaiKhoan(user,pass);



if(ketqua){


window.location.href="trangchu.html";


}
else{


tb.innerHTML="❌ Sai tài khoản hoặc mật khẩu";


}


}







function hienMatKhau(){


let o=document.getElementById("matKhau");


if(o.type==="password"){

o.type="text";

}

else{

o.type="password";

}


}


</script>



</body>

</html>
