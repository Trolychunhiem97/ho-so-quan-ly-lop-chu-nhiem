<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Tổ trưởng đánh giá lớp 97</title>


<script src="phanquyen.js"></script>

<script src="danhsach.js"></script>



<style>


body{

font-family:Arial,sans-serif;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1100px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}



h1,h2{

text-align:center;

color:#1565c0;

}



.user{

text-align:center;

background:#f2f7ff;

padding:15px;

border-radius:15px;

font-size:18px;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



input,select,textarea{

width:95%;

padding:8px;

border-radius:8px;

border:1px solid #ccc;

}



textarea{

height:60px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

font-size:16px;

cursor:pointer;

margin-top:20px;

}



button:hover{

background:#0d47a1;

}



.footer{

text-align:center;

margin-top:30px;

border-top:1px solid #ddd;

padding-top:20px;

color:#555;

}



</style>


</head>



<body>



<div class="container">



<h2>

🏫 TRƯỜNG THCS TRẦN PHÚ

</h2>



<h1>

👥 ĐÁNH GIÁ THÀNH VIÊN TỔ

</h1>



<div class="user" id="nguoiDung">

</div>





<h3>

📌 Chọn tổ đánh giá:

</h3>



<select id="chonTo">

<option value="to1">

Tổ 1

</option>


<option value="to2">

Tổ 2

</option>


<option value="to3">

Tổ 3

</option>


<option value="to4">

Tổ 4

</option>


</select>





<table id="bangDanhGia">


<tr>


<th>

STT

</th>


<th>

Họ tên

</th>


<th>

Ý thức

</th>


<th>

Chuyên cần

</th>


<th>

Điểm cộng/trừ

</th>


<th>

Nhận xét

</th>


</tr>


</table>






<button onclick="luuDanhGia()">

💾 Lưu đánh giá tổ

</button>




<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>






<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>

<script>


// ===============================
// KIỂM TRA NGƯỜI DÙNG
// ===============================


let nguoiDung =

JSON.parse(

localStorage.getItem(

"nguoiDungDangNhap"

)

);




if(!nguoiDung){


alert(

"⚠ Vui lòng đăng nhập!"

);


location.href="dangnhap.html";


}






document.getElementById(

"nguoiDung"

).innerHTML=


"👤 Xin chào: <b>"

+

nguoiDung.ten

+

"</b>";







// ===============================
// DỮ LIỆU HỌC SINH MẪU THEO TỔ
// ===============================
//
// Sau này sẽ thay bằng danh sách từ Excel
//


let danhSachTo={



to1:[

"Nguyễn Văn A",

"Trần Văn B",

"Lê Thị C",

"Phạm Văn D"

],



to2:[

"Nguyễn Văn E",

"Trần Văn F",

"Lê Thị G"

],



to3:[

"Nguyễn Văn H",

"Trần Văn I"

],



to4:[

"Nguyễn Văn K",

"Trần Văn L"

]



};







// ===============================
// HIỂN THỊ BẢNG
// ===============================



function hienThiDanhGia(){



let to =

document.getElementById(

"chonTo"

).value;





let ds=

danhSachTo[to];





let bang=

document.getElementById(

"bangDanhGia"

);





bang.innerHTML=`

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Ý thức</th>

<th>Chuyên cần</th>

<th>Điểm cộng/trừ</th>

<th>Nhận xét</th>

</tr>

`;







ds.forEach(

(hs,index)=>{



bang.innerHTML +=`

<tr>


<td>${index+1}</td>


<td>${hs}</td>


<td>

<select class="yThuc">

<option>Tốt</option>

<option>Khá</option>

<option>Cần cố gắng</option>

</select>

</td>



<td>

<select class="chuyenCan">

<option>Đầy đủ</option>

<option>Đi muộn</option>

<option>Nghỉ học</option>

</select>

</td>



<td>

<input 

class="diem"

type="number"

value="0">

</td>



<td>

<textarea 

class="nhanXet"

placeholder="Nhận xét">

</textarea>

</td>



</tr>

`;



});



}








// Khi đổi tổ

document

.getElementById(

"chonTo"

)

.addEventListener(

"change",

hienThiDanhGia

);








// ===============================
// LƯU ĐÁNH GIÁ
// ===============================



function luuDanhGia(){



let to =

document.getElementById(

"chonTo"

).value;





let bang=

document.getElementById(

"bangDanhGia"

);





let dong=

bang.querySelectorAll(

"tr"

);





let ketQua=[];






for(let i=1;i<dong.length;i++){



let o=

dong[i].children;



ketQua.push({



ten:

o[1].innerText,



yThuc:

o[2].querySelector("select").value,



chuyenCan:

o[3].querySelector("select").value,



diem:

o[4].querySelector("input").value,



nhanXet:

o[5].querySelector("textarea").value



});



}






let data=

JSON.parse(

localStorage.getItem(

"danhGiaTo97"

)

)

||{};





data[to]={



nguoiDanhGia:

nguoiDung.ten,



thoiGian:

new Date().toLocaleString("vi-VN"),



duLieu:

ketQua



};






localStorage.setItem(

"danhGiaTo97",

JSON.stringify(data)

);






alert(

"✅ Đã lưu đánh giá tổ!"

);



}







window.onload=function(){


hienThiDanhGia();


};





</script>


</body>

</html>

</div>
