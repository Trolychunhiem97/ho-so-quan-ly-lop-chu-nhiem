<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Tổ trưởng quản lý tổ
</title>


<script src="phanquyen.js"></script>

<script src="danhsach.js"></script>

<script src="dulieu.js"></script>



<style>


body{

font-family:"Segoe UI",Arial;

background:#f1f6ff;

margin:0;

}



.header{

background:#1565c0;

color:white;

padding:25px;

text-align:center;

}



.container{

padding:25px;

}



.box{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 15px #ccc;

margin-bottom:20px;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

padding:10px;

border-bottom:1px solid #ddd;

text-align:center;

}



button{

background:#1565c0;

color:white;

border:none;

padding:10px 20px;

border-radius:10px;

cursor:pointer;

}



input{

width:70px;

padding:8px;

}



textarea{

width:100%;

height:80px;

}



</style>


</head>


<body>



<div class="header">


<h1>
🏆 TỔ TRƯỞNG - LỚP 97
</h1>


<p id="thongTinTo">

</p>


</div>





<div class="container">



<div class="box">


<h2>
👨‍🎓 Thành viên trong tổ
</h2>



<table>


<thead>

<tr>

<th>
STT
</th>

<th>
Họ tên
</th>

<th>
Chấm điểm
</th>

</tr>


</thead>


<tbody id="danhSachTo">

</tbody>



</table>



</div>







<div class="box">


<h2>
📝 Phiếu đánh giá tuần
</h2>


<div id="phieuCham">

Chọn học sinh để đánh giá

</div>



</div>



</div>






<script>


let nguoiDung = layNguoiDung();



if(

!nguoiDung ||

nguoiDung.quyen!=="to_truong"

){


alert(
"Chỉ tổ trưởng được truy cập"
);


window.location.href="trangchu.html";


}






let toHienTai = nguoiDung.to;



document.getElementById(

"thongTinTo"

).innerHTML =

"Tổ trưởng tổ " + toHienTai;






function hienThiThanhVien(){


let ds = layHocSinhTheoTo(toHienTai);



let html="";



ds.forEach((hs,index)=>{


html+=`

<tr>

<td>

${index+1}

</td>


<td>

${hs.hoTen}

</td>


<td>

<button onclick="moPhieu(${hs.id})">

📝 Chấm điểm

</button>

</td>


</tr>

`;


});



document.getElementById(

"danhSachTo"

).innerHTML=html;



}





hienThiThanhVien();







function moPhieu(id){


let hs =
layDanhSachHocSinh()

.find(

x=>x.id===id

);



document.getElementById(

"phieuCham"

).innerHTML=

`

<h3>

${hs.hoTen}

</h3>


<p>
Học tập (30 điểm)
</p>


<input id="ht"
type="number"
value="30">


<p>
Nề nếp (30 điểm)
</p>


<input id="nn"
type="number"
value="30">


<p>
Lao động (20 điểm)
</p>


<input id="ld"
type="number"
value="20">


<p>
Điểm cộng
</p>


<input id="cong"
type="number"
value="0">


<p>
Điểm trừ
</p>


<input id="tru"
type="number"
value="0">



<p>

Nhận xét:

</p>


<textarea id="nhanxet">

</textarea>



<br><br>


<button onclick="luuDiem(${id})">

💾 Lưu điểm tuần

</button>

`;



}







function luuDiem(id){



let diem =

Number(ht.value)

+

Number(nn.value)

+

Number(ld.value)

+

Number(cong.value)

-

Number(tru.value);





let obj={


hocSinhId:id,


tuan:new Date().getWeek,


namHoc:"2026-2027",


diem:diem,


nhanXet:
nhanxet.value,


nguoiNhap:
nguoiDung.ten



};



themDiemTuan(obj);



alert(

"Đã lưu điểm thành công"

);



}







</script>



</body>

</html>
