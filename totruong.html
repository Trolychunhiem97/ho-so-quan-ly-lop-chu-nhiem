<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Thi đua tổ trưởng lớp 97</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:

Arial, sans-serif;

background:#f1f5ff;

}



header{

background:

linear-gradient(135deg,#1565c0,#42a5f5);

color:white;

padding:25px 15px;

text-align:center;

}



header h1{

font-size:24px;

margin:0 0 10px;

}



.container{

width:95%;

max-width:600px;

margin:20px auto;

}



.card{

background:white;

border-radius:18px;

padding:18px;

margin-bottom:20px;

box-shadow:

0 4px 15px rgba(0,0,0,.12);

}



.title{

font-size:20px;

font-weight:bold;

color:#1565c0;

}



select,
input,
textarea{


width:100%;

padding:12px;

margin-top:8px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}



.student{


background:#fff;

border-radius:18px;

padding:18px;

margin-bottom:18px;

box-shadow:

0 3px 12px #ddd;


}



.student h3{

margin-top:0;

color:#1565c0;

}



.row{


display:grid;

grid-template-columns:1fr 1fr;

gap:12px;


}



label{

font-weight:bold;

display:block;

margin-top:12px;

}



button{


width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#1565c0;

color:white;

font-size:18px;

font-weight:bold;

}



.score{


font-size:22px;

font-weight:bold;

color:#e65100;

text-align:center;

margin-top:10px;

}



</style>


</head>



<body>


<header>


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<div id="thongTinTo">

</div>


</header>





<div class="container">



<div class="card">


<div class="title">

📅 Chọn tuần đánh giá

</div>


<select id="chonTuan">


</select>


</div>






<div id="danhSach">

</div>





<button onclick="luuThiDua()">

💾 LƯU KẾT QUẢ TUẦN

</button>



<br><br>



<button onclick="veTrangChu()">

🏠 Về trang chủ

</button>



</div>





<script src="danhsach.js"></script>

<script src="dulieu.js"></script>

<script src="phanquyen.js"></script>

<script src="totruong.js"></script>


</body>

</html>
