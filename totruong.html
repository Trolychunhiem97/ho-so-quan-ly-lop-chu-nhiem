<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tổ trưởng - Thi đua lớp 97</title>


<style>

body{

    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f6ff;

}



header{

    background:linear-gradient(135deg,#1565c0,#42a5f5);

    color:white;

    padding:35px;

    text-align:center;

}


header h1{

    margin:0;

    font-size:36px;

}



.container{

    width:95%;

    margin:30px auto;

    background:white;

    padding:30px;

    border-radius:20px;

    box-shadow:0 5px 20px #ccc;

}



button{

    background:#1565c0;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:10px;

    font-size:16px;

    cursor:pointer;

}



select,input,textarea{

    padding:8px;

    border-radius:8px;

    border:1px solid #ccc;

}



.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}



table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}



th{

    background:#1565c0;

    color:white;

    padding:12px;

}



td{

    border:1px solid #ddd;

    text-align:center;

    padding:8px;

}



input{

    width:50px;

}



textarea{

    width:120px;

}



h2{

    color:#1565c0;

}


</style>

</head>



<body>

</div>
