<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Đăng nhập quản lý lớp 97</title>


<style>


body{

font-family:Arial,sans-serif;

background:#eef5ff;

padding:40px;

}



.container{

max-width:450px;

margin:auto;

background:white;

padding:35px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,0.1);

text-align:center;

}



h1{

color:#1565c0;

font-size:30px;

}



h2{

color:#1565c0;

}



input{

width:90%;

padding:14px;

margin:10px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:14px 30px;

border-radius:10px;

font-size:18px;

cursor:pointer;

margin-top:15px;

}



button:hover{

background:#0d47a1;

}



.thongbao{

margin-top:20px;

color:red;

font-size:16px;

}



.footer{

margin-top:30px;

color:#666;

border-top:1px solid #ddd;

padding-top:20px;

}



</style>


</head>



<body>



<div class="container">



<h2>

🏫 TRƯỜNG THCS TRẦN PHÚ

</h2>



<h1>

📘 TRỢ LÝ QUẢN LÝ LỚP 97

</h1>



<p>

👨‍🏫 GVCN: <b>Trần Sáng</b>

</p>





<input

id="username"

placeholder="Tên đăng nhập">



<br>



<input

id="password"

type="password"

placeholder="Mật khẩu">





<br>



<button onclick="dangNhap()">

🔐 ĐĂNG NHẬP

</button>





<div id="thongbao"

class="thongbao">

</div>






<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
  <script>


// Danh sách tài khoản lớp 97


const taiKhoan = [


{

username:"gvcn",

password:"123456",

ten:"GVCN Trần Sáng",

quyen:"admin"

},



{

username:"loptruong",

password:"123456",

ten:"Lớp trưởng",

quyen:"thidua"

},



{

username:"hoc_tap",

password:"123456",

ten:"Lớp phó học tập",

quyen:"hoc_tap"

},



{

username:"lao_dong",

password:"123456",

ten:"Lớp phó lao động",

quyen:"lao_dong"

},



{

username:"to1",

password:"123456",

ten:"Tổ trưởng tổ 1",

quyen:"totruong"

}



];







function dangNhap(){



let user =

document.getElementById("username").value;



let pass =

document.getElementById("password").value;






let timThay =

taiKhoan.find(

x =>

x.username==user

&&

x.password==pass

);







if(timThay){



let nguoiDung={


username:

timThay.username,


ten:

timThay.ten,


quyen:

timThay.quyen,


thoigian:

new Date().toLocaleString("vi-VN")


};





localStorage.setItem(

"nguoiDungDangNhap",

JSON.stringify(nguoiDung)

);






document.getElementById(

"thongbao"

).style.color="green";



document.getElementById(

"thongbao"

).innerHTML=


"✅ Đăng nhập thành công!";





setTimeout(function(){


location.href="index.html";


},1000);





}

else{



document.getElementById(

"thongbao"

).innerHTML=


"❌ Sai tài khoản hoặc mật khẩu!";



}



}



</script>



</body>

</html>




</div>
