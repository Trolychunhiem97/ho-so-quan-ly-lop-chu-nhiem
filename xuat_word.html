<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Xuất Word báo cáo chủ nhiệm lớp 97</title>


<script src="danhsach.js"></script>


<!-- Thư viện tạo file Word -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js">
</script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
</script>



<style>

body{

font-family:Arial;
background:#eef5ff;
padding:30px;

}


.container{

max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.1);

}



h1{

color:#1565c0;

}


.info{

background:#f2f7ff;
padding:20px;
border-radius:15px;
margin:20px;

}



button{

background:#1565c0;
color:white;
border:none;
padding:15px 25px;
border-radius:10px;
font-size:18px;
margin:10px;
cursor:pointer;

}



button:hover{

background:#0d47a1;

}



</style>


</head>


<body>



<div class="container">


<h1>

📄 XUẤT BÁO CÁO WORD CHỦ NHIỆM

</h1>



<div class="info">


<h3>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h3>


<p>
📘 Lớp: <b>97</b>
</p>


<p>
👨‍🏫 Giáo viên chủ nhiệm:
<b>Trần Sáng</b>
</p>


</div>




<button onclick="xuatWord()">

📄 Tạo file Word

</button>



<br>



<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>



</div>





<script>


const {

Document,

Packer,

Paragraph,

TextRun,

Table,

TableRow,

TableCell,

AlignmentType,

WidthType


}=docx;
async function xuatWord(){



let lichSuTuan =

JSON.parse(

localStorage.getItem("lichSuTuan97")

)||[];




let hanhKiem =

JSON.parse(

localStorage.getItem("hanhKiem97")

)||[];




let nhanXetChung =

localStorage.getItem(

"nhanXetChung97"

)||"";



let bangNhanXet =

localStorage.getItem(

"baoCaoNhanXet97"

)||"";






let {

Document,

Packer,

Paragraph,

TextRun,

Table,

TableRow,

TableCell,

AlignmentType,

WidthType

}=docx;






let noiDung=[];





// ========================
// TIÊU ĐỀ
// ========================


noiDung.push(

new Paragraph({

alignment:

AlignmentType.CENTER,


children:[


new TextRun({

text:

"TRƯỜNG THCS TRẦN PHÚ",

bold:true,

size:28

})

]

})

);





noiDung.push(

new Paragraph({

alignment:

AlignmentType.CENTER,


children:[


new TextRun({

text:

"BÁO CÁO CÔNG TÁC CHỦ NHIỆM LỚP 97",

bold:true,

size:30

})

]

})

);





noiDung.push(

new Paragraph({

alignment:

AlignmentType.CENTER,


children:[


new TextRun({

text:

"Giáo viên chủ nhiệm: Trần Sáng",

size:24

})

]

})

);






noiDung.push(

new Paragraph(

"Ngày lập báo cáo: "

+

new Date().toLocaleDateString("vi-VN")

)

);






noiDung.push(

new Paragraph(

""

)

);






// ========================
// THÔNG TIN LỚP
// ========================


noiDung.push(

new Paragraph({

children:[

new TextRun({

text:"I. THÔNG TIN CHUNG",

bold:true,

size:24

})

]

})

);



noiDung.push(

new Paragraph(

"Lớp: 97"

)

);



noiDung.push(

new Paragraph(

"Sĩ số: "

+

danhSachHocSinh.length

+

" học sinh"

)

);







// ========================
// BẢNG KẾT QUẢ
// ========================



noiDung.push(

new Paragraph({

children:[

new TextRun({

text:"II. KẾT QUẢ RÈN LUYỆN HỌC SINH",

bold:true,

size:24

})

]

})

);





let rows=[];



rows.push(

new TableRow({

children:[


new TableCell({

children:[
new Paragraph("STT")
]

}),


new TableCell({

children:[
new Paragraph("Họ tên")
]

}),


new TableCell({

children:[
new Paragraph("Điểm")
]

}),


new TableCell({

children:[
new Paragraph("Hạnh kiểm")
]

}),


new TableCell({

children:[
new Paragraph("Xếp loại")
]

})


]

})

);






danhSachHocSinh.forEach((ten,index)=>{


let tong=0;

let dem=0;



lichSuTuan.forEach(t=>{


let hs=

t.hocSinh.find(

x=>x.ten==ten

);



if(hs){

tong += Number(hs.diem);

dem++;

}


});



let diem=

dem?

(tong/dem).toFixed(2)

:

0;



let hk="";



if(hanhKiem.length){


let thang=

hanhKiem[hanhKiem.length-1];



let hsHK=

thang.hocSinh.find(

x=>x.ten==ten

);



if(hsHK)

hk=hsHK.xeploai;


}




let xl="";



if(diem>=90)

xl="Tốt";


else if(diem>=75)

xl="Khá";


else

xl="Cần cố gắng";





rows.push(

new TableRow({

children:[


new TableCell({

children:[
new Paragraph(
String(index+1)
)
]

}),


new TableCell({

children:[
new Paragraph(ten)
]

}),


new TableCell({

children:[
new Paragraph(String(diem))
]

}),


new TableCell({

children:[
new Paragraph(hk)
]

}),


new TableCell({

children:[
new Paragraph(xl)
]

})


]

})

);



});






noiDung.push(

new Table({

rows:rows,

width:{
size:100,
type:WidthType.PERCENTAGE
}

})

);








// ========================
// NHẬN XÉT AI
// ========================


noiDung.push(

new Paragraph({

children:[

new TextRun({

text:"III. NHẬN XÉT CÁ NHÂN HỌC SINH",

bold:true,

size:24

})

]

})

);




let divTam=document.createElement("div");

divTam.innerHTML=bangNhanXet;



let cacDong=

divTam.querySelectorAll("tr");




for(let i=1;i<cacDong.length;i++){



let ten=

cacDong[i].cells[1]?.innerText
||"";


let nx=

cacDong[i].cells[5]?.innerText
||"";



noiDung.push(

new Paragraph({

children:[

new TextRun({

text:
ten,

bold:true

})

]

})

);



noiDung.push(

new Paragraph(

nx

)

);



}







// ========================
// NHẬN XÉT CHUNG
// ========================


noiDung.push(

new Paragraph({

children:[

new TextRun({

text:"IV. NHẬN XÉT CHUNG CỦA GIÁO VIÊN CHỦ NHIỆM",

bold:true,

size:24

})

]

})

);





noiDung.push(

new Paragraph(

nhanXetChung

)

);








// ========================
// KÝ TÊN
// ========================


noiDung.push(

new Paragraph("")

);



noiDung.push(

new Paragraph({

alignment:

AlignmentType.RIGHT,


children:[

new TextRun({

text:

"GIÁO VIÊN CHỦ NHIỆM\nTrần Sáng",

bold:true

})

]

})

);







let doc =

new Document({

sections:[{

children:noiDung

}]

});





let file =

await Packer.toBlob(doc);



saveAs(

file,

"Bao_cao_chu_nhiem_lop_97_Tran_Sang.docx"

);



alert(

"✅ Đã xuất báo cáo Word thành công!"

);



}
