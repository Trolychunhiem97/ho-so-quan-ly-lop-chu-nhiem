<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Báo cáo chủ nhiệm lớp 97</title>


<script src="danhsach.js"></script>

<script src="ai_nhanxet.js"></script>


<style>

body{

font-family:Arial, sans-serif;
background:#eef5ff;
padding:20px;

}


.container{

max-width:1400px;
margin:auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);

}



.header{

text-align:center;

}



.header h2{

color:#1565c0;
font-size:30px;

}


.header h1{

color:#1565c0;
font-size:36px;

}



.info{

text-align:center;
font-size:20px;
margin:20px;

}




.menu{

text-align:center;
margin:20px;

}



button{

background:#1565c0;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
font-size:16px;
margin:5px;
cursor:pointer;

}


button:hover{

background:#0d47a1;

}





table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}



th{

background:#1565c0;
color:white;
padding:10px;

}



td{

border:1px solid #ddd;
padding:8px;

text-align:center;

}



.nhanxet{

text-align:left;
min-width:350px;

}



textarea{

width:95%;
height:100px;
font-size:16px;

}




@media print{

button{

display:none;

}


}


</style>


</head>



<body>


<div class="container">



<div class="header">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
📘 BÁO CÁO CÔNG TÁC CHỦ NHIỆM LỚP 97
</h1>


<p>
👨‍🏫 Giáo viên chủ nhiệm: <b>Trần Sáng</b>
</p>


</div>





<div class="info">


👨‍🎓 Sĩ số:
<b id="siso"></b>
học sinh


<br>


📅 Ngày lập báo cáo:
<b id="ngay"></b>


</div>






<div class="menu">


<button onclick="chonNhanXet('thang')">

📝 Nhận xét tháng

</button>



<button onclick="chonNhanXet('hocky')">

📘 Nhận xét học kỳ

</button>



<button onclick="chonNhanXet('nam')">

🏆 Nhận xét cuối năm

</button>



<button onclick="taoNhanXetLop()">

🤖 Tạo nhận xét AI

</button>



<button onclick="luuBaoCao()">

💾 Lưu báo cáo

</button>



<button onclick="window.print()">

🖨 In báo cáo

</button>



</div>





<h3>
📊 KẾT QUẢ RÈN LUYỆN HỌC SINH
</h3>




<table id="bang">


<tr>


<th>
STT
</th>


<th>
Họ và tên
</th>


<th>
Điểm thi đua
</th>


<th>
Hạnh kiểm
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét AI
</th>


</tr>



</table>





<h3>

✍ NHẬN XÉT CHUNG CỦA GIÁO VIÊN CHỦ NHIỆM

</h3>



<textarea id="nhanXetChung"

placeholder="Nhập nhận xét chung của giáo viên chủ nhiệm...">

</textarea>



</div>
  <script>


let loaiNhanXet="thang";


// Hiển thị thông tin

document.getElementById("siso").innerHTML =
danhSachHocSinh.length;


document.getElementById("ngay").innerHTML =
new Date().toLocaleDateString("vi-VN");





// Chọn loại nhận xét

function chonNhanXet(loai){


loaiNhanXet=loai;


if(loai=="thang"){

alert(
"Đã chọn nhận xét tháng"
);

}


if(loai=="hocky"){

alert(
"Đã chọn nhận xét học kỳ"
);

}


if(loai=="nam"){

alert(
"Đã chọn nhận xét cuối năm"
);

}


}







let bang=document.getElementById("bang");



// Lấy dữ liệu

let lichSuTuan =

JSON.parse(

localStorage.getItem(
"lichSuTuan97"
)

)||[];




let hanhKiem =

JSON.parse(

localStorage.getItem(
"hanhKiem97"
)

)||[];





// Tạo bảng học sinh


danhSachHocSinh.forEach((ten,index)=>{


let tong=0;

let soTuan=0;



lichSuTuan.forEach(t=>{


let hs=

t.hocSinh.find(

x=>x.ten==ten

);



if(hs){

tong += Number(hs.diem);

soTuan++;

}


});



let diem=

soTuan ?

(tong/soTuan).toFixed(2)

:

0;




let hk="Chưa có";



if(hanhKiem.length){


let thang=

hanhKiem[
hanhKiem.length-1
];



let hsHK=

thang.hocSinh.find(

x=>x.ten==ten

);



if(hsHK){

hk=hsHK.xeploai;

}


}




let xepLoai="";



if(diem>=90){

xepLoai="⭐ Tốt";

}

else if(diem>=75){

xepLoai="🟢 Khá";

}

else{

xepLoai="🟡 Cần cố gắng";

}




bang.innerHTML += `


<tr>


<td>${index+1}</td>


<td>${ten}</td>


<td>${diem}</td>


<td>${hk}</td>


<td>${xepLoai}</td>


<td class="nhanxet">

<span>

Chưa tạo

</span>

</td>


</tr>


`;



});










// ==========================
// TẠO NHẬN XÉT AI
// ==========================


function taoNhanXetLop(){


let rows =

document.querySelectorAll(
"#bang tr"
);



for(let i=1;i<rows.length;i++){



let hocSinh={


ten:

rows[i].cells[1].innerText,


diem:

rows[i].cells[2].innerText,


hanhKiem:

rows[i].cells[3].innerText


};




let nhanXet="";



// Nhận xét tháng

if(loaiNhanXet=="thang"){


nhanXet=

taoNhanXetThang(
hocSinh
);


}




// Nhận xét học kỳ

else{


nhanXet=

taoNhanXetHocKy(
hocSinh
);


}



rows[i].cells[5].innerText=

nhanXet;



}



alert(

"🤖 Đã tạo nhận xét AI cho lớp!"

);



}









// ==========================
// LƯU BÁO CÁO
// ==========================


function luuBaoCao(){



localStorage.setItem(

"baoCaoNhanXet97",

document.getElementById(
"bang"
).innerHTML

);



localStorage.setItem(

"nhanXetChung97",

document.getElementById(
"nhanXetChung"
).value

);



alert(

"💾 Đã lưu báo cáo!"

);



}









// ==========================
// KHÔI PHỤC NHẬN XÉT
// ==========================


window.onload=function(){



let old =

localStorage.getItem(
"baoCaoNhanXet97"
);



if(old){


document.getElementById(
"bang"
).innerHTML=old;


}



let nx =

localStorage.getItem(
"nhanXetChung97"
);



if(nx){


document.getElementById(
"nhanXetChung"
).value=nx;


}



}



</script>



</body>

</html>
