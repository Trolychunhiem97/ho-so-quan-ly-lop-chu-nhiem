<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Báo cáo chủ nhiệm lớp 97</title>

<script src="danhsach.js"></script>

<script src="ai_nhanxet.js"></script>


<style>

body{
font-family:Arial;
background:#f2f7ff;
padding:20px;
}


.container{
background:white;
padding:25px;
border-radius:20px;
}


h1{
text-align:center;
color:#1565c0;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}


th{
background:#1565c0;
color:white;
padding:10px;
}


td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}


.nhanxet{

text-align:left;
min-width:300px;

}


button{

background:#1565c0;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
margin:10px;

}


textarea{

width:95%;
height:80px;

}



@media print{

button{
display:none;
}

}


</style>


</head>


<body>


<div class="container">


<h1>
📘 BÁO CÁO CÔNG TÁC CHỦ NHIỆM LỚP 97
</h1>



<table id="bang">


<tr>

<th>STT</th>

<th>Họ và tên</th>

<th>Điểm thi đua</th>

<th>Hạnh kiểm</th>

<th>Kết quả chung</th>

<th>Nhận xét AI</th>

</tr>


</table>



<br>


<button onclick="taoNhanXetLop()">

✨ AI tạo nhận xét lớp

</button>



<button onclick="luuBaoCao()">

💾 Lưu báo cáo

</button>



<button onclick="window.print()">

🖨 In báo cáo

</button>



<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>



<h3>
✍ Nhận xét chung của giáo viên chủ nhiệm
</h3>


<textarea id="nhanXetChung"
placeholder="Nhập nhận xét chung..."></textarea>



</div>





<script>


let bang=document.getElementById("bang");


// Lấy dữ liệu thi đua

let lichSu = 
JSON.parse(localStorage.getItem("lichSuTuan97")) || [];


// Lấy hạnh kiểm

let hanhKiem =
JSON.parse(localStorage.getItem("hanhKiem97")) || [];




// Tạo bảng


danhSachHocSinh.forEach((ten,index)=>{


let tong=0;

let soTuan=0;



lichSu.forEach(t=>{


let hs =
t.hocSinh.find(x=>x.ten==ten);


if(hs){

tong += Number(hs.diem);

soTuan++;

}


});



let diem =

soTuan ?

(tong/soTuan).toFixed(2)

:

0;



let hk="Chưa có";



if(hanhKiem.length){


let thangCuoi =
hanhKiem[hanhKiem.length-1];


let hsHK =
thangCuoi.hocSinh.find(
x=>x.ten==ten
);


if(hsHK){

hk=hsHK.xeploai;

}


}




let ketQua="";


if(diem>=95 && hk=="⭐ Tốt")

ketQua="⭐ Hoàn thành xuất sắc";


else if(diem>=85)

ketQua="🟢 Hoàn thành tốt";


else

ketQua="🟡 Cần cố gắng";




bang.innerHTML +=`

<tr>

<td>${index+1}</td>

<td>${ten}</td>

<td>${diem}</td>

<td>${hk}</td>

<td>${ketQua}</td>

<td class="nhanxet">
<span class="chua-tao">
Chưa tạo
</span>
</td>

</tr>


`;



});






function taoNhanXetLop(){


let rows =
document.querySelectorAll("#bang tr");



for(let i=1;i<rows.length;i++){


let hs={


ten:
rows[i].cells[1].innerHTML,


diem:
rows[i].cells[2].innerHTML,


hanhKiem:
rows[i].cells[3].innerHTML



};



let nx =
taoNhanXetAI(hs);



rows[i].cells[5].innerHTML=nx;



}



alert("✨ Đã tạo nhận xét AI cho lớp!");



}






function luuBaoCao(){


localStorage.setItem(

"baoCaoNhanXet97",

document.getElementById("bang").innerHTML

);



localStorage.setItem(

"nhanXetChung97",

document.getElementById("nhanXetChung").value

);



alert("Đã lưu báo cáo!");



}



document.getElementById("nhanXetChung").value =

localStorage.getItem("nhanXetChung97") || "";



</script>



</body>

</html>
