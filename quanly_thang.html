<body>

<h3>
✍ Nhận xét chung tháng
</h3>


<textarea id="nhanXet"
placeholder="Nhập nhận xét chung của tháng...">
</textarea>



<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// Lấy tháng hiện tại

function layThang(){

return document.getElementById("thang").value;

}







// Kho dữ liệu tháng

function layDuLieuThang(){


let data =

JSON.parse(

localStorage.getItem("duLieuLop97TheoThang")

)

||{};


return data;


}







// ===========================
// LƯU DỮ LIỆU THÁNG
// ===========================


function luuThang(){



let thang=

layThang();



let data=

layDuLieuThang();





data[thang]={


thoiGian:

new Date().toLocaleString("vi-VN"),



thiDua:

localStorage.getItem(
"lichSuTuan97"
),



hanhKiem:

localStorage.getItem(
"hanhKiem97"
),



nhanXetAI:

localStorage.getItem(
"baoCaoNhanXet97"
),



nhanXetChung:

document.getElementById(
"nhanXet"
).value



};





localStorage.setItem(

"duLieuLop97TheoThang",

JSON.stringify(data)

);





capNhatTrangThai();



alert(

"✅ Đã lưu dữ liệu "+thang

);



}








// ===========================
// XEM DỮ LIỆU THÁNG
// ===========================


function xemThang(){



let thang=

layThang();



let data=

layDuLieuThang();



let item=

data[thang];





if(!item){


alert(

"Chưa có dữ liệu "+thang

);


return;


}





document.getElementById(
"nhanXet"
).value=

item.nhanXetChung || "";




document.getElementById(
"tdThiDua"
).innerHTML=

item.thiDua?

"✅ Đã lưu"

:

"❌ Chưa có";





document.getElementById(
"tdHanhKiem"
).innerHTML=

item.hanhKiem?

"✅ Đã lưu"

:

"❌ Chưa có";





document.getElementById(
"tdNhanXet"
).innerHTML=

item.nhanXetAI?

"✅ Đã lưu"

:

"❌ Chưa có";





alert(

"📂 Đã mở dữ liệu "+thang

);



}








// ===========================
// XÓA THÁNG
// ===========================


function xoaThang(){



let thang=

layThang();



if(

!confirm(

"Xóa toàn bộ dữ liệu "+thang+"?"

)

)

return;





let data=

layDuLieuThang();



delete data[thang];





localStorage.setItem(

"duLieuLop97TheoThang",

JSON.stringify(data)

);





capNhatTrangThai();



alert(

"🗑 Đã xóa "+thang

);



}








// ===========================
// HIỂN THỊ TRẠNG THÁI
// ===========================


function capNhatTrangThai(){



let thang=

layThang();



let data=

layDuLieuThang();



let item=

data[thang];





if(!item){


document.getElementById(
"tdThiDua"
).innerHTML=

"❌ Chưa lưu";



document.getElementById(
"tdHanhKiem"
).innerHTML=

"❌ Chưa lưu";



document.getElementById(
"tdNhanXet"
).innerHTML=

"❌ Chưa lưu";



return;

}





document.getElementById(
"tdThiDua"
).innerHTML=

item.thiDua?

"✅ Đã lưu":

"❌ Chưa có";





document.getElementById(
"tdHanhKiem"
).innerHTML=

item.hanhKiem?

"✅ Đã lưu":

"❌ Chưa có";





document.getElementById(
"tdNhanXet"
).innerHTML=

item.nhanXetAI?

"✅ Đã lưu":

"❌ Chưa có";





}








document

.getElementById("thang")

.addEventListener(

"change",

capNhatTrangThai

);





window.onload=

capNhatTrangThai;



</script>



</body>

</html>
