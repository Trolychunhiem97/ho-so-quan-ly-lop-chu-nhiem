<!DOCTYPE html>

<html lang="vi">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Quản lý tháng lớp 97
</title>



<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px #ccc;

}



h1,h2{

text-align:center;

color:#1565c0;

}



.box{

background:#f8fbff;

padding:20px;

border-radius:20px;

margin-top:20px;

}



input,select,textarea{


width:100%;

padding:12px;

margin:8px 0;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;


}



button{

background:#1565c0;

color:white;

border:none;

padding:13px 25px;

border-radius:12px;

cursor:pointer;

font-size:16px;

}



table{

width:100%;

border-collapse:collapse;

margin-top:25px;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.good{

color:green;

font-weight:bold;

}



.warn{

color:red;

font-weight:bold;

}



</style>


</head>



<body>



<div class="container">



<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>



<h1>
📅 QUẢN LÝ HỌC SINH THEO THÁNG - LỚP 97
</h1>





<div class="box">


<h3>
📌 Chọn tháng
</h3>


<select id="thang">


<option>
Tháng 9
</option>


<option>
Tháng 10
</option>


<option>
Tháng 11
</option>


<option>
Tháng 12
</option>


<option>
Tháng 1
</option>


<option>
Tháng 2
</option>


<option>
Tháng 3
</option>


<option>
Tháng 4
</option>


<option>
Tháng 5
</option>


</select>


</div>







<div class="box">


<h3>
✍️ Nhập đánh giá học sinh
</h3>



<input id="tenHS"

placeholder="Tên học sinh">



<select id="xepLoai">


<option>
Tốt
</option>


<option>
Khá
</option>


<option>
Đạt
</option>


<option>
Chưa đạt
</option>


</select>





<textarea id="nhanXet"

placeholder="Nhập nhận xét hoặc để AI hỗ trợ">

</textarea>





<button onclick="luuDanhGia()">

💾 Lưu đánh giá

</button>


</div>








<h3>
📊 Bảng tổng hợp tháng
</h3>



<table id="bang">


<tr>

<th>
STT
</th>

<th>
Học sinh
</th>

<th>
Xếp loại
</th>

<th>
Nhận xét
</th>


</tr>


</table>
<script>


// =====================================
// DỮ LIỆU QUẢN LÝ THÁNG
// =====================================


let duLieuThang = JSON.parse(

localStorage.getItem(
"xepLoaiThang97"
)

)

|| [];







// =====================================
// LƯU ĐÁNH GIÁ
// =====================================



function luuDanhGia(){



let ten =

document.getElementById(

"tenHS"

).value;



let loai =

document.getElementById(

"xepLoai"

).value;



let nhanXet =

document.getElementById(

"nhanXet"

).value;






if(!ten){


alert(

"Vui lòng nhập tên học sinh"

);


return;


}






// lấy dữ liệu thi đua tuần


let thiDua = JSON.parse(

localStorage.getItem(

"thiDuaTuan97"

)

)

|| [];







let hsThiDua = thiDua.find(

(x)=>x.ten==ten

);





let diem=100;



if(hsThiDua){


diem=hsThiDua.diem;


}







// nếu chưa có nhận xét thì AI tạo


if(nhanXet==""){


nhanXet = taoNhanXetAI(

loai,

diem

);


}






let hs={



thang:

document.getElementById(

"thang"

).value,



ten:ten,



diem:diem,



xepLoai:loai,



nhanXet:nhanXet



};







// cập nhật nếu đã có


let index=

duLieuThang.findIndex(

(x)=>

x.ten==ten

&&

x.thang==hs.thang

);







if(index>=0){


duLieuThang[index]=hs;


}

else{


duLieuThang.push(hs);


}







localStorage.setItem(

"xepLoaiThang97",

JSON.stringify(

duLieuThang

)

);







hienThiBang();



alert(

"✅ Đã lưu đánh giá tháng"

);



}









// =====================================
// AI NHẬN XÉT
// =====================================



function taoNhanXetAI(

loai,

diem

){



if(diem>=110){


return

"Học sinh có tinh thần học tập tốt, "

+

tích cực tham gia các hoạt động, "

+

cần tiếp tục phát huy.";



}




if(diem>=90){


return

"Học sinh cơ bản thực hiện tốt nội quy, "

+

cần duy trì sự cố gắng và chủ động hơn trong học tập.";



}




return

"Học sinh cần được quan tâm, "

+

rèn luyện ý thức học tập, "

+

phối hợp cùng gia đình để tiến bộ.";



}









// =====================================
// HIỂN THỊ BẢNG
// =====================================



function hienThiBang(){



let bang=

document.getElementById(

"bang"

);



bang.innerHTML=

`

<tr>

<th>STT</th>

<th>Học sinh</th>

<th>Xếp loại</th>

<th>Điểm</th>

<th>Nhận xét</th>

</tr>

`;








let thangHienTai=

document.getElementById(

"thang"

).value;







let ds=

duLieuThang.filter(

(x)=>

x.thang==thangHienTai

);







ds.forEach(

(hs,i)=>{



bang.innerHTML +=


`

<tr>

<td>

${i+1}

</td>


<td>

${hs.ten}

</td>


<td>

${hs.xepLoai}

</td>


<td>

${hs.diem}

</td>


<td>

${hs.nhanXet}

</td>


</tr>

`;


});





}









// thay đổi tháng


document.getElementById(

"thang"

).addEventListener(

"change",

hienThiBang

);






window.onload=function(){


hienThiBang();


};



</script>
