<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Quản lý tháng lớp 97
</title>


<script src="js/danhsach.js"></script>



<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px #ccc;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:25px;

border-radius:20px;

text-align:center;

}



.box{

background:#f8fbff;

padding:20px;

margin-top:20px;

border-radius:20px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 20px;

border-radius:12px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



input,select{

padding:10px;

border-radius:10px;

border:1px solid #ccc;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.tot{

color:green;

font-weight:bold;

}



.ai{

background:#fff8e1;

padding:20px;

border-radius:15px;

white-space:pre-line;

line-height:1.6;

}



</style>


</head>


<body>


<div class="container">



<div class="header">


<h1>
📅 QUẢN LÝ RÈN LUYỆN THÁNG LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>








<div class="box">


<h2>
📌 Chọn tháng
</h2>



<input id="thang"

placeholder="Ví dụ: Tháng 9/2026">



<button onclick="taoThang()">

➕ Tạo đánh giá tháng

</button>



</div>







<div class="box">


<h2>
📊 Bảng đánh giá tháng
</h2>



<table>


<thead>


<tr>


<th>
STT
</th>


<th>
Học sinh
</th>


<th>
Điểm tháng
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét
</th>


<th>
AI
</th>


</tr>


</thead>



<tbody id="bangThang">


</tbody>


</table>



</div>







<div class="box">


<h2>
🤖 Nhận xét AI tháng
</h2>


<div id="aiThang"

class="ai">

Chưa có dữ liệu

</div>



<br>


<button onclick="taoNhanXetThang()">

🤖 Tạo nhận xét tháng

</button>


</div>
<script>


// =====================================
// QUẢN LÝ THÁNG LỚP 97
// =====================================


const KEY_THANG = "xepLoaiThang97";


let duLieuThang = [];






// =====================================
// TẠO THÁNG MỚI
// =====================================


function taoThang(){



let thang = document.getElementById(

"thang"

).value;



if(!thang){


alert(

"Vui lòng nhập tháng"

);


return;

}





duLieuThang = danhSachHocSinh.map(

(ten,index)=>{


return{


stt:index+1,


hoTen:ten,


thang:thang,


diem:100,


xepLoai:"Tốt",


nhanXet:""



};


}

);





luuThang();



hienThiBangThang();



alert(

"✅ Đã tạo đánh giá tháng"

);



}








// =====================================
// LƯU DỮ LIỆU
// =====================================


function luuThang(){


localStorage.setItem(

KEY_THANG,

JSON.stringify(

duLieuThang

)

);



}







// =====================================
// TẢI DỮ LIỆU
// =====================================


function taiThang(){


let data = localStorage.getItem(

KEY_THANG

);



if(data){


duLieuThang = JSON.parse(data);


}



}







// =====================================
// XẾP LOẠI
// =====================================


function xepLoai(diem){



if(diem>=95)

return "Tốt";



if(diem>=80)

return "Khá";



if(diem>=65)

return "Đạt";



return "Cần cố gắng";


}







// =====================================
// HIỂN THỊ BẢNG
// =====================================


function hienThiBangThang(){



let bang = document.getElementById(

"bangThang"

);



bang.innerHTML="";







duLieuThang.forEach(

(hs,index)=>{



hs.xepLoai = xepLoai(hs.diem);



bang.innerHTML +=



`

<tr>


<td>

${index+1}

</td>



<td>

${hs.hoTen}

</td>



<td>

<input 

type="number"

value="${hs.diem}"

onchange="capNhatDiem(${index},this.value)"

>

</td>



<td class="tot">

${hs.xepLoai}

</td>



<td>

<input

value="${hs.nhanXet}"

onchange="capNhatNhanXet(${index},this.value)"

>

</td>



<td>


<button onclick="aiCaNhan(${index})">

🤖

</button>


</td>


</tr>


`;



}

);



luuThang();



}







// =====================================
// CẬP NHẬT ĐIỂM
// =====================================


function capNhatDiem(index,diem){



duLieuThang[index].diem=

Number(diem);



duLieuThang[index].xepLoai=

xepLoai(

Number(diem)

);



luuThang();


hienThiBangThang();



}







// =====================================
// NHẬN XÉT
// =====================================


function capNhatNhanXet(index,text){



duLieuThang[index].nhanXet=text;



luuThang();



}







// =====================================
// AI NHẬN XÉT CÁ NHÂN
// =====================================


function aiCaNhan(index){



let hs=duLieuThang[index];



document.getElementById(

"aiThang"

).innerText=


`

🤖 NHẬN XÉT AI THÁNG


Học sinh:

${hs.hoTen}



Điểm:

${hs.diem}



Xếp loại:

${hs.xepLoai}



Nhận xét:


${
hs.diem>=95

?

"Em có ý thức tốt, tích cực tham gia hoạt động của lớp."

:

"Em cần cố gắng hơn trong việc thực hiện nội quy và nhiệm vụ học tập."

}


`;



}








// =====================================
// AI NHẬN XÉT CẢ LỚP
// =====================================


function taoNhanXetThang(){



if(duLieuThang.length==0)

return;




let tong=0;



duLieuThang.forEach(

hs=>{


tong += hs.diem;


}

);



let tb=Math.round(

tong / duLieuThang.length

);





let nhanXet=



`

🤖 NHẬN XÉT THÁNG LỚP 97


Điểm trung bình:

${tb}



Đánh giá:


${
tb>=95

?

"Tập thể lớp duy trì tốt nền nếp, có tinh thần tự giác và trách nhiệm."

:

"Lớp cần tiếp tục nâng cao ý thức học tập, rèn luyện và tinh thần tự quản."

}



GVCN tiếp tục theo dõi, động viên và phối hợp cùng phụ huynh.


`;




document.getElementById(

"aiThang"

).innerText=nhanXet;



}







window.onload=function(){



taiThang();


hienThiBangThang();



};



</script>




</div>
