<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Thi đua tháng lớp 97</title>

<script src="danhsach.js"></script>

<style>

body{
font-family:Arial;
background:#f2f7ff;
padding:20px;
}

.container{
background:white;
padding:25px;
border-radius:20px;
}


h1{
text-align:center;
color:#1565c0;
}


table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th{

background:#1565c0;
color:white;
padding:10px;

}


td{

border:1px solid #ddd;
padding:8px;
text-align:center;

}


button{

background:#1565c0;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
margin:10px;

}


</style>


</head>



<body>


<div class="container">


<h1>
🏆 THI ĐUA THÁNG LỚP 97
</h1>



<h2>
📊 Bảng tổng hợp kết quả
</h2>



<table id="bang">


<tr>

<th>STT</th>

<th>Họ và tên</th>

<th>Tuần 1</th>

<th>Tuần 2</th>

<th>Tuần 3</th>

<th>Tuần 4</th>

<th>TB tháng</th>

<th>Xếp loại</th>


</tr>


</table>



<h2>
🥇 Xếp hạng tháng
</h2>



<table id="xephang">


<tr>

<th>Hạng</th>

<th>Họ và tên</th>

<th>Điểm</th>

</tr>


</table>



<button onclick="location.href='quanly_thidua.html'">

⬅ Quản lý thi đua

</button>


<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>



</div>




<script>


let bang=document.getElementById("bang");

let xephang=document.getElementById("xephang");



let ketQua = 
JSON.parse(localStorage.getItem("ketQuaTuan97"));



let bangDiem=[];



danhSachHocSinh.forEach((ten,index)=>{


let diem=[];


if(ketQua){


let hs=
ketQua.hocSinh.find(x=>x.ten==ten);


if(hs){

diem.push(hs.diem);

}

}



while(diem.length<4){

diem.push("");

}



let tong=0;

let dem=0;


diem.forEach(x=>{

if(x!=""){

tong+=Number(x);

dem++;

}

});



let tb=dem?
(tong/dem).toFixed(2):
"0";



let loai="";


if(tb>=95)

loai="⭐ Xuất sắc";


else if(tb>=85)

loai="🟢 Tốt";


else if(tb>=70)

loai="🟡 Khá";


else

loai="🔴 Cần cố gắng";





bangDiem.push({

ten:ten,

diem:Number(tb)

});





bang.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${ten}</td>

<td>${diem[0]}</td>

<td>${diem[1]}</td>

<td>${diem[2]}</td>

<td>${diem[3]}</td>

<td>${tb}</td>

<td>${loai}</td>

</tr>

`;



});






bangDiem.sort((a,b)=>b.diem-a.diem);



bangDiem.slice(0,10)
.forEach((hs,index)=>{


xephang.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${hs.ten}</td>

<td>${hs.diem}</td>

</tr>


`;


});



</script>



</body>

</html>
