</head>


<body>



<div class="container">



<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
📈 THI ĐUA THÁNG LỚP 97
</h1>



<div class="user" id="nguoiDung">

</div>





<div style="text-align:center">


<button onclick="tinhDiemThang()">

📊 Tính điểm tháng

</button>


<button onclick="taoNhanXetThang()">

🤖 AI nhận xét tháng

</button>


<button onclick="luuThiDuaThang()">

💾 Lưu kết quả tháng

</button>



<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>



</div>






<table id="bangThang">


<tr>


<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Tuần 1
</th>


<th>
Tuần 2
</th>


<th>
Tuần 3
</th>


<th>
Tuần 4
</th>


<th>
Điểm TB tháng
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét AI
</th>



</tr>


</table>






<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// ===============================
// KIỂM TRA ĐĂNG NHẬP
// ===============================


let nguoiDung =

JSON.parse(

localStorage.getItem(

"nguoiDungDangNhap"

)

);



if(!nguoiDung){

location.href="dangnhap.html";

}





document.getElementById(

"nguoiDung"

).innerHTML=


"👤 Xin chào: <b>"

+

nguoiDung.ten

+

"</b>";








// ===============================
// DANH SÁCH HỌC SINH
// ===============================



let dsHocSinh=[];



if(typeof danhSachHocSinh!="undefined"){


dsHocSinh=danhSachHocSinh;


}

else{


dsHocSinh=[

"Nguyễn Văn A",

"Trần Văn B",

"Lê Thị C"

];


}








// ===============================
// LẤY LỊCH SỬ THI ĐUA TUẦN
// ===============================



function layLichSuTuan(){



return JSON.parse(

localStorage.getItem(

"lichSuTuan97"

)

)

||[];



}









// ===============================
// TÍNH ĐIỂM THÁNG
// ===============================



function tinhDiemThang(){



let lichSu=

layLichSuTuan();





let bang=

document.getElementById(

"bangThang"

);





bang.innerHTML=`

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Tuần 1</th>

<th>Tuần 2</th>

<th>Tuần 3</th>

<th>Tuần 4</th>

<th>TB tháng</th>

<th>Xếp loại</th>

<th>Nhận xét AI</th>

</tr>

`;






dsHocSinh.forEach(

(hs,index)=>{



let diemTuan=[];





lichSu.forEach(

(t)=>{


let hsData=

t.hocSinh.find(

(x)=>x.ten==hs

);



if(hsData){


diemTuan.push(

hsData.diem

);


}



});







while(diemTuan.length<4){


diemTuan.push(0);


}






let soTuanCoDiem=0;

let tong=0;





diemTuan.forEach(d=>{


if(d>0){


tong+=Number(d);


soTuanCoDiem++;


}


});






let tb=0;



if(soTuanCoDiem>0){


tb=

Math.round(

tong/soTuanCoDiem

);


}





let xepLoai="";



if(tb>=110){


xepLoai="🌟 Xuất sắc";


}

else if(tb>=100){


xepLoai="✅ Tốt";


}

else if(tb>=90){


xepLoai="👍 Khá";


}

else{


xepLoai="⚠ Cần cố gắng";


}








bang.innerHTML+=`

<tr>


<td>${index+1}</td>


<td>${hs}</td>


<td>${diemTuan[0]}</td>


<td>${diemTuan[1]}</td>


<td>${diemTuan[2]}</td>


<td>${diemTuan[3]}</td>


<td><b>${tb}</b></td>


<td>${xepLoai}</td>


<td class="nhanXet">

Chưa tạo

</td>


</tr>

`;



});





}









// ===============================
// AI NHẬN XÉT THÁNG
// ===============================



function taoNhanXetThang(){



let dong=

document.querySelectorAll(

"#bangThang tr"

);





for(let i=1;i<dong.length;i++){



let diem=

Number(

dong[i].cells[6].innerText

);



let nhanXet="";





if(diem>=110){


nhanXet=

"Học sinh có kết quả nổi bật, duy trì tốt việc học tập, rèn luyện và tham gia phong trào của lớp.";


}

else if(diem>=100){


nhanXet=

"Học sinh có ý thức tốt, hoàn thành nhiệm vụ học tập và cần tiếp tục phát huy.";


}

else if(diem>=90){


nhanXet=

"Học sinh có cố gắng nhưng cần nâng cao hơn nữa ý thức học tập và rèn luyện.";


}

else{


nhanXet=

"Học sinh cần được quan tâm, nhắc nhở để cải thiện kết quả trong thời gian tới.";


}





dong[i].cells[8].innerText=

nhanXet;



}





alert(

"🤖 Đã tạo nhận xét tháng!"

);



}








// ===============================
// LƯU KẾT QUẢ THÁNG
// ===============================



function luuThiDuaThang(){



let dong=

document.querySelectorAll(

"#bangThang tr"

);



let ketQua=[];





for(let i=1;i<dong.length;i++){



ketQua.push({



ten:

dong[i].cells[1].innerText,



diem:

Number(

dong[i].cells[6].innerText

),



xepLoai:

dong[i].cells[7].innerText,



nhanXet:

dong[i].cells[8].innerText



});



}






localStorage.setItem(

"xepLoaiThang97",

JSON.stringify({

thoiGian:

new Date().toLocaleString("vi-VN"),


duLieu:

ketQua


})

);






alert(

"✅ Đã lưu kết quả thi đua tháng!"

);



}






window.onload=function(){



tinhDiemThang();



};



</script>


</div>
