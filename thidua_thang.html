<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Thi đua tháng lớp 97</title>

<script src="danhsach.js"></script>


<style>

body{
font-family:Arial;
background:#f2f7ff;
padding:20px;
}

.container{
background:white;
padding:25px;
border-radius:20px;
}


h1{
text-align:center;
color:#1565c0;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}


th{
background:#1565c0;
color:white;
padding:10px;
}


td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}


button{

background:#1565c0;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
margin:10px;

}

</style>

</head>


<body>


<div class="container">


<h1>
🏆 THI ĐUA THÁNG LỚP 97
</h1>


<table id="bang">


<tr>

<th>STT</th>

<th>Họ và tên</th>

<th>Tuần 1</th>

<th>Tuần 2</th>

<th>Tuần 3</th>

<th>Tuần 4</th>

<th>TB tháng</th>

<th>Xếp loại</th>

</tr>


</table>


<h2>
🥇 TOP 10 THI ĐUA THÁNG
</h2>


<table id="top10">


<tr>

<th>Hạng</th>

<th>Họ tên</th>

<th>Điểm tháng</th>

</tr>


</table>



<button onclick="location.href='thidua_tuan.html'">

⬅ Thi đua tuần

</button>


<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>


</div>




<script>


let lichSu = 
JSON.parse(localStorage.getItem("lichSuTuan97")) || [];



let bang =
document.getElementById("bang");


let top10 =
document.getElementById("top10");



let bangXepHang=[];



danhSachHocSinh.forEach((ten,index)=>{


let diemTuan=[0,0,0,0];



lichSu.forEach(t=>{


let hs =
t.hocSinh.find(x=>x.ten==ten);



if(hs){

let vt =
Number(t.tuan)-1;


if(vt>=0 && vt<4){

diemTuan[vt]=hs.diem;

}

}


});



let tong=0;

let soTuan=0;



diemTuan.forEach(d=>{


if(d>0){

tong+=d;

soTuan++;

}


});



let tb =
soTuan>0 ?
(tong/soTuan).toFixed(2)
:
"0";



let loai="";


if(tb>=95)

loai="⭐ Xuất sắc";


else if(tb>=85)

loai="🟢 Tốt";


else if(tb>=70)

loai="🟡 Khá";


else

loai="🔴 Cần cố gắng";





bangXepHang.push({

ten:ten,

diem:Number(tb)

});




bang.innerHTML += `

<tr>

<td>${index+1}</td>

<td>${ten}</td>

<td>${diemTuan[0]||""}</td>

<td>${diemTuan[1]||""}</td>

<td>${diemTuan[2]||""}</td>

<td>${diemTuan[3]||""}</td>

<td>${tb}</td>

<td>${loai}</td>

</tr>

`;



});





bangXepHang.sort(
(a,b)=>b.diem-a.diem
);



bangXepHang.slice(0,10)
.forEach((hs,index)=>{


top10.innerHTML +=`

<tr>

<td>${index+1}</td>

<td>${hs.ten}</td>

<td>${hs.diem}</td>

</tr>

`;



});



</script>



</body>

</html>
