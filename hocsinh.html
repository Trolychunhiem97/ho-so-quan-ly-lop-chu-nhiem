<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Danh sách học sinh</title>

<style>

body{
    font-family: Arial;
    background:#f2f7ff;
    padding:30px;
}

h1{
    text-align:center;
    color:#1769c2;
}

.container{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px #ccc;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#1769c2;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

button{
    background:#1769c2;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0d4f98;
}

</style>

</head>


<body>

<h1>📚 DANH SÁCH HỌC SINH</h1>


<div class="container">

<button>
+ Thêm học sinh
</button>


<table>

<tr>
<th>STT</th>
<th>Họ và tên</th>
<th>Ngày sinh</th>
<th>Giới tính</th>
<th>Phụ huynh</th>
<th>Điểm thi đua</th>
</tr>


<tr>
<td>1</td>
<td>Nguyễn Văn A</td>
<td>01/01/2013</td>
<td>Nam</td>
<td>0123456789</td>
<td>100</td>
</tr>


<tr>
<td>2</td>
<td>Trần Thị B</td>
<td>05/05/2013</td>
<td>Nữ</td>
<td>0987654321</td>
<td>100</td>
</tr>


</table>


<br>

<a href="index.html">
<button>
⬅ Quay lại hồ sơ
</button>
</a>


</div>


</body>

</html>
