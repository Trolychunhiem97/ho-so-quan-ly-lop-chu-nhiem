<script src="ai_nhanxet.js"></script>



<style>


body{

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

background:white;

}

text-align:center;

}



.user{

padding:15px;

border-radius:15px;

}



button{

background:#1565c0;

color:white;

}

background:#0d47a1;

}



#baoCao{

background:white;

padding:25px;

}



table{

width:100%;

}

}



</style>


</head>



<body>



<div class="container">



<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>



<h1>
📄 BÁO CÁO CHỦ NHIỆM LỚP 97
</h1>



<p style="text-align:center">

Năm học 2026 - 2027

<br>

Giáo viên chủ nhiệm:

<b>Trần Sáng</b>

</p>




<div class="user" id="nguoiDung">

</div>




<div style="text-align:center">


<button onclick="taoBaoCao()">

👁 Xem trước báo cáo

</button>



<button onclick="xuatWord()">

📄 Xuất file Word

</button>



<button onclick="location.href='tonghop_nam.html'">

📊 Quay lại tổng hợp

</button>



</div>





<div id="baoCao">

Chưa tạo báo cáo.


</div>






<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// ===============================
// KIỂM TRA ĐĂNG NHẬP
// ===============================


let nguoiDung = JSON.parse(

localStorage.getItem(
"nguoiDungDangNhap"
)

);



if(!nguoiDung){

location.href="dangnhap.html";

}




document.getElementById(
"nguoiDung"
).innerHTML =

"👤 Xin chào: <b>"
+
nguoiDung.ten
+
"</b>";







// ===============================
// LẤY DỮ LIỆU BÁO CÁO
// ===============================


function layTongHopNam(){


return JSON.parse(

localStorage.getItem(
"tongHopNam97"
)

)

||{

duLieu:[]

};



}



function layNhanXetAI(){


return JSON.parse(

localStorage.getItem(
"nhanXetAI97"
)

)

||[];


}








// ===============================
// TẠO BÁO CÁO
// ===============================


function taoBaoCao(){



let tongHop=

layTongHopNam();



let ai=

layNhanXetAI();





let html=`

<h2 style="text-align:center">

BÁO CÁO TỔNG HỢP QUẢN LÝ LỚP 97

</h2>


<p>

<b>Trường:</b> THCS Trần Phú

</p>


<p>

<b>Năm học:</b> 2026 - 2027

</p>


<p>

<b>Giáo viên chủ nhiệm:</b> Trần Sáng

</p>



<table>


<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Điểm TB năm</th>

<th>Xếp loại</th>

<th>Nhận xét AI</th>

</tr>

`;





let xuatSac=0;

let tot=0;

let kha=0;

let canCoGang=0;






tongHop.duLieu.forEach(

(hs,index)=>{



let nx=

ai.find(

(x)=>x.ten==hs.ten

);



let nhanXet=

hs.nhanXet;



if(nx){

nhanXet=

nx.nhanXet;

}





html+=`

<tr>


<td>${index+1}</td>


<td>${hs.ten}</td>


<td>${hs.diem}</td>


<td>${hs.xepLoai}</td>


<td>${nhanXet}</td>


</tr>

`;







if(hs.xepLoai.includes("Xuất sắc")){

xuatSac++;

}

else if(hs.xepLoai.includes("Tốt")){

tot++;

}

else if(hs.xepLoai.includes("Khá")){

kha++;

}

else{

canCoGang++;

}



});







html+=`

</table>



<h3>

📊 THỐNG KÊ LỚP

</h3>



<p>

🌟 Xuất sắc: ${xuatSac} học sinh

</p>


<p>

✅ Tốt: ${tot} học sinh

</p>


<p>

👍 Khá: ${kha} học sinh

</p>


<p>

⚠ Cần cố gắng: ${canCoGang} học sinh

</p>





<h3>

🤖 NHẬN XÉT CHUNG

</h3>



<p>

Tập thể lớp 97 duy trì tốt nề nếp,
có tinh thần đoàn kết, đa số học sinh
có ý thức học tập và tích cực tham gia
các hoạt động chung.

</p>



`;





document.getElementById(

"baoCao"

).innerHTML=html;



}









// ===============================
// XUẤT FILE WORD
// ===============================


function xuatWord(){



let noiDung=

document.getElementById(

"baoCao"

).innerHTML;





if(noiDung.includes(

"Chưa tạo báo cáo"

)){


taoBaoCao();



noiDung=

document.getElementById(

"baoCao"

).innerHTML;


}







let file=`

<html>

<head>

<meta charset="UTF-8">

</head>


<body>


${noiDung}


</body>


</html>

`;






let blob=

new Blob(

[file],

{

type:

"application/msword"

}

);






let link=

document.createElement(

"a"

);



link.href=

URL.createObjectURL(blob);



link.download=

"Bao_cao_chu_nhiem_lop97_2026_2027.doc";



link.click();



}






window.onload=function(){


taoBaoCao();


};



</script>



</div>
