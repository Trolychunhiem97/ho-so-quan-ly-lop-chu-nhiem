<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Xuất báo cáo chủ nhiệm</title>


<script src="phanquyen.js"></script>



<style>


body{

font-family:Arial,sans-serif;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1100px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}



h1,h2{

text-align:center;

color:#1565c0;

}



.user{

text-align:center;

background:#f2f7ff;

padding:15px;

border-radius:15px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:15px 30px;

border-radius:12px;

font-size:18px;

cursor:pointer;

margin:10px;

}



button:hover{

background:#0d47a1;

}



.preview{

margin-top:30px;

border:1px solid #ddd;

padding:20px;

background:#fff;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:10px;

}



td{

border:1px solid #ddd;

padding:10px;

}



.footer{

text-align:center;

margin-top:30px;

border-top:1px solid #ddd;

padding-top:20px;

color:#555;

}


</style>


</head>


<body>



<div class="container">



<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>



<h1>
📄 BÁO CÁO TỔNG HỢP CHỦ NHIỆM LỚP 97
</h1>



<p style="text-align:center">

Năm học 2026 - 2027

<br>

GVCN: <b>Trần Sáng</b>

</p>




<div class="user" id="nguoiDung">

</div>





<div style="text-align:center">


<button onclick="xemTruocBaoCao()">

👁 Xem trước báo cáo

</button>



<button onclick="xuatWord()">

📄 Xuất file Word

</button>



<button onclick="location.href='tonghop_nam.html'">

📊 Quay lại tổng hợp

</button>



</div>






<div class="preview" id="baoCao">


Chưa có dữ liệu báo cáo.


</div>







<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>

<script>


// ===============================
// KIỂM TRA ĐĂNG NHẬP
// ===============================


let nguoiDung =

JSON.parse(

localStorage.getItem(

"nguoiDungDangNhap"

)

);



if(!nguoiDung){


location.href="dangnhap.html";


}





document.getElementById(

"nguoiDung"

).innerHTML=


"👤 Xin chào: <b>"

+

nguoiDung.ten

+

"</b>";









// ===============================
// LẤY DỮ LIỆU TỔNG HỢP
// ===============================



function layBaoCao(){



return JSON.parse(

localStorage.getItem(

"tongHopNam97"

)

)

||{

duLieu:[]

};



}









// ===============================
// XEM TRƯỚC BÁO CÁO
// ===============================



function xemTruocBaoCao(){



let data=

layBaoCao();





let html=`

<h2 style="text-align:center">

BÁO CÁO TỔNG HỢP QUẢN LÝ LỚP 97

</h2>


<p>

Năm học: 2026 - 2027

</p>


<p>

Giáo viên chủ nhiệm: Trần Sáng

</p>



<table border="1" width="100%" cellspacing="0">


<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Điểm TB năm</th>

<th>Xếp loại</th>

<th>Nhận xét</th>

</tr>

`;







let xuatSac=0;

let tot=0;

let kha=0;

let canCoGang=0;






data.duLieu.forEach(

(hs,index)=>{



html+=`

<tr>

<td>${index+1}</td>

<td>${hs.ten}</td>

<td>${hs.diem}</td>

<td>${hs.xepLoai}</td>

<td>${hs.nhanXet}</td>

</tr>

`;





if(hs.xepLoai.includes("Xuất sắc"))

xuatSac++;


else if(hs.xepLoai.includes("Tốt"))

tot++;


else if(hs.xepLoai.includes("Khá"))

kha++;


else

canCoGang++;



});





html+=`

</table>


<br>


<h3>

📊 Thống kê lớp

</h3>


<p>

🌟 Xuất sắc: ${xuatSac} học sinh

</p>


<p>

✅ Tốt: ${tot} học sinh

</p>


<p>

👍 Khá: ${kha} học sinh

</p>


<p>

⚠ Cần cố gắng: ${canCoGang} học sinh

</p>



<h3>

🤖 Nhận xét chung

</h3>


<p>

Tập thể lớp 97 duy trì tốt nề nếp học tập,
có tinh thần đoàn kết và tham gia tích cực
các hoạt động của lớp.

Một số học sinh cần tiếp tục được quan tâm,
động viên để tiến bộ hơn.

</p>


`;







document.getElementById(

"baoCao"

).innerHTML=html;



}










// ===============================
// XUẤT FILE WORD
// ===============================



function xuatWord(){



let noiDung=

document.getElementById(

"baoCao"

).innerHTML;





if(noiDung.includes(

"Chưa có dữ liệu"

)){



xemTruocBaoCao();



noiDung=

document.getElementById(

"baoCao"

).innerHTML;



}







let file=

`

<html>

<head>

<meta charset="UTF-8">

<title>

Bao cao lop 97

</title>

</head>


<body>


${noiDung}


</body>


</html>

`;








let blob=

new Blob(

[file],

{

type:

"application/msword"

}

);







let link=

document.createElement(

"a"

);



link.href=

URL.createObjectURL(blob);



link.download=

"Bao_cao_chu_nhiem_lop97_2026_2027.doc";



link.click();



}







window.onload=function(){



xemTruocBaoCao();



};



</script>

</div>
