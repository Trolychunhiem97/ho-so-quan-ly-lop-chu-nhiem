<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Xuất báo cáo chủ nhiệm lớp 97
</title>


<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1100px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px #ccc;

}



h1,h2{

text-align:center;

color:#1565c0;

}



.box{

background:#f8fbff;

padding:20px;

border-radius:20px;

margin-top:20px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:14px 30px;

border-radius:15px;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



#baoCao{

margin-top:25px;

padding:30px;

border:1px solid #ddd;

border-radius:15px;

background:white;

white-space:pre-line;

line-height:1.6;

}



.footer{

text-align:center;

margin-top:40px;

color:#666;

}


</style>


</head>


<body>



<div class="container">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
📄 BÁO CÁO CHỦ NHIỆM LỚP 97
</h1>



<div class="box">


<button onclick="taoBaoCao()">

🤖 Tạo báo cáo tự động

</button>


<button onclick="inBaoCao()">

🖨 In báo cáo

</button>


</div>





<div id="baoCao">

Chưa có dữ liệu báo cáo...

</div>



<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// =================================
// TẠO BÁO CÁO TỰ ĐỘNG
// =================================


function taoBaoCao(){



let duLieu = JSON.parse(

localStorage.getItem(

"tongHopNam97"

)

)

||[];





if(duLieu.length==0){


document.getElementById(

"baoCao"

).innerHTML=

"⚠ Chưa có dữ liệu tổng hợp năm.";


return;


}






let soTot=0;

let soKha=0;

let soDat=0;

let soHoTro=0;







let danhSach="";






duLieu.forEach(

(hs,index)=>{



if(hs.xepLoai=="Tốt")

soTot++;



if(hs.xepLoai=="Khá")

soKha++;



if(hs.xepLoai=="Đạt")

soDat++;



if(hs.xepLoai=="Cần hỗ trợ")

soHoTro++;






danhSach +=


`

${index+1}. ${hs.ten}

- Điểm TB: ${hs.diemTB}

- Xếp loại: ${hs.xepLoai}

- Nhận xét: ${hs.nhanXet}


`;



});







let nhanXetChung="";




if(soTot>=soHoTro){


nhanXetChung=

"Lớp 97 duy trì tốt nền nếp học tập và rèn luyện. "

+

"Nhiều học sinh có ý thức phấn đấu, "

+

"tích cực tham gia các hoạt động của lớp. "

+

"Trong thời gian tới tiếp tục phát huy tinh thần đoàn kết, "

+

"nâng cao chất lượng học tập.";

}

else{


nhanXetChung=

"Lớp cần tiếp tục tăng cường công tác chủ nhiệm, "

+

"phối hợp giữa giáo viên và phụ huynh để hỗ trợ "

+

"những học sinh còn hạn chế, giúp các em tiến bộ.";

}








let baoCao =


`

CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM


BÁO CÁO CÔNG TÁC CHỦ NHIỆM

LỚP 97 - NĂM HỌC 2026 - 2027


I. THÔNG TIN CHUNG


- Đơn vị:
Trường THCS Trần Phú


- Giáo viên chủ nhiệm:
Trần Sáng


- Lớp:
97


II. KẾT QUẢ RÈN LUYỆN


Tổng số học sinh:
${duLieu.length}


- Xếp loại Tốt:
${soTot}


- Xếp loại Khá:
${soKha}


- Xếp loại Đạt:
${soDat}


- Cần hỗ trợ:
${soHoTro}



III. NHẬN XÉT CHUNG CỦA AI


${nhanXetChung}



IV. DANH SÁCH HỌC SINH



${danhSach}



V. KIẾN NGHỊ - GIẢI PHÁP


- Tiếp tục duy trì nền nếp lớp học.

- Tăng cường phối hợp giữa nhà trường và gia đình.

- Quan tâm hỗ trợ học sinh chưa đạt yêu cầu.

- Phát huy tinh thần tự quản của tập thể lớp.



GIÁO VIÊN CHỦ NHIỆM


Trần Sáng


`;







document.getElementById(

"baoCao"

).innerText=

baoCao;







// lưu báo cáo


localStorage.setItem(

"baoCaoLop97",

baoCao

);



}









// =================================
// IN BÁO CÁO
// =================================



function inBaoCao(){


let noiDung=

document.getElementById(

"baoCao"

).innerHTML;



let cuaSo=

window.open("","_blank");



cuaSo.document.write(

`

<html>

<head>

<title>Báo cáo lớp 97</title>

<style>

body{

font-family:Arial;

padding:40px;

line-height:1.6;

}

</style>

</head>


<body>

${noiDung}


</body>

</html>

`

);



cuaSo.print();



}



</script>

</div>
