<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Theo dõi học tập lớp 97
</title>


<script src="danhsach.js"></script>
<script src="dulieu.js"></script>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:30px 40px;

}



.header h1{

margin:0;

font-size:38px;

}



.container{

padding:25px;

}



.box{

background:white;

border-radius:25px;

padding:25px;

margin-bottom:25px;

box-shadow:0 8px 20px #ddd;

}



button{

border:none;

padding:14px 25px;

border-radius:15px;

cursor:pointer;

font-weight:bold;

font-size:16px;

}



.home{

background:#1565c0;

color:white;

}



.save{

background:#00897b;

color:white;

display:block;

margin:25px auto;

}



select,textarea{

padding:10px;

border-radius:10px;

font-size:15px;

width:100%;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:15px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



textarea{

height:70px;

resize:none;

}



</style>


</head>


<body>



<div class="header">


<h1>
📚 THEO DÕI HỌC TẬP LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>





<div class="container">


<button class="home"
onclick="veTrangChu()">

🏠 Về trang chủ quản lý lớp 97

</button>




<div class="box">


<h2>
📅 Chọn tuần đánh giá
</h2>


<select id="tuan"
onchange="hienThi()">

</select>


</div>






<div class="box">


<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Chuẩn bị bài
</th>


<th>
Bài tập
</th>


<th>
Hăng hái xây dựng bài
</th>


<th>
Nhận xét
</th>


</tr>

</thead>



<tbody id="bangHocSinh">

</tbody>


</table>



<button class="save"
onclick="luuHocTap()">

💾 Lưu đánh giá tuần

</button>


</div>



</div>







<script>


// ============================
// TẠO 35 TUẦN
// ============================


function taoTuan(){


let html="";


for(let i=1;i<=35;i++){


html +=`

<option value="${i}">
Tuần ${i}
</option>

`;


}



document.getElementById(
"tuan"
).innerHTML=html;



}







// ============================
// HIỂN THỊ HỌC SINH
// ============================


function hienThi(){


let ds =
layDanhSachHocSinh();



let tuan =
Number(
document.getElementById("tuan").value
);



let data =
layHocTap();



let html="";



ds.forEach((hs,index)=>{



let old =

data.find(

x=>

x.hocSinhId==hs.id

&&

x.tuan==tuan

);




html+=`

<tr data-id="${hs.id}">


<td>
${index+1}
</td>



<td>
<b>${hs.hoTen}</b>
</td>



<td>


<select class="chuanbi">


<option ${old?.chuanBi=="Đầy đủ"?"selected":""}>
Đầy đủ
</option>


<option ${old?.chuanBi=="Chưa đầy đủ"?"selected":""}>
Chưa đầy đủ
</option>


</select>



</td>




<td>


<select class="baitap">


<option ${old?.baiTap=="Hoàn thành"?"selected":""}>
Hoàn thành
</option>


<option ${old?.baiTap=="Chưa hoàn thành"?"selected":""}>
Chưa hoàn thành
</option>


</select>



</td>





<td>


<select class="hanghai">


<option ${old?.hangHai=="Hăng hái"?"selected":""}>
Hăng hái
</option>


<option ${old?.hangHai=="Chưa tích cực"?"selected":""}>
Chưa tích cực
</option>


</select>



</td>





<td>


<textarea class="nhanxet">

${old?.nhanXet || ""}

</textarea>


</td>



</tr>


`;



});



document.getElementById(
"bangHocSinh"
).innerHTML=html;



}








// ============================
// LƯU THEO TUẦN
// ============================


function luuHocTap(){



let tuan =
Number(
document.getElementById("tuan").value
);



let ds =
layHocTap();



document
.querySelectorAll("#bangHocSinh tr")
.forEach(row=>{


let id =
Number(
row.dataset.id
);



let obj={


hocSinhId:id,


tuan:tuan,


chuanBi:

row.querySelector(".chuanbi").value,


baiTap:

row.querySelector(".baitap").value,


hangHai:

row.querySelector(".hanghai").value,


nhanXet:

row.querySelector(".nhanxet").value



};



let cu =

ds.find(

x=>

x.hocSinhId==id

&&

x.tuan==tuan

);



if(cu){


Object.assign(cu,obj);


}
else{


ds.push(obj);


}



});




luuHocTapMoi(ds);



alert(
"✅ Đã lưu học tập tuần "+tuan
);



}








// ============================
// DỮ LIỆU HỌC TẬP
// ============================


function layHocTap(){


let data =

localStorage.getItem(
"hocTap97"
);



return data?

JSON.parse(data)

:

[];


}



function luuHocTapMoi(data){


localStorage.setItem(

"hocTap97",

JSON.stringify(data)

);


}







function veTrangChu(){


window.location.href=
"trangchu.html";


}






khoiTaoDuLieu();

taoTuan();

hienThi();



</script>



</body>

</html>
