<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Theo dõi học tập lớp 97</title>


<style>


body{

font-family: Arial, sans-serif;

background:#f5f8ff;

margin:0;

}



.header{

text-align:center;

padding:20px;

background:white;

}



.header h2{

color:#1565c0;

margin:5px;

}



.header h1{

color:#1565c0;

font-size:32px;

}



.user{

background:#edf4ff;

padding:15px;

border-radius:12px;

text-align:center;

font-size:20px;

margin:20px;

}



.btn-home{

background:#1565c0;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.btn-home:hover{

background:#0d47a1;

}



.container{

padding:20px;

}



table{

width:100%;

border-collapse:collapse;

background:white;

}



th{

background:#1565c0;

color:white;

padding:15px;

font-size:18px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



select,textarea{

width:95%;

padding:8px;

border-radius:8px;

border:1px solid #ccc;

font-size:15px;

}



textarea{

height:60px;

}



.save{

margin-top:20px;

text-align:center;

}



.btn-save{

background:#2e7d32;

color:white;

border:none;

padding:12px 30px;

font-size:18px;

border-radius:10px;

cursor:pointer;

}



.footer{

text-align:center;

margin-top:30px;

color:#555;

font-size:15px;

}



</style>


</head>



<body>



<div class="header">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
📚 THEO DÕI HỌC TẬP LỚP 97
</h1>


</div>



<div class="user">

👤 Xin chào:
<b>GVCN Trần Sáng</b>

<br><br>

📌 Người nhập:
<b>Lớp phó học tập</b>


</div>




<div style="text-align:center">


<a href="index.html">

<button class="btn-home">

🏠 Về trang chủ

</button>

</a>


</div>




<div class="container">


<table>


<thead>

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Chuẩn bị bài</th>

<th>Bài tập</th>

<th>Hăng hái xây dựng bài</th>

<th>Nhận xét</th>


</tr>


</thead>


<tbody id="danhsach">


</tbody>



</table>



<div class="save">


<button class="btn-save" onclick="luuHocTap()">

💾 Lưu đánh giá

</button>


</div>



</div>




<div class="footer">

Trợ lý quản lý lớp 97 – GVCN Trần Sáng

</div>





<script>



let hocSinh = JSON.parse(

localStorage.getItem("danhSachHocSinh")

) || [];



let duLieuHocTap = JSON.parse(

localStorage.getItem("theoDoiHocTap")

) || {};





function hienThi(){


let html="";


hocSinh.forEach((hs,index)=>{


let id = hs.id || index;


let ten = 

hs.hoTen ||

hs.ten ||

hs.name ||

"Chưa có tên";



let data = duLieuHocTap[id] || {};



html += `


<tr>


<td>${index+1}</td>



<td>

<b>${ten}</b>

</td>




<td>

<select id="chuanbi_${id}">

<option ${data.chuanBi=="Đầy đủ"?"selected":""}>
Đầy đủ
</option>

<option ${data.chuanBi=="Chưa đầy đủ"?"selected":""}>
Chưa đầy đủ
</option>


</select>


</td>





<td>


<select id="baitap_${id}">


<option ${data.baiTap=="Hoàn thành"?"selected":""}>
Hoàn thành
</option>


<option ${data.baiTap=="Chưa hoàn thành"?"selected":""}>
Chưa hoàn thành
</option>


</select>



</td>






<td>


<select id="xaydung_${id}">


<option ${data.xayDung=="Hăng hái"?"selected":""}>
Hăng hái
</option>


<option ${data.xayDung=="Chưa tích cực"?"selected":""}>
Chưa tích cực
</option>



</select>


</td>






<td>


<textarea id="nhanxet_${id}"

placeholder="Nhập nhận xét...">

${data.nhanXet || ""}

</textarea>


</td>




</tr>


`;



});



document.getElementById(

"danhsach"

).innerHTML = html;



}




function luuHocTap(){


hocSinh.forEach((hs,index)=>{


let id = hs.id || index;



duLieuHocTap[id]={


chuanBi:

document.getElementById(
"chuanbi_"+id
).value,



baiTap:

document.getElementById(
"baitap_"+id
).value,



xayDung:

document.getElementById(
"xaydung_"+id
).value,



nhanXet:

document.getElementById(
"nhanxet_"+id
).value



};



});



localStorage.setItem(

"theoDoiHocTap",

JSON.stringify(duLieuHocTap)

);



alert(
"Đã lưu đánh giá học tập!"
);


}




hienThi();



</script>



</body>

</html>
