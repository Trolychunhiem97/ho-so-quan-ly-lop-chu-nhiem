<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Theo dõi học tập lớp 97
</title>


<script src="danhsach.js"></script>
<script src="dulieu.js"></script>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}


/* HEADER GIỐNG TRANG CHỦ */


.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:35px 60px;

}



.header-content{

max-width:1400px;

margin:auto;

}



.header h1{

margin:0;

font-size:38px;

font-weight:700;

}



.header p{

font-size:20px;

margin:10px 0 0;

}




.container{

max-width:1500px;

margin:auto;

padding:30px;

}




.btn-home{

background:#1565c0;

color:white;

border:none;

padding:15px 30px;

border-radius:15px;

font-size:17px;

font-weight:bold;

cursor:pointer;

margin-bottom:25px;

}




.box{

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 8px 20px #ddd;

margin-bottom:25px;

}




select{

padding:12px;

border-radius:10px;

font-size:16px;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:15px;

font-size:17px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



textarea{

width:100%;

height:70px;

border-radius:10px;

padding:10px;

}



.btn-save{

display:block;

margin:25px auto 0;

background:#00897b;

color:white;

border:none;

padding:15px 35px;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



</style>

</head>


<body>



<div class="header">


<div class="header-content">


<h1>
📚 THEO DÕI HỌC TẬP LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>


</div>





<div class="container">


<button class="btn-home"
onclick="veTrangChu()">

🏠 Về trang chủ quản lý lớp 97

</button>





<div class="box">


<h2>
👤 Người nhập: Lớp phó học tập
</h2>


<h2>
📅 Chọn tuần đánh giá
</h2>


<select id="tuan"
onchange="hienThi()">

</select>



</div>






<div class="box">


<h2>
📚 Bảng theo dõi học tập
</h2>



<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Chuẩn bị bài
</th>


<th>
Bài tập
</th>


<th>
Hăng hái xây dựng bài
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="bangHocSinh">

</tbody>



</table>



<button class="btn-save"
onclick="luuHocTap()">

💾 Lưu đánh giá tuần

</button>



</div>



</div>







<script>


// tạo 35 tuần


function taoTuan(){


let html="";


for(let i=1;i<=35;i++){


html+=`

<option value="${i}">
Tuần ${i}
</option>

`;


}



document.getElementById(
"tuan"
).innerHTML=html;


}






// hiển thị


function hienThi(){


let ds =
layDanhSachHocSinh();



let tuan =
Number(
document.getElementById("tuan").value
);



let data =
layHocTap();



let html="";



ds.forEach((hs,index)=>{



let old=data.find(

x=>

x.hocSinhId==hs.id

&&

x.tuan==tuan

);





html+=`

<tr data-id="${hs.id}">


<td>
${index+1}
</td>


<td>
<b>${hs.hoTen}</b>
</td>


<td>

<select class="cb">


<option ${old?.chuanBi=="Đầy đủ"?"selected":""}>
Đầy đủ
</option>

<option ${old?.chuanBi=="Chưa đầy đủ"?"selected":""}>
Chưa đầy đủ
</option>


</select>


</td>


<td>

<select class="bt">


<option ${old?.baiTap=="Hoàn thành"?"selected":""}>
Hoàn thành
</option>

<option ${old?.baiTap=="Chưa hoàn thành"?"selected":""}>
Chưa hoàn thành
</option>


</select>

</td>



<td>


<select class="hh">


<option ${old?.hangHai=="Hăng hái"?"selected":""}>
Hăng hái
</option>


<option ${old?.hangHai=="Chưa tích cực"?"selected":""}>
Chưa tích cực
</option>


</select>


</td>



<td>


<textarea class="nx">

${old?.nhanXet || ""}

</textarea>


</td>



</tr>

`;



});




document.getElementById(
"bangHocSinh"
).innerHTML=html;


}







// lưu


function luuHocTap(){



let tuan=

Number(
document.getElementById("tuan").value
);



let data=
layHocTap();





document
.querySelectorAll("#bangHocSinh tr")
.forEach(row=>{


let id=
Number(row.dataset.id);



let obj={


hocSinhId:id,

tuan:tuan,


chuanBi:
row.querySelector(".cb").value,


baiTap:
row.querySelector(".bt").value,


hangHai:
row.querySelector(".hh").value,


nhanXet:
row.querySelector(".nx").value


};




let cu=data.find(

x=>

x.hocSinhId==id

&&

x.tuan==tuan

);



if(cu){

Object.assign(cu,obj);

}

else{


data.push(obj);


}



});




localStorage.setItem(

"hocTap97",

JSON.stringify(data)

);



alert(
"✅ Đã lưu học tập tuần "+tuan
);



}







function layHocTap(){


let data=

localStorage.getItem(
"hocTap97"
);



return data?

JSON.parse(data)

:

[];

}




function veTrangChu(){


window.location.href=
"trangchu.html";


}





khoiTaoDuLieu();

taoTuan();

hienThi();


</script>



</body>

</html>
