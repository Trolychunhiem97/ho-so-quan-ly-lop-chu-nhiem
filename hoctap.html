<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Theo dõi học tập lớp 97</title>


<script src="phanquyen.js"></script>

<script src="danhsach.js"></script>


<style>


body{

font-family:Arial,sans-serif;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}



h1,h2{

text-align:center;

color:#1565c0;

}



.user{

text-align:center;

background:#f2f7ff;

padding:15px;

border-radius:15px;

font-size:18px;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



select,input,textarea{

width:95%;

padding:8px;

border-radius:8px;

border:1px solid #ccc;

}



textarea{

height:60px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 25px;

border-radius:10px;

font-size:16px;

cursor:pointer;

margin-top:20px;

}



button:hover{

background:#0d47a1;

}



.footer{

margin-top:30px;

text-align:center;

border-top:1px solid #ddd;

padding-top:20px;

color:#555;

}


</style>


</head>



<body>



<div class="container">



<h2>

🏫 TRƯỜNG THCS TRẦN PHÚ

</h2>



<h1>

📚 THEO DÕI HỌC TẬP LỚP 97

</h1>




<div class="user" id="nguoiDung">

</div>





<table id="bangHocTap">


<tr>

<th>

STT

</th>


<th>

Họ tên

</th>


<th>

Chuẩn bị bài

</th>


<th>

Bài tập

</th>


<th>

Điểm cộng/trừ

</th>


<th>

Nhận xét

</th>


</tr>



</table>






<button onclick="luuHocTap()">

💾 Lưu theo dõi học tập

</button>




<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>






<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// =============================
// KIỂM TRA ĐĂNG NHẬP
// =============================


let nguoiDung =

JSON.parse(

localStorage.getItem(

"nguoiDungDangNhap"

)

);




if(!nguoiDung){


alert(

"⚠ Vui lòng đăng nhập!"

);


location.href="dangnhap.html";


}






document.getElementById(

"nguoiDung"

).innerHTML=


"👤 Xin chào: <b>"

+

nguoiDung.ten

+

"</b>";







// =============================
// DANH SÁCH HỌC SINH
// =============================


let danhSachHocSinhHT = [];





if(typeof danhSachHocSinh !== "undefined"){


danhSachHocSinhHT = danhSachHocSinh;


}

else{


danhSachHocSinhHT=[


"Nguyễn Văn A",

"Trần Văn B",

"Lê Thị C",

"Phạm Văn D"


];


}








// =============================
// TẠO BẢNG HỌC TẬP
// =============================


function hienThiHocTap(){



let bang=

document.getElementById(

"bangHocTap"

);



bang.innerHTML=`

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Chuẩn bị bài</th>

<th>Bài tập</th>

<th>Điểm cộng/trừ</th>

<th>Nhận xét</th>

</tr>

`;






danhSachHocSinhHT.forEach(

(hs,index)=>{



bang.innerHTML +=`

<tr>


<td>

${index+1}

</td>



<td>

${hs}

</td>




<td>


<select class="chuanBi">


<option>

Đầy đủ

</option>


<option>

Chưa đầy đủ

</option>


<option>

Không chuẩn bị

</option>


</select>


</td>





<td>


<select class="baiTap">


<option>

Hoàn thành

</option>


<option>

Thiếu

</option>


<option>

Chưa làm

</option>


</select>


</td>





<td>


<input

class="diemHT"

type="number"

value="0">


</td>






<td>


<textarea

class="nhanXetHT"

placeholder="Nhận xét">

</textarea>


</td>



</tr>

`;



});



}








// =============================
// LƯU DỮ LIỆU HỌC TẬP
// =============================


function luuHocTap(){



let bang=

document.getElementById(

"bangHocTap"

);



let dong=

bang.querySelectorAll(

"tr"

);



let ketQua=[];




for(let i=1;i<dong.length;i++){



let o=

dong[i].children;



ketQua.push({



ten:

o[1].innerText,



chuanBi:

o[2].querySelector("select").value,



baiTap:

o[3].querySelector("select").value,



diem:

o[4].querySelector("input").value,



nhanXet:

o[5].querySelector("textarea").value



});



}







let data={



nguoiNhap:

nguoiDung.ten,



thoiGian:

new Date().toLocaleString("vi-VN"),



duLieu:

ketQua



};






localStorage.setItem(

"hocTapLop97",

JSON.stringify(data)

);






alert(

"✅ Đã lưu theo dõi học tập!"

);



}








window.onload=function(){



hienThiHocTap();


};





</script>


</body>

</html>


</div>
