<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Theo dõi học tập lớp 97</title>


<style>


body{

margin:0;

font-family:Arial,sans-serif;

background:#f3f7fc;

}



/* KHUNG NỘI DUNG */

.container{

padding:30px;

}




.card{

background:white;

border-radius:18px;

padding:30px;

box-shadow:0 5px 20px rgba(0,0,0,0.12);

}



/* TIÊU ĐỀ */

.title{

font-size:32px;

font-weight:bold;

color:#1565c0;

margin-bottom:20px;

}



/* NÚT */

.btn-home{

background:#1565c0;

color:white;

padding:14px 30px;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.btn-save{

background:#2e7d32;

color:white;

padding:14px 30px;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



select,textarea{

width:95%;

padding:10px;

border-radius:8px;

border:1px solid #ccc;

font-size:15px;

}



textarea{

height:60px;

}





/* BẢNG */

table{

width:100%;

border-collapse:collapse;

margin-top:25px;

}



th{

background:#1565c0;

color:white;

padding:15px;

font-size:17px;

}



td{

background:white;

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.footer{

text-align:center;

margin-top:30px;

color:#777;

}



</style>

</head>


<body>



<div class="container">


<div class="card">



<!-- ĐỔI LINK NÀY NẾU DASHBOARD CÓ TÊN KHÁC -->

<button class="btn-home"

onclick="window.location.href='index.html'">

🏠 Về trang chủ

</button>



<br><br>


<div class="title">

📚 THEO DÕI HỌC TẬP LỚP 97

</div>




<div>

👤 Người nhập:

<b>Lớp phó học tập</b>

</div>



<br>



<label>

📅 Chọn tuần đánh giá:

</label>



<select id="chonTuan"

onchange="hienThi()">



<option value="Tuan1">

Tuần 1

</option>


<option value="Tuan2">

Tuần 2

</option>


<option value="Tuan3">

Tuần 3

</option>


<option value="Tuan4">

Tuần 4

</option>


<option value="Tuan5">

Tuần 5

</option>



</select>





<table>


<thead>


<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Chuẩn bị bài</th>

<th>Bài tập</th>

<th>Hăng hái xây dựng bài</th>

<th>Nhận xét</th>


</tr>


</thead>


<tbody id="bangHocTap">


</tbody>


</table>



<br>



<button class="btn-save"

onclick="luuDuLieu()">

💾 Lưu đánh giá tuần

</button>




</div>



<div class="footer">

Trợ lý quản lý lớp 97 – GVCN Trần Sáng

</div>



</div>






<script>




// LẤY DANH SÁCH HỌC SINH


let danhSachHocSinh =

JSON.parse(

localStorage.getItem(
"danhSachHocSinh"

)

)||[];




// DỮ LIỆU THEO TUẦN


let duLieuHocTap =

JSON.parse(

localStorage.getItem(
"theoDoiHocTapTuan"

)

)||{};






function layTen(hs){


return hs.hoTen ||

hs.ten ||

hs.name ||

"Chưa có tên";


}






function hienThi(){


let tuan =

document.getElementById(
"chonTuan"
).value;



if(!duLieuHocTap[tuan])

duLieuHocTap[tuan]={};



let html="";



danhSachHocSinh.forEach(

(hs,index)=>{


let id = hs.id || index;



let data =

duLieuHocTap[tuan][id] || {};




html += `


<tr>


<td>

${index+1}

</td>



<td>

<b>

${layTen(hs)}

</b>

</td>



<td>


<select id="cb_${id}">


<option>

Đầy đủ

</option>


<option>

Chưa đầy đủ

</option>


</select>


</td>




<td>


<select id="bt_${id}">


<option>

Hoàn thành

</option>


<option>

Chưa hoàn thành

</option>


</select>


</td>




<td>


<select id="xd_${id}">


<option>

Hăng hái

</option>


<option>

Chưa tích cực

</option>


</select>


</td>




<td>


<textarea id="nx_${id}"

placeholder="Nhập nhận xét">

${data.nhanXet || ""}

</textarea>


</td>



</tr>


`;



});



document.getElementById(

"bangHocTap"

).innerHTML=html;


}







function luuDuLieu(){


let tuan =

document.getElementById(
"chonTuan"
).value;



duLieuHocTap[tuan]={};



danhSachHocSinh.forEach(

(hs,index)=>{


let id = hs.id || index;



duLieuHocTap[tuan][id]={


chuanBi:

document.getElementById(
"cb_"+id
).value,



baiTap:

document.getElementById(
"bt_"+id
).value,



xayDung:

document.getElementById(
"xd_"+id
).value,



nhanXet:

document.getElementById(
"nx_"+id
).value



};



});





localStorage.setItem(

"theoDoiHocTapTuan",

JSON.stringify(duLieuHocTap)

);



alert(

"Đã lưu dữ liệu "+tuan

);



}





hienThi();



</script>



</body>


</html>
