<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bảng theo dõi học tập - Lớp 97</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    margin:0;
    background:#f4f7fb;
}


/* HEADER */

.header{
    background:white;
    padding:20px;
    text-align:center;
}

.header h1{
    margin:0;
    color:#1565c0;
    font-size:32px;
    font-weight:700;
}


/* NÚT VỀ TRANG CHỦ */

.home-btn{

    display:inline-block;
    margin:15px;
    padding:10px 20px;

    background:#1565c0;
    color:white;

    border-radius:12px;

    text-decoration:none;

    font-size:16px;
    font-weight:bold;
}


/* THANH CHỌN TUẦN */

.control{

    background:white;

    padding:15px;

    margin:10px 20px;

    border-radius:15px;

}


.control label{

    font-weight:bold;

}


select{

    padding:10px;

    border-radius:10px;

    border:1px solid #aaa;

    font-size:15px;

}



/* BẢNG */

.container{

    margin:20px;

    background:white;

    border-radius:15px;

    overflow:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:1200px;

}



th{

    background:#1565c0;

    color:white;

    padding:15px;

    font-size:17px;

    text-align:center;

}


td{

    padding:10px;

    border-bottom:1px solid #ddd;

    text-align:center;

}



/* TÊN HỌC SINH */

.name{

    font-weight:bold;

    text-align:left;

}


/* Ô CHỌN */

td select{

    width:95%;

    background:white;

}


/* NHẬN XÉT */

textarea{

    width:100%;

    min-height:60px;

    border-radius:10px;

    padding:8px;

    resize:none;

}



/* NÚT LƯU */

.save-btn{

    display:block;

    margin:20px auto;

    padding:14px 35px;

    background:#2e7d32;

    color:white;

    border:none;

    border-radius:15px;

    font-size:18px;

    cursor:pointer;

}


.save-btn:hover{

    background:#1b5e20;

}



/* FOOTER */

.footer{

    text-align:center;

    padding:15px;

    color:#555;

    font-size:15px;

}



</style>

</head>


<body>


<div class="header">

<h1>📚 BẢNG THEO DÕI HỌC TẬP</h1>

</div>



<a class="home-btn" href="index.html">
🏠 Về trang chủ
</a>



<div class="control">

<label>
Chọn tuần:
</label>


<select id="tuan">

<option value="1">Tuần 1</option>
<option value="2">Tuần 2</option>
<option value="3">Tuần 3</option>
<option value="4">Tuần 4</option>
<option value="5">Tuần 5</option>

<option value="6">Tuần 6</option>
<option value="7">Tuần 7</option>
<option value="8">Tuần 8</option>
<option value="9">Tuần 9</option>
<option value="10">Tuần 10</option>

<option value="11">Tuần 11</option>
<option value="12">Tuần 12</option>
<option value="13">Tuần 13</option>
<option value="14">Tuần 14</option>
<option value="15">Tuần 15</option>

<option value="16">Tuần 16</option>
<option value="17">Tuần 17</option>
<option value="18">Tuần 18</option>
<option value="19">Tuần 19</option>
<option value="20">Tuần 20</option>

<option value="21">Tuần 21</option>
<option value="22">Tuần 22</option>
<option value="23">Tuần 23</option>
<option value="24">Tuần 24</option>
<option value="25">Tuần 25</option>

<option value="26">Tuần 26</option>
<option value="27">Tuần 27</option>
<option value="28">Tuần 28</option>
<option value="29">Tuần 29</option>
<option value="30">Tuần 30</option>

<option value="31">Tuần 31</option>
<option value="32">Tuần 32</option>
<option value="33">Tuần 33</option>
<option value="34">Tuần 34</option>
<option value="35">Tuần 35</option>


</select>

</div>




<div class="container">


<table>


<thead>

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Chuẩn bị bài</th>

<th>Bài tập</th>

<th>Hăng hái xây dựng bài</th>

<th>Nhận xét</th>


</tr>

</thead>


<tbody id="bangHocTap">


</tbody>



</table>


</div>




<button class="save-btn" onclick="luuHocTap()">

💾 Lưu theo dõi học tập

</button>




<div class="footer">

Trợ lý quản lý lớp 97 – GVCN Trần Sáng

</div>



<script>

// ===============================
// DỮ LIỆU HỌC SINH LỚP 97
// ===============================


let danhSach = [];


// lấy danh sách từ file danhsach.js

if(typeof danhSachHocSinh !== "undefined"){

    danhSach = danhSachHocSinh;

}

else{

    danhSach = JSON.parse(
        localStorage.getItem("danhSachHocSinh")
    ) || [];

}




// ===============================
// TẠO BẢNG HỌC TẬP
// ===============================


function taoBang(){


let tbody = document.getElementById(
    "bangHocTap"
);


tbody.innerHTML="";



danhSach.forEach((hs,index)=>{


let dong = document.createElement("tr");



dong.innerHTML = `


<td>${index+1}</td>


<td class="name">
${hs.hoTen || hs.ten || hs}
</td>



<td>

<select class="chuanBi">

<option>Không chuẩn bị</option>

<option>Chưa đầy đủ</option>

<option>Đầy đủ</option>

</select>

</td>



<td>

<select class="baiTap">

<option>Chưa làm</option>

<option>Hoàn thành một ít</option>

<option>Hoàn thành đầy đủ</option>

</select>


</td>




<td>

<select class="xayDung">

<option>Không phát biểu</option>

<option>Chưa tích cực</option>

<option>Tích cực phát biểu</option>


</select>


</td>




<td>

<textarea class="nhanXet"
placeholder="Nhận xét học sinh..."
></textarea>


</td>


`;



tbody.appendChild(dong);



});



napDuLieu();

}



// ===============================
// LẤY KHÓA LƯU THEO TUẦN
// ===============================


function khoaDuLieu(){


let tuan =
document.getElementById("tuan").value;


return "hocTap_Tuan_"+tuan;


}




// ===============================
// LƯU HỌC TẬP
// ===============================


function luuHocTap(){


let ds=[];


let rows =
document.querySelectorAll(
"#bangHocTap tr"
);



rows.forEach(row=>{


let ten =
row.children[1].innerText;



let item={


ten:ten,


chuanBi:
row.querySelector(".chuanBi").value,


baiTap:
row.querySelector(".baiTap").value,


xayDung:
row.querySelector(".xayDung").value,


nhanXet:
row.querySelector(".nhanXet").value



};


ds.push(item);



});




localStorage.setItem(

khoaDuLieu(),

JSON.stringify(ds)

);



alert(
"✅ Đã lưu theo dõi học tập tuần "
+
document.getElementById("tuan").value
);



}




// ===============================
// TẢI DỮ LIỆU TUẦN
// ===============================


function napDuLieu(){


let data =
JSON.parse(

localStorage.getItem(
khoaDuLieu()
)

);



if(!data)
return;



let rows =
document.querySelectorAll(
"#bangHocTap tr"
);



rows.forEach((row,index)=>{


let hs=data[index];

if(!hs)
return;



row.querySelector(".chuanBi").value =
hs.chuanBi;



row.querySelector(".baiTap").value =
hs.baiTap;



row.querySelector(".xayDung").value =
hs.xayDung;



row.querySelector(".nhanXet").value =
hs.nhanXet;



});



}



// ===============================
// ĐỔI TUẦN
// ===============================


document
.getElementById("tuan")
.addEventListener(
"change",
function(){


napDuLieu();


});




// ===============================
// KHỞI ĐỘNG
// ===============================


taoBang();


</script>


</body>

</html>
