<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Theo dõi học tập lớp 97
</title>


<!-- KẾT NỐI DỮ LIỆU -->

<script src="danhSach.js"></script>

<script src="dulieu.js"></script>



<style>


*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}



body{

margin:0;

background:#f3f7fc;

}



/* HEADER */

.header{

height:160px;

background:
linear-gradient(
135deg,
#1976d2,
#42a5f5
);

color:white;

text-align:center;

padding-top:25px;

}



.header h1{

margin:0;

font-size:36px;

font-weight:800;

}



.header p{

font-size:20px;

margin-top:10px;

}



/* NÚT TRANG CHỦ */

.home{

display:inline-block;

margin:22px;

padding:14px 35px;

background:#1565c0;

color:white;

text-decoration:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

}



.home:hover{

background:#0d47a1;

}



/* CHỌN TUẦN */

.control{

background:white;

margin:20px;

padding:20px;

border-radius:18px;

box-shadow:
0 3px 10px #ddd;

}



.control label{

font-size:20px;

font-weight:bold;

}



.control select{

padding:10px 25px;

font-size:17px;

border-radius:10px;

margin-left:15px;

}




/* BẢNG */

.table-box{

margin:20px;

background:white;

border-radius:18px;

overflow:auto;

box-shadow:
0 3px 10px #ddd;

}



table{

width:100%;

min-width:1400px;

border-collapse:collapse;

}



th{

background:#1976d2;

color:white;

font-size:18px;

padding:16px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



.ten{

font-weight:bold;

text-align:left;

font-size:17px;

}



select{

width:95%;

padding:10px;

border-radius:10px;

font-size:16px;

}



textarea{

width:100%;

height:70px;

padding:10px;

border-radius:10px;

}



/* LƯU */

.save{

display:block;

margin:25px auto;

padding:15px 45px;

background:#2e7d32;

color:white;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.save:hover{

background:#1b5e20;

}



.footer{

text-align:center;

padding:20px;

color:#666;

}



</style>

</head>



<body>


<div class="header">

<h1>

📚 THEO DÕI HỌC TẬP LỚP 97

</h1>


<p>

Trường THCS Trần Phú

</p>


</div>



<a class="home"
href="trangchu.html">

🏠 Về trang chủ

</a>



<div class="control">


<label>

📅 Chọn tuần:

</label>



<select id="chonTuan">


<script>

for(let i=1;i<=35;i++){

document.write(

`
<option value="${i}">
Tuần ${i}
</option>
`

);

}

</script>


</select>


</div>




<div class="table-box">


<table>


<thead>


<tr>

<th>
STT
</th>


<th>
Họ và tên
</th>


<th>
Chuẩn bị bài
</th>


<th>
Bài tập
</th>


<th>
Hăng hái xây dựng bài
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="dsHocTap">


</tbody>



</table>


</div>




<button class="save"
onclick="luuHocTap()">

💾 Lưu dữ liệu tuần

</button>



<div class="footer">

Trợ lý quản lý lớp 97 – GVCN Trần Sáng
    <script>


// ========================================
// HỆ THỐNG THEO DÕI HỌC TẬP LỚP 97
// GVCN TRẦN SÁNG
// ========================================



let danhSachLop97 = [];




// ========================================
// LẤY DANH SÁCH HỌC SINH
// ========================================


function taiDanhSach(){


if(typeof layDanhSachHocSinh === "function"){


    danhSachLop97 = layDanhSachHocSinh();


}


else if(typeof danhSachHocSinh !== "undefined"){


    danhSachLop97 = danhSachHocSinh;


}



return danhSachLop97;


}






// ========================================
// TẠO BẢNG HỌC TẬP
// ========================================


function taoBangHocTap(){



let bang =

document.getElementById(
"dsHocTap"
);



bang.innerHTML="";



danhSachLop97 = taiDanhSach();





danhSachLop97.forEach(

(hs,index)=>{



let dong =

document.createElement(
"tr"
);





dong.innerHTML = `



<td>

${index+1}

</td>




<td class="ten">

${hs.hoTen}

</td>





<td>


<select class="chuanBi">


<option>
Không chuẩn bị
</option>


<option>
Chưa đầy đủ
</option>


<option>
Đầy đủ
</option>


</select>


</td>







<td>


<select class="baiTap">


<option>
Chưa làm
</option>


<option>
Hoàn thành một ít
</option>


<option>
Hoàn thành đầy đủ
</option>


</select>


</td>







<td>


<select class="xayDung">


<option>
Không phát biểu
</option>


<option>
Chưa tích cực
</option>


<option>
Tích cực phát biểu
</option>


</select>


</td>






<td>


<textarea

class="nhanXet"

placeholder="Nhận xét học sinh..."

></textarea>


</td>



`;




bang.appendChild(dong);



});




taiDuLieuTuan();


}







// ========================================
// KHÓA LƯU THEO TUẦN
// ========================================


function khoaHocTap(){



let tuan =

document.getElementById(
"chonTuan"
).value;



return "hocTapLop97_tuan_" + tuan;



}







// ========================================
// TẢI DỮ LIỆU TUẦN
// ========================================


function taiDuLieuTuan(){



let duLieu =

JSON.parse(

localStorage.getItem(

khoaHocTap()

)

);



if(!duLieu)

return;





let dong =

document.querySelectorAll(

"#dsHocTap tr"

);





dong.forEach(

(row,index)=>{


let hs =

duLieu[index];



if(!hs)

return;





row.querySelector(
".chuanBi"
).value =

hs.chuanBi;




row.querySelector(
".baiTap"
).value =

hs.baiTap;




row.querySelector(
".xayDung"
).value =

hs.xayDung;




row.querySelector(
".nhanXet"
).value =

hs.nhanXet;



});



}







// ========================================
// ĐỔI TUẦN
// ========================================


document

.getElementById(
"chonTuan"
)

.addEventListener(

"change",

function(){


taiDuLieuTuan();


}

);


// ========================================
// LƯU DỮ LIỆU HỌC TẬP
// ========================================


function luuHocTap(){



let duLieu=[];



let dong =

document.querySelectorAll(

"#dsHocTap tr"

);





dong.forEach(

(row,index)=>{


let hs =

danhSachLop97[index];



duLieu.push({



id:

hs.id,



hoTen:

hs.hoTen,



tuan:

document.getElementById(
"chonTuan"
).value,



chuanBi:

row.querySelector(
".chuanBi"
).value,



baiTap:

row.querySelector(
".baiTap"
).value,



xayDung:

row.querySelector(
".xayDung"
).value,



nhanXet:

row.querySelector(
".nhanXet"
).value



});



});






localStorage.setItem(

khoaHocTap(),

JSON.stringify(
duLieu
)

);





alert(

"✅ Đã lưu học tập tuần "

+

document.getElementById(
"chonTuan"
).value

);



}






// ========================================
// XUẤT DỮ LIỆU CHO AI NHẬN XÉT SAU NÀY
// ========================================


function layDuLieuHocTap(){



return JSON.parse(

localStorage.getItem(

khoaHocTap()

)

)

||

[];




}







// ========================================
// KHỞI TẠO TRANG
// ========================================


taoBangHocTap();



</script>



</body>


</html>

</div>
