<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Theo dõi học tập lớp 97
</title>


<style>


*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{

margin:0;

background:#f3f7fc;

}



/* HEADER */

.header{

height:160px;

background:linear-gradient(
135deg,
#1976d2,
#42a5f5
);

color:white;

text-align:center;

padding-top:25px;

}


.header h1{

font-size:36px;

margin:0;

font-weight:800;

}


.header p{

font-size:20px;

margin-top:12px;

}



/* NÚT VỀ TRANG CHỦ */


.home{

margin:22px 0 15px 18px;

display:inline-block;

padding:14px 32px;

background:#1565c0;

color:white;

text-decoration:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

}



.home:hover{

background:#0d47a1;

}



/* KHUNG CHỌN TUẦN */


.control{

background:white;

margin:20px;

padding:20px;

border-radius:18px;

box-shadow:
0 3px 10px #ddd;

}



.control label{

font-size:20px;

font-weight:bold;

}



.control select{

padding:10px 25px;

font-size:17px;

border-radius:10px;

margin-left:15px;

}



/* BẢNG */


.table-box{

margin:20px;

background:white;

border-radius:18px;

overflow:auto;

box-shadow:
0 3px 10px #ddd;

}



table{

width:100%;

min-width:1300px;

border-collapse:collapse;

}



th{

background:#1976d2;

color:white;

font-size:18px;

padding:16px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



.ten{

font-weight:bold;

text-align:left;

font-size:17px;

}



/* Ô CHỌN */


td select{

width:95%;

padding:10px;

border-radius:10px;

font-size:16px;

}



/* NHẬN XÉT */


textarea{

width:100%;

height:70px;

padding:10px;

border-radius:10px;

font-size:15px;

}



/* LƯU */


.save{

display:block;

margin:25px auto;

padding:15px 45px;

background:#2e7d32;

color:white;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.save:hover{

background:#1b5e20;

}



/* FOOTER */


.footer{

text-align:center;

padding:20px;

color:#666;

font-size:15px;

}



</style>


</head>



<body>



<div class="header">


<h1>
📚 THEO DÕI HỌC TẬP LỚP 97
</h1>


<p>
Trường THCS Trần Phú
</p>


</div>




<a class="home"
href="index.html">

🏠 Về trang chủ

</a>





<div class="control">


<label>

📅 Chọn tuần:

</label>


<select id="chonTuan">


<script>

for(let i=1;i<=35;i++){

document.write(

`<option value="${i}">
Tuần ${i}
</option>`

);

}

</script>


</select>


</div>






<div class="table-box">


<table>


<thead>


<tr>


<th>
STT
</th>


<th>
Họ và tên
</th>


<th>
Chuẩn bị bài
</th>


<th>
Bài tập
</th>


<th>
Hăng hái xây dựng bài
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="dsHocTap">


</tbody>


</table>


</div>





<button class="save"
onclick="luuHocTap()">

💾 Lưu dữ liệu tuần

</button>





<div class="footer">

Trợ lý quản lý lớp 97 – GVCN Trần Sáng

</div>



<script>
// ========================================
// HỆ THỐNG THEO DÕI HỌC TẬP LỚP 97
// GVCN TRẦN SÁNG
// ========================================



// ===============================
// LẤY DANH SÁCH HỌC SINH
// ===============================


let danhSachLop97 = [];



if(typeof danhSachHocSinh !== "undefined"){


    danhSachLop97 = danhSachHocSinh;


}

else{


    danhSachLop97 = JSON.parse(

        localStorage.getItem(
            "danhSachHocSinh"
        )

    ) || [];

}




// ===============================
// TẠO BẢNG HỌC SINH
// ===============================


function taoBangHocTap(){


let bang =
document.getElementById(
"dsHocTap"
);



bang.innerHTML="";



danhSachLop97.forEach(
(hs,index)=>{


let ten = "";



if(typeof hs === "string"){

ten = hs;

}

else{

ten =
hs.hoTen ||
hs.ten ||
hs.hoten ||
"";

}




let dong =
document.createElement(
"tr"
);



dong.innerHTML = `


<td>
${index+1}
</td>


<td class="ten">
${ten}
</td>


<td>

<select class="chuanBi">

<option>
Không chuẩn bị
</option>

<option>
Chưa đầy đủ
</option>

<option>
Đầy đủ
</option>

</select>

</td>



<td>

<select class="baiTap">


<option>
Chưa làm
</option>


<option>
Hoàn thành một ít
</option>


<option>
Hoàn thành đầy đủ
</option>


</select>


</td>




<td>

<select class="xayDung">


<option>
Không phát biểu
</option>


<option>
Chưa tích cực
</option>


<option>
Tích cực phát biểu
</option>


</select>


</td>



<td>

<textarea
class="nhanXet"
placeholder="Nhận xét học sinh..."
></textarea>


</td>


`;



bang.appendChild(dong);



});



taiDuLieuTuan();



}






// ===============================
// TẠO KHÓA LƯU THEO TUẦN
// ===============================


function khoaTuan(){


let tuan =

document.getElementById(
"chonTuan"
).value;



return:

"lop97_hoc_tap_tuan_" + tuan;



}






// ===============================
// LƯU DỮ LIỆU
// ===============================


function luuHocTap(){



let duLieu=[];



let dong =

document.querySelectorAll(
"#dsHocTap tr"
);



dong.forEach(
(row)=>{


duLieu.push({


hoTen:

row.querySelector(".ten")
.innerText,



chuanBi:

row.querySelector(".chuanBi")
.value,



baiTap:

row.querySelector(".baiTap")
.value,



xayDung:

row.querySelector(".xayDung")
.value,



nhanXet:

row.querySelector(".nhanXet")
.value



});



});





localStorage.setItem(

khoaTuan(),

JSON.stringify(
duLieu
)

);



alert(

"✅ Đã lưu dữ liệu học tập tuần "

+
document.getElementById(
"chonTuan"
).value

);



}







// ===============================
// TẢI DỮ LIỆU TUẦN CŨ
// ===============================


function taiDuLieuTuan(){


let duLieu =

JSON.parse(

localStorage.getItem(
khoaTuan()
)

);



if(!duLieu)
return;




let dong =

document.querySelectorAll(
"#dsHocTap tr"
);




dong.forEach(
(row,index)=>{


let hs =
duLieu[index];



if(!hs)
return;



row.querySelector(
".chuanBi"
).value =
hs.chuanBi;



row.querySelector(
".baiTap"
).value =
hs.baiTap;



row.querySelector(
".xayDung"
).value =
hs.xayDung;



row.querySelector(
".nhanXet"
).value =
hs.nhanXet;



});



}







// ===============================
// ĐỔI TUẦN
// ===============================


document

.getElementById(
"chonTuan"
)

.addEventListener(

"change",

function(){


taiDuLieuTuan();


}

);






// ===============================
// KHỞI ĐỘNG TRANG
// ===============================


taoBangHocTap();



</script>



</body>


</html>
