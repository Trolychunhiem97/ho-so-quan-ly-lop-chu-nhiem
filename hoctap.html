<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Theo dõi học tập lớp 97
</title>


<script src="danhsach.js"></script>
<script src="dulieu.js"></script>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:
"Segoe UI",
Arial,
sans-serif;

background:#eef5ff;

}



/* HEADER */

.header{


background:
linear-gradient(
135deg,
#1565c0,
#42a5f5
);


color:white;

padding:35px 20px;

text-align:center;

}



.header h1{


margin:0;

font-size:40px;

font-weight:800;

}



.header p{


margin-top:15px;

font-size:22px;

}




/* KHUNG CHUNG */


.container{


max-width:1500px;

margin:auto;

padding:35px;

}





/* NÚT VỀ TRANG CHỦ */


.btn-home{


display:block;

margin:0 auto 30px auto;


background:#1565c0;

color:white;


border:none;


padding:15px 35px;


border-radius:15px;


font-size:18px;


font-weight:bold;


cursor:pointer;


}



.btn-home:hover{


background:#0d47a1;


}





/* BOX */


.box{


background:white;


border-radius:25px;


padding:30px;


margin-bottom:30px;


box-shadow:

0 8px 25px rgba(0,0,0,0.12);


}




.box h2{


text-align:center;


color:#1565c0;


font-size:28px;


}




/* CHỌN TUẦN */


.week-box{


text-align:center;


}



select{


padding:12px 25px;


font-size:17px;


border-radius:12px;


border:1px solid #aaa;


min-width:250px;


}





/* BẢNG */


table{


width:100%;


border-collapse:collapse;


margin-top:25px;


}



thead th{


background:#1565c0;


color:white;


padding:16px;


font-size:18px;


}



tbody td{


padding:12px;


border-bottom:

1px solid #ddd;


text-align:center;


font-size:16px;


}



tbody tr:hover{


background:#f4f9ff;


}





textarea{


width:100%;


height:70px;


border-radius:10px;


padding:10px;


font-size:15px;


}





/* NÚT LƯU */


.btn-save{


display:block;


margin:30px auto 0;


background:#00897b;


color:white;


border:none;


padding:16px 45px;


border-radius:15px;


font-size:18px;


font-weight:bold;


cursor:pointer;


}



.btn-save:hover{


background:#00695c;


}





.thongbao{


text-align:center;


font-weight:bold;


color:#00897b;


font-size:18px;


margin-top:15px;


}



</style>


</head>



<body>



<div class="header">


<h1>
📚 THEO DÕI HỌC TẬP LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>





<div class="container">



<button 
class="btn-home"
onclick="veTrangChu()">

🏠 Về trang chủ quản lý lớp 97

</button>





<div class="box week-box">


<h2>
👤 Người nhập: Lớp phó học tập
</h2>



<h2>
📅 Chọn tuần đánh giá
</h2>



<select 
id="chonTuan"
onchange="hienThiHocSinh()">

</select>



<div 
id="thongBao"
class="thongbao">

</div>



</div>







<div class="box">


<h2>
📚 BẢNG THEO DÕI HỌC TẬP
</h2>



<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Chuẩn bị bài
</th>


<th>
Bài tập
</th>


<th>
Hăng hái xây dựng bài
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="bangHocTap">


</tbody>



</table>



<button
class="btn-save"
onclick="luuHocTap()">

💾 Lưu đánh giá tuần

</button>



</div>




</div>
