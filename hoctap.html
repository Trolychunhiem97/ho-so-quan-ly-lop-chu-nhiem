<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Theo dõi học tập lớp 97</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
}

h1,h2{
    text-align:center;
    color:#1565c0;
}

.info{
    background:#eef5ff;
    padding:15px;
    border-radius:10px;
    text-align:center;
    font-size:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

th{
    background:#1565c0;
    color:white;
    padding:15px;
    font-size:18px;
}

td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

select,textarea{

    width:95%;
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;

}

textarea{
    height:60px;
}

</style>

</head>


<body>


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
📚 THEO DÕI HỌC TẬP LỚP 97
</h1>


<div class="info">

👤 Xin chào:
<b>GVCN Trần Sáng</b>

<br>

Người phụ trách:
<b>Lớp phó học tập</b>

</div>



<table>


<thead>

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Chuẩn bị bài</th>

<th>Bài tập</th>

<th>Hăng hái xây dựng bài</th>

<th>Nhận xét</th>


</tr>


</thead>



<tbody id="bangHocTap">


</tbody>



</table>



<script>


// dữ liệu học sinh lấy từ localStorage

let danhSach =
JSON.parse(
localStorage.getItem("danhSachHocSinh")
) || [];



function hienThi(){


let html="";


danhSach.forEach((hs,index)=>{


html += `


<tr>


<td>${index+1}</td>


<td>
${hs.hoTen || hs.ten || hs.name}
</td>


<td>

<select>

<option>Đầy đủ</option>

<option>Chưa đầy đủ</option>

</select>

</td>



<td>

<select>

<option>Hoàn thành</option>

<option>Chưa hoàn thành</option>

</select>

</td>




<td>

<select>

<option>Có</option>

<option>Chưa</option>

</select>


</td>




<td>

<textarea
placeholder="Nhập nhận xét..."
></textarea>


</td>



</tr>


`;


});


document.getElementById(
"bangHocTap"
).innerHTML = html;


}



hienThi();


</script>



</body>

</html>
