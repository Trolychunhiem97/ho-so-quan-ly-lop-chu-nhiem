<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Thông báo phụ huynh lớp 97
</title>


<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1100px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px #ccc;

}



h1,h2{

text-align:center;

color:#1565c0;

}



.box{

background:#f8fbff;

padding:25px;

border-radius:20px;

margin-top:20px;

}



input,select,textarea{

width:100%;

padding:12px;

margin:8px 0;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}



textarea{

height:180px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:14px 25px;

border-radius:12px;

cursor:pointer;

margin:5px;

}



button:hover{

background:#0d47a1;

}



.result{

background:#fff8e1;

padding:25px;

border-radius:20px;

white-space:pre-line;

line-height:1.6;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



td,th{

border:1px solid #ddd;

padding:10px;

}



th{

background:#1565c0;

color:white;

}



.footer{

text-align:center;

margin-top:30px;

color:#666;

}


</style>


</head>



<body>


<div class="container">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
🔔 TRỢ LÝ THÔNG BÁO PHỤ HUYNH
</h1>


<h2>
Lớp 97 - GVCN Trần Sáng
</h2>





<div class="box">


<h3>
👨‍🎓 Chọn học sinh
</h3>


<select id="hocSinh">

<option>
-- Chọn học sinh --
</option>


</select>



</div>







<div class="box">


<h3>
👨‍👩‍👧 Thông tin phụ huynh
</h3>


<div id="thongTinPH">

Chưa chọn học sinh

</div>


</div>








<div class="box">


<h3>
🤖 Nội dung thông báo AI
</h3>



<select id="loaiThongBao">


<option>
Nhận xét tháng
</option>


<option>
Kết quả cuối năm
</option>


<option>
Nhắc nhở học tập
</option>


<option>
Tuyên dương
</option>


</select>



<br>


<button onclick="taoThongBao()">

🤖 Tạo tin nhắn

</button>



<button onclick="saoChep()">

📋 Sao chép

</button>



</div>








<div class="result" id="noiDung">


Nội dung thông báo sẽ hiện ở đây...

</div>





<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>

<script>


// =====================================
// DỮ LIỆU
// =====================================


let danhSachHS = JSON.parse(

localStorage.getItem(

"tongHopNam97"

)

)

|| [];





let danhSachPH = JSON.parse(

localStorage.getItem(

"phuHuynh97"

)

)

|| [];







// =====================================
// ĐỔ DANH SÁCH HỌC SINH
// =====================================



function napHocSinh(){



let select =

document.getElementById(

"hocSinh"

);



danhSachHS.forEach(

(hs)=>{



select.innerHTML +=


`

<option value="${hs.ten}">

${hs.ten}

</option>


`;



});



}







// =====================================
// HIỂN THỊ PHỤ HUYNH
// =====================================



document.getElementById(

"hocSinh"

).addEventListener(

"change",

function(){



let ten=this.value;



let ph=

danhSachPH.find(

(x)=>x.tenHS==ten

);





if(ph){


document.getElementById(

"thongTinPH"

).innerHTML=


`

👤 Học sinh:

<b>${ph.tenHS}</b>

<br><br>

👨 Phụ huynh:

<b>${ph.tenPH}</b>

<br>

📞 Số điện thoại:

<b>${ph.sdt}</b>


`;



}

else{


document.getElementById(

"thongTinPH"

).innerHTML=


`

Chưa có dữ liệu phụ huynh.

<br>

Vui lòng cập nhật trong phần quản lý phụ huynh.

`;



}



}



);









// =====================================
// TẠO THÔNG BÁO AI
// =====================================


function taoThongBao(){



let ten =

document.getElementById(

"hocSinh"

).value;



if(!ten){


alert(

"Vui lòng chọn học sinh"

);


return;


}






let loai=

document.getElementById(

"loaiThongBao"

).value;






let hs=

danhSachHS.find(

(x)=>x.ten==ten

);






let ph=

danhSachPH.find(

(x)=>x.tenHS==ten

);






let noiDung="";







if(loai=="Nhận xét tháng"){


noiDung=

`

Kính gửi quý phụ huynh em ${ten}!


GVCN xin gửi nhận xét về tình hình học tập và rèn luyện của em.


Kết quả hiện tại:

- Điểm đánh giá: ${hs?.diemTB || "Chưa cập nhật"}

- Xếp loại: ${hs?.xepLoai || "Chưa cập nhật"}


Nhận xét:

${hs?.nhanXet || "Em cần tiếp tục cố gắng trong học tập và rèn luyện."}


Rất mong gia đình tiếp tục phối hợp cùng nhà trường để hỗ trợ em ngày càng tiến bộ.


Trân trọng!


GVCN Trần Sáng

`;



}










if(loai=="Kết quả cuối năm"){


noiDung=

`

Kính gửi quý phụ huynh!


GVCN thông báo kết quả rèn luyện cuối năm của em ${ten}.


Xếp loại:

${hs?.xepLoai || ""}


Nhận xét:

${hs?.nhanXet || ""}


Gia đình tiếp tục động viên, khích lệ em phát huy ưu điểm và khắc phục hạn chế.


Trân trọng!

GVCN Trần Sáng

`;



}








if(loai=="Nhắc nhở học tập"){


noiDung=

`

Kính gửi quý phụ huynh em ${ten}!


Hiện nay em cần chú ý hơn trong việc học tập, chuẩn bị bài và thực hiện nhiệm vụ được giao.


Kính mong gia đình phối hợp nhắc nhở, động viên em.


Xin cảm ơn sự đồng hành của gia đình.


GVCN Trần Sáng

`;



}








if(loai=="Tuyên dương"){


noiDung=

`

Kính gửi quý phụ huynh!


GVCN xin chúc mừng em ${ten} đã có những cố gắng và tiến bộ tích cực.


Những kết quả đạt được là sự nỗ lực của em cùng sự đồng hành của gia đình.


Rất mong em tiếp tục phát huy trong thời gian tới.


GVCN Trần Sáng

`;



}








document.getElementById(

"noiDung"

).innerText=

noiDung;






// lưu lịch sử


let lichSu=

JSON.parse(

localStorage.getItem(

"lichSuThongBao97"

)

)

|| [];





lichSu.push({

hocSinh:ten,

loai:loai,

noiDung:noiDung,

ngay:new Date().toLocaleString()

});





localStorage.setItem(

"lichSuThongBao97",

JSON.stringify(lichSu)

);



}










// =====================================
// SAO CHÉP ZALO
// =====================================


function saoChep(){



let text=

document.getElementById(

"noiDung"

).innerText;





navigator.clipboard.writeText(text);



alert(

"✅ Đã sao chép nội dung. Có thể gửi qua Zalo."

);



}








window.onload=function(){


napHocSinh();


};



</script>

</div>
