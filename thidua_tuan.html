<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Thi đua tuần - Lớp 97
</title>


<script src="phanquyen.js"></script>
<script src="danhsach.js"></script>
<script src="dulieu.js"></script>



<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:30px;

text-align:center;

}



.header h1{

margin:0;

font-size:32px;

}



.btn-home{

margin-top:20px;

background:white;

color:#1565c0;

border:none;

padding:12px 25px;

border-radius:20px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.btn-home:hover{

background:#e3f2fd;

}



.container{

max-width:1300px;

margin:auto;

padding:25px;

}



.card{

background:white;

padding:25px;

border-radius:25px;

margin-bottom:25px;

box-shadow:0 8px 20px rgba(0,0,0,.12);

}



.control{

display:flex;

gap:20px;

flex-wrap:wrap;

}



select{

padding:12px 20px;

border-radius:12px;

font-size:16px;

border:1px solid #ccc;

}



.stat{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}



.stat-box{

background:#f4f8ff;

padding:20px;

border-radius:18px;

text-align:center;

}



.stat-box h2{

color:#1565c0;

margin:0;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:14px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f5f9ff;

}



footer{

text-align:center;

padding:20px;

color:#666;

}


</style>


</head>


<body>



<div class="header">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>



<button class="btn-home"
onclick="veTrangChu()">

🏠 Quay lại trang chủ

</button>


</div>





<div class="container">





<div class="card">


<h2>
📅 Chọn tuần đánh giá
</h2>


<div class="control">


<select id="chonTuan"
onchange="hienThi()">

</select>




<select id="chonTo"
onchange="hienThi()">


<option value="0">
Tất cả tổ
</option>


<option value="1">
Tổ 1
</option>


<option value="2">
Tổ 2
</option>


<option value="3">
Tổ 3
</option>


</select>



</div>


</div>






<div class="card">


<h2>
📊 Tổng hợp tuần
</h2>


<div class="stat">


<div class="stat-box">

<h2 id="tongHS">
0
</h2>

<p>
👨‍🎓 Tổng học sinh
</p>

</div>



<div class="stat-box">

<h2 id="daDG">
0
</h2>

<p>
✅ Đã đánh giá
</p>

</div>



<div class="stat-box">

<h2 id="chuaDG">
0
</h2>

<p>
⏳ Chưa đánh giá
</p>

</div>




<div class="stat-box">

<h2 id="diemTB">
0
</h2>

<p>
⭐ Điểm trung bình
</p>

</div>



</div>


</div>








<div class="card">


<h2>
📋 Bảng thi đua
</h2>



<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Tổ
</th>


<th>
Điểm
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="bangThiDua">

</tbody>


</table>


</div>




</div>




<footer>

Trường THCS Trần Phú

<br>

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</footer>






<script>


// tạo 35 tuần


function taoTuan(){


let html="";


for(let i=1;i<=35;i++){


html+=`

<option value="${i}">
Tuần ${i}
</option>

`;

}


document.getElementById(
"chonTuan"
).innerHTML=html;


}



taoTuan();







function xepLoai(d){


if(d>=90)
return "Xuất sắc";


if(d>=75)
return "Khá";


if(d>=50)
return "Đạt";


return "Cần cố gắng";


}







function hienThi(){



let tuan =
Number(
document.getElementById("chonTuan").value
);



let to =
Number(
document.getElementById("chonTo").value
);




let ds =
layDanhSachHocSinh();




let diem =
layDiemTuan();




let html="";

let tong=0;

let soDG=0;





let dem=0;



ds.forEach(hs=>{


if(
to==0 ||
Number(hs.to)==to
){


dem++;



let d =
diem.find(x=>

x.hocSinhId==hs.id

&&

x.tuan==tuan

);




if(d){

soDG++;

tong+=Number(d.diem);

}



html+=`

<tr>

<td>${dem}</td>


<td>${hs.hoTen}</td>


<td>
Tổ ${hs.to || "chưa xếp"}
</td>


<td>
${d?d.diem:"-"}
</td>


<td>
${d?xepLoai(d.diem):"Chưa đánh giá"}
</td>


<td>
${d?d.nhanXet:""}
</td>


</tr>

`;



}



});




document.getElementById(
"bangThiDua"
).innerHTML=html;



document.getElementById(
"tongHS"
).innerHTML=dem;


document.getElementById(
"daDG"
).innerHTML=soDG;



document.getElementById(
"chuaDG"
).innerHTML=
dem-soDG;



document.getElementById(
"diemTB"
).innerHTML=

soDG?

(tong/soDG).toFixed(1)

:

0;



}





function veTrangChu(){

window.location.href="trangchu.html";

}





khoiTaoDuLieu();


hienThi();



</script>



</body>

</html>
