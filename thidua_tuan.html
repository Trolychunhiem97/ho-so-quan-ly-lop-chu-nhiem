<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Thi đua tuần lớp 97
</title>



<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

}



h1,h2{

text-align:center;

color:#1565c0;

}



.form{

background:#f8fbff;

padding:20px;

border-radius:20px;

}



input,select{

width:100%;

padding:12px;

margin:8px 0;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 25px;

border-radius:12px;

cursor:pointer;

}



table{

width:100%;

margin-top:25px;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.top{

background:#fff8e1;

padding:20px;

border-radius:20px;

margin-top:20px;

}



</style>


</head>



<body>



<div class="container">



<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>



<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>



<div class="form">


<h3>
➕ Cập nhật điểm thi đua
</h3>



<label>
Tên học sinh
</label>


<input id="tenHocSinh"

placeholder="Nhập tên học sinh">





<label>
Loại hoạt động
</label>



<select id="loai">


<option value="cong">

⭐ Điểm tốt (+)

</option>


<option value="tru">

⚠ Vi phạm (-)

</option>


</select>





<label>
Số điểm
</label>


<input id="diem"

type="number"

value="5">





<label>
Nội dung
</label>


<input id="noiDung"

placeholder="Ví dụ: Phát biểu xây dựng bài">






<button onclick="capNhatDiem()">

💾 Lưu điểm

</button>



</div>





<h3>
📋 Bảng thi đua tuần
</h3>



<table id="bang">


<tr>

<th>
STT
</th>

<th>
Học sinh
</th>

<th>
Điểm
</th>

<th>
Nhận xét
</th>

</tr>


</table>




<div class="top" id="xepHang">

</div>
<script>


// ==================================
// DỮ LIỆU THI ĐUA TUẦN
// ==================================


let danhSachThiDua = JSON.parse(

localStorage.getItem(

"thiDuaTuan97"

)

)

|| [];







// ==================================
// CẬP NHẬT ĐIỂM
// ==================================


function capNhatDiem(){



let ten =

document.getElementById(

"tenHocSinh"

).value;



let loai =

document.getElementById(

"loai"

).value;



let diem = Number(

document.getElementById(

"diem"

).value

);



let noiDung =

document.getElementById(

"noiDung"

).value;







if(!ten){


alert(

"Vui lòng nhập tên học sinh!"

);


return;


}







let hs = danhSachThiDua.find(

(x)=>

x.ten==ten

);







// Nếu học sinh mới

if(!hs){


hs={


ten:ten,


diem:100,


nhanXet:[]


};


danhSachThiDua.push(hs);


}








// cộng hoặc trừ điểm


if(loai=="cong"){


hs.diem += diem;


}

else{


hs.diem -= diem;


}







// không cho âm


if(hs.diem<0){


hs.diem=0;


}








hs.nhanXet.push(


(loai=="cong"

? "+"

:

"-"

)

+

diem

+

" điểm: "

+

noiDung



);









localStorage.setItem(

"thiDuaTuan97",

JSON.stringify(

danhSachThiDua

)

);







hienThiBang();



xoaNhap();



}









// ==================================
// HIỂN THỊ BẢNG
// ==================================



function hienThiBang(){



let bang=

document.getElementById(

"bang"

);



bang.innerHTML=

`

<tr>

<th>STT</th>

<th>Học sinh</th>

<th>Điểm</th>

<th>Nhận xét</th>

</tr>

`;







let ds =

[...danhSachThiDua]

.sort(

(a,b)=>

b.diem-a.diem

);







ds.forEach(

(hs,index)=>{



bang.innerHTML +=


`

<tr>

<td>

${index+1}

</td>


<td>

${hs.ten}

</td>


<td>

⭐ ${hs.diem}

</td>


<td>

${hs.nhanXet.join("<br>")}

</td>


</tr>


`;



});







xepHang(ds);



}









// ==================================
// XẾP HẠNG
// ==================================



function xepHang(ds){



let div=

document.getElementById(

"xepHang"

);



if(ds.length==0){


div.innerHTML=

"Chưa có dữ liệu thi đua";


return;


}







let top=

ds.slice(

0,

5

);








let html=

`

<h3>

🏆 TOP 5 THI ĐUA TUẦN

</h3>

`;







top.forEach(

(hs,i)=>{



html +=


`

<p>

${i+1}. 

<b>${hs.ten}</b>

- ${hs.diem} điểm

</p>

`;


});







html +=

`

<hr>

🤖 Nhận xét tự động:

<br><br>

`;








if(ds[0].diem>=110){


html +=

"Lớp có nhiều học sinh tích cực, "

+

tinh thần thi đua tốt. "

;


}

else{


html +=

"Cần tiếp tục duy trì nền nếp, "

+

tăng cường tinh thần tự giác học tập và rèn luyện."

;


}







div.innerHTML=html;



}









// ==================================
// XÓA Ô NHẬP
// ==================================



function xoaNhap(){



document.getElementById(

"tenHocSinh"

).value="";



document.getElementById(

"noiDung"

).value="";



}









window.onload=function(){


hienThiBang();


};



</script>
