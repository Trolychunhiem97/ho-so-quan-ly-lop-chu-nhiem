<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Thi đua tuần lớp 97</title>


<script src="phanquyen.js"></script>

<script src="danhsach.js"></script>


<style>


body{

font-family:Arial,sans-serif;

background:#eef5ff;

padding:20px;

}


.container{

max-width:1300px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}



h1,h2{

color:#1565c0;

}



.user{

background:#f2f7ff;

padding:15px;

}

border-collapse:collapse;

}

}

}



button{

padding:12px 25px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



.xuatSac{

}



.footer{

margin-top:30px;

}


</style>


</head>


<body>



<div class="container">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<div class="user" id="nguoiDung">

</div>




<div style="text-align:center">


<button onclick="tinhDiemTuan()">

📊 Tính điểm tuần

</button>


<button onclick="taoNhanXetTuan()">

🤖 AI nhận xét tuần

</button>


<button onclick="luuThiDuaTuan()">

💾 Lưu kết quả

</button>



<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>


</div>





<table id="bangThiDua">


<tr>

<th>
STT
</th>

<th>
Họ tên
</th>

<th>
Điểm đầu tuần
</th>

<th>
Học tập
</th>

<th>
Lao động
</th>

<th>
Tổ trưởng
</th>

<th>
Điểm cuối tuần
</th>

<th>
Xếp loại
</th>

<th>
Nhận xét
</th>


</tr>


</table>





<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// ===============================
// HIỂN THỊ NGƯỜI DÙNG
// ===============================


let nguoiDung =

JSON.parse(

localStorage.getItem(

"nguoiDungDangNhap"

)

);




if(!nguoiDung){


location.href="dangnhap.html";


}





document.getElementById(

"nguoiDung"

).innerHTML=


"👤 Xin chào: <b>"

+

nguoiDung.ten

+

"</b>";








// ===============================
// LẤY DANH SÁCH HỌC SINH
// ===============================



let dsHocSinh=[];



if(typeof danhSachHocSinh!="undefined"){


dsHocSinh=danhSachHocSinh;


}

else{


dsHocSinh=[

"Nguyễn Văn A",

"Trần Văn B",

"Lê Thị C"

];


}








// ===============================
// LẤY ĐIỂM TỪ CÁC MODULE
// ===============================



function layDiemNguon(){



let hocTap=

JSON.parse(

localStorage.getItem(

"hocTapLop97"

)

)

||{duLieu:[]};




let laoDong=

JSON.parse(

localStorage.getItem(

"laoDongLop97"

)

)

||{duLieu:[]};




let toTruong=

JSON.parse(

localStorage.getItem(

"danhGiaTo97"

)

)

||{};




return {

hocTap:hocTap.duLieu || [],

laoDong:laoDong.duLieu || [],

toTruong:toTruong

};


}








// ===============================
// TÍNH ĐIỂM TUẦN
// ===============================


function tinhDiemTuan(){



let bang=

document.getElementById(

"bangThiDua"

);



let nguon=

layDiemNguon();





bang.innerHTML=`

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Điểm đầu tuần</th>

<th>Học tập</th>

<th>Lao động</th>

<th>Tổ trưởng</th>

<th>Điểm cuối tuần</th>

<th>Xếp loại</th>

<th>Nhận xét</th>

</tr>

`;






dsHocSinh.forEach(

(hs,index)=>{


let diemHocTap=0;

let diemLaoDong=0;

let diemTo=0;





// Học tập

let ht=

nguon.hocTap.find(

x=>x.ten==hs

);



if(ht){


diemHocTap=

Number(ht.diem)||0;


}






// Lao động

let ld=

nguon.laoDong.find(

x=>x.ten==hs

);



if(ld){


diemLaoDong=

Number(ld.diem)||0;


}







// Tổ trưởng

Object.values(

nguon.toTruong

).forEach(to=>{


if(to.duLieu){


let tv=

to.duLieu.find(

x=>x.ten==hs

);



if(tv){


diemTo=

Number(tv.diem)||0;


}



}



});









let tong=

100

+

diemHocTap

+

diemLaoDong

+

diemTo;







let xepLoai="";



if(tong>=110)

xepLoai="🌟 Xuất sắc";


else if(tong>=100)

xepLoai="✅ Tốt";


else if(tong>=90)

xepLoai="👍 Khá";


else

xepLoai="⚠ Cần cố gắng";








bang.innerHTML +=`

<tr>


<td>${index+1}</td>


<td>${hs}</td>


<td>100</td>


<td>${diemHocTap}</td>


<td>${diemLaoDong}</td>


<td>${diemTo}</td>


<td><b>${tong}</b></td>


<td>${xepLoai}</td>


<td class="nhanXet">

Chưa tạo

</td>


</tr>

`;



});





}








// ===============================
// AI NHẬN XÉT TUẦN
// ===============================



function taoNhanXetTuan(){



let dong=

document.querySelectorAll(

"#bangThiDua tr"

);





for(let i=1;i<dong.length;i++){



let ten=

dong[i].cells[1].innerText;



let diem=

Number(

dong[i].cells[6].innerText

);





let nx="";



if(diem>=110){


nx=

"Em có thành tích nổi bật, tích cực trong học tập và hoạt động tập thể.";


}

else if(diem>=100){


nx=

"Em duy trì tốt ý thức học tập, rèn luyện và cần tiếp tục phát huy.";


}

else{


nx=

"Em cần cố gắng hơn trong học tập, ý thức và tham gia hoạt động lớp.";

}



dong[i].cells[8].innerText=nx;



}



alert(

"🤖 Đã tạo nhận xét tuần!"

);



}








// ===============================
// LƯU THI ĐUA TUẦN
// ===============================



function luuThiDuaTuan(){



let bang=

document.getElementById(

"bangThiDua"

);



let dong=

bang.querySelectorAll(

"tr"

);



let ketQua=[];





for(let i=1;i<dong.length;i++){



let o=

dong[i].cells;



ketQua.push({



ten:o[1].innerText,


diem:

Number(o[6].innerText),


xepLoai:

o[7].innerText,


nhanXet:

o[8].innerText



});



}





let lichSu=

JSON.parse(

localStorage.getItem(

"lichSuTuan97"

)

)

||[];





lichSu.push({


tuan:

"Tuần "+(lichSu.length+1),


ngay:

new Date().toLocaleString("vi-VN"),


hocSinh:

ketQua



});







localStorage.setItem(

"lichSuTuan97",

JSON.stringify(lichSu)

);





alert(

"✅ Đã lưu kết quả thi đua tuần!"

);



}








window.onload=function(){



tinhDiemTuan();



};



</script>


</body>

</html>


</div>
