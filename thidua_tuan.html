<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Thi đua tuần lớp 97
</title>


<script src="phanquyen.js"></script>
<script src="danhsach.js"></script>
<script src="dulieu.js"></script>



<style>


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:30px;

text-align:center;

}



.container{

max-width:1200px;

margin:auto;

padding:25px;

}



.card{

background:white;

border-radius:20px;

padding:25px;

margin-bottom:20px;

box-shadow:0 5px 15px #ddd;

}



.select-box{

display:flex;

gap:20px;

align-items:center;

}



select{

padding:10px;

border-radius:10px;

font-size:16px;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



.xuat-sac{

color:#008000;

font-weight:bold;

}


.kha{

color:#1565c0;

font-weight:bold;

}


.can-co-gang{

color:#d35400;

font-weight:bold;

}




</style>


</head>


<body>



<div class="header">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>






<div class="container">



<div class="card">


<h2>
📅 Chọn tuần đánh giá
</h2>


<div class="select-box">


<select id="chonTuan"
onchange="hienThiBang()">


<option value="1">
Tuần 1
</option>


<option value="2">
Tuần 2
</option>


<option value="3">
Tuần 3
</option>


<option value="4">
Tuần 4
</option>


</select>



<select id="locTo"
onchange="hienThiBang()">


<option value="0">
Tất cả tổ
</option>


<option value="1">
Tổ 1
</option>


<option value="2">
Tổ 2
</option>


<option value="3">
Tổ 3
</option>


</select>


</div>



</div>








<div class="card">


<h2>
📊 Bảng thi đua
</h2>



<table>


<thead>


<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Tổ
</th>


<th>
Điểm
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="bangThiDua">


</tbody>


</table>



</div>








<div class="card">


<h2>
🏅 Top 5 tuần
</h2>


<div id="top5">


</div>


</div>



</div>






<script>


let nguoiDung =
layNguoiDung();



if(!nguoiDung){


alert(
"Bạn chưa đăng nhập"
);


window.location.href="index.html";


}






function xepLoai(diem){


if(diem>=90)

return "Xuất sắc";


if(diem>=75)

return "Khá";


if(diem>=50)

return "Đạt";


return "Cần cố gắng";


}







function hienThiBang(){



let tuan =
Number(

document.getElementById(
"chonTuan"
).value

);



let to =
Number(

document.getElementById(
"locTo"
).value

);




let hs =
layDanhSachHocSinh();



let diem =
layDiemTuan();




let html="";



let danhSach=[];




hs.forEach(

x=>{


let d =
diem.find(

y=>

y.hocSinhId===x.id
&&
y.tuan===tuan

);



if(d){


if(to===0 || x.to===to){



danhSach.push({

ten:x.hoTen,

to:x.to,

diem:d.diem,

nhanxet:d.nhanXet

});


}



}


});





danhSach.sort(

(a,b)=>

b.diem-a.diem

);





danhSach.forEach(

(hs,index)=>{


html+=`

<tr>

<td>
${index+1}
</td>


<td>
${hs.ten}
</td>


<td>
Tổ ${hs.to}
</td>


<td>
${hs.diem}
</td>


<td>

${xepLoai(hs.diem)}

</td>


<td>

${hs.nhanxet || ""}

</td>


</tr>

`;



});





document.getElementById(

"bangThiDua"

).innerHTML=html;






let top="";



danhSach.slice(0,5)

.forEach(

(x,i)=>{


top+=`

<p>
🏅 ${i+1}.
${x.ten}
-
<b>${x.diem}</b> điểm
</p>

`;


});




document.getElementById(

"top5"

).innerHTML=top;



}



hienThiBang();



</script>


</body>

</html>
