<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Thi đua tuần lớp 97
</title>


<script src="phanquyen.js"></script>
<script src="danhsach.js"></script>
<script src="dulieu.js"></script>



<style>

body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}


.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:30px;

text-align:center;

}



.container{

max-width:1300px;

margin:auto;

padding:25px;

}



.box{

background:white;

border-radius:20px;

padding:25px;

margin-bottom:25px;

box-shadow:0 8px 20px #ddd;

}



.controls{

display:flex;

gap:20px;

flex-wrap:wrap;

}



select{

padding:12px 20px;

font-size:16px;

border-radius:12px;

}



.thongke{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

}



.item{

background:#f3f8ff;

padding:20px;

border-radius:18px;

text-align:center;

}



.item h2{

color:#1565c0;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:14px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#f5f9ff;

}



</style>


</head>


<body>



<div class="header">

<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>





<div class="container">



<div class="box">


<h2>
📅 Chọn tuần và tổ
</h2>


<div class="controls">


<select id="tuan"
onchange="hienThi()">

</select>



<select id="to"
onchange="hienThi()">


<option value="0">
Tất cả tổ
</option>


<option value="1">
Tổ 1
</option>


<option value="2">
Tổ 2
</option>


<option value="3">
Tổ 3
</option>


</select>



</div>


</div>





<div class="box">


<h2>
📊 Tổng quan
</h2>



<div class="thongke">


<div class="item">

<h2 id="tong">
0
</h2>

<p>
👨‍🎓 Tổng học sinh
</p>

</div>



<div class="item">

<h2 id="dadanhgia">
0
</h2>

<p>
✅ Đã đánh giá
</p>

</div>



<div class="item">

<h2 id="chuadanhgia">
0
</h2>

<p>
⏳ Chưa đánh giá
</p>

</div>



<div class="item">

<h2 id="trungbinh">
0
</h2>

<p>
⭐ Điểm TB
</p>

</div>


</div>


</div>







<div class="box">


<h2>
📋 Bảng thi đua tuần
</h2>


<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Tổ
</th>


<th>
Điểm
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét
</th>


</tr>


</thead>



<tbody id="bang">

</tbody>



</table>



</div>





</div>







<script>


// ========================
// TẠO 35 TUẦN
// ========================


function tao35Tuan(){


let html="";


for(let i=1;i<=35;i++){


html+=`

<option value="${i}">
Tuần ${i}
</option>

`;

}



document.getElementById(
"tuan"
).innerHTML=html;



}



tao35Tuan();





// ========================
// XẾP LOẠI
// ========================


function xepLoai(diem){


if(diem>=90)

return "Xuất sắc";


if(diem>=75)

return "Khá";


if(diem>=50)

return "Đạt";


return "Cần cố gắng";


}







// ========================
// HIỂN THỊ
// ========================


function hienThi(){


let tuan =
Number(
document.getElementById("tuan").value
);



let to =
Number(
document.getElementById("to").value
);





let ds =
layDanhSachHocSinh();



let diem =
layDiemTuan();



console.log(
"DS HỌC SINH:",
ds
);




let html="";



let soDanhGia=0;

let tongDiem=0;




ds.forEach((hs,index)=>{



if(
to==0 ||
Number(hs.to)==to
){



let d =
diem.find(x=>

x.hocSinhId==hs.id

&&

x.tuan==tuan

);




if(d){


soDanhGia++;

tongDiem+=Number(d.diem);


}




html+=`

<tr>

<td>
${index+1}
</td>


<td>
${hs.hoTen}
</td>


<td>
Tổ ${hs.to || "chưa xếp"}
</td>


<td>
${d ? d.diem : "-"}
</td>


<td>
${d ? xepLoai(d.diem) : "Chưa đánh giá"}
</td>


<td>
${d ? d.nhanXet : ""}
</td>


</tr>

`;



}


});






document.getElementById(
"bang"
).innerHTML=html;



let hienTai =
document.querySelectorAll(
"#bang tr"
).length;




document.getElementById(
"tong"
).innerHTML=hienTai;



document.getElementById(
"dadanhgia"
).innerHTML=soDanhGia;



document.getElementById(
"chuadanhgia"
).innerHTML=
hienTai-soDanhGia;



document.getElementById(
"trungbinh"
).innerHTML=

soDanhGia ?

(tongDiem/soDanhGia).toFixed(1)

:

0;



}




// khởi chạy

khoiTaoDuLieu();

hienThi();



</script>


</body>

</html>
