<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Thi đua tuần lớp 97
</title>


<script src="js/danhsach.js"></script>



<style>


body{

font-family:"Segoe UI",Arial;

background:#eef5ff;

padding:20px;

}



.container{

max-width:1200px;

margin:auto;

background:white;

padding:30px;

border-radius:25px;

box-shadow:0 10px 30px #ccc;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:25px;

border-radius:20px;

text-align:center;

}



.box{

background:#f8fbff;

padding:20px;

margin-top:20px;

border-radius:20px;

}



button{

background:#1565c0;

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

}



button:hover{

background:#0d47a1;

}



input,textarea,select{

padding:10px;

border-radius:10px;

border:1px solid #ccc;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#1565c0;

color:white;

padding:12px;

}



td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



.tot{

background:#e8f5e9;

}



.tru{

background:#ffebee;

}



.ai{

background:#fff8e1;

padding:20px;

border-radius:15px;

white-space:pre-line;

}



</style>


</head>



<body>


<div class="container">



<div class="header">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
Mỗi học sinh bắt đầu 100 điểm
</p>


<p>
GVCN Trần Sáng
</p>


</div>







<div class="box">


<h2>
📅 Tuần hiện tại
</h2>


<input id="tuan"

placeholder="Ví dụ: Tuần 1 - Tháng 9">


<button onclick="khoiTaoTuan()">

🔄 Tạo tuần mới

</button>


</div>







<div class="box">


<h2>
📊 Bảng thi đua
</h2>



<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Học sinh
</th>


<th>
Điểm
</th>


<th>
Cộng
</th>


<th>
Trừ
</th>


<th>
Ghi chú
</th>


<th>
AI
</th>


</tr>


</thead>



<tbody id="bangThiDua">


</tbody>


</table>


</div>







<div class="box">


<h2>
🤖 Nhận xét AI tuần
</h2>


<div id="nhanXetAI"

class="ai">

Chưa có nhận xét

</div>


<br>


<button onclick="taoNhanXetAI()">

🤖 Tạo nhận xét

</button>


</div>

<script>


// ======================================
// THI ĐUA TUẦN LỚP 97
// DÙNG DỮ LIỆU TỪ DANHSACH.JS
// ======================================


const KEY_THI_DUA = "thiDuaTuan97";


let duLieuThiDua = [];






// ======================================
// KHỞI TẠO TUẦN
// ======================================


function khoiTaoTuan(){



let tenTuan = document.getElementById(

"tuan"

).value;



if(!tenTuan){


alert(

"Vui lòng nhập tên tuần"

);


return;


}





duLieuThiDua = danhSachHocSinh.map(

(ten,index)=>{


return {


stt:index+1,


hoTen:ten,


tuan:tenTuan,


diem:100,


ghiChu:""


};


}

);





luuDuLieu();



hienThiBang();



alert(

"✅ Đã tạo tuần mới - Mỗi học sinh 100 điểm"

);



}







// ======================================
// LƯU DỮ LIỆU
// ======================================


function luuDuLieu(){



localStorage.setItem(

KEY_THI_DUA,

JSON.stringify(

duLieuThiDua

)

);



}








// ======================================
// TẢI DỮ LIỆU
// ======================================


function taiDuLieu(){



let data = localStorage.getItem(

KEY_THI_DUA

);



if(data){


duLieuThiDua = JSON.parse(data);


}



}





// ======================================
// HIỂN THỊ BẢNG
// ======================================


function hienThiBang(){



let bang = document.getElementById(

"bangThiDua"

);



bang.innerHTML="";





duLieuThiDua.forEach(

(hs,index)=>{



bang.innerHTML +=


`

<tr>

<td>

${index+1}

</td>


<td>

${hs.hoTen}

</td>


<td>

<b>${hs.diem}</b>

</td>


<td class="tot">


<button onclick="congDiem(${index})">

+ Điểm

</button>

</td>



<td class="tru">


<button onclick="truDiem(${index})">

- Điểm

</button>

</td>



<td>


<input

value="${hs.ghiChu}"

onchange="ghiChu(${index},this.value)"

>

</td>



<td>


<button onclick="nhanXetCaNhan(${index})">

🤖

</button>


</td>


</tr>


`;



});



}








// ======================================
// CỘNG ĐIỂM
// ======================================


function congDiem(index){



let so = prompt(

"Nhập số điểm cộng"

);



if(!so)

return;



duLieuThiDua[index].diem += Number(so);



luuDuLieu();



hienThiBang();



}







// ======================================
// TRỪ ĐIỂM
// ======================================


function truDiem(index){



let so = prompt(

"Nhập số điểm trừ"

);



if(!so)

return;



duLieuThiDua[index].diem -= Number(so);



luuDuLieu();



hienThiBang();



}








// ======================================
// GHI CHÚ
// ======================================


function ghiChu(index,noidung){



duLieuThiDua[index].ghiChu=noidung;



luuDuLieu();



}








// ======================================
// AI NHẬN XÉT CÁ NHÂN
// ======================================


function nhanXetCaNhan(index){



let hs = duLieuThiDua[index];



let text =


`

🤖 NHẬN XÉT AI


Học sinh:

${hs.hoTen}


Điểm tuần:

${hs.diem}


Nhận xét:


${
hs.diem>=100

?

"Em duy trì tốt nền nếp, có ý thức phấn đấu."

:

"Em cần cố gắng hơn trong việc thực hiện nội quy và nhiệm vụ học tập."

}



`;




document.getElementById(

"nhanXetAI"

).innerText=text;



}









// ======================================
// AI NHẬN XÉT CẢ LỚP
// ======================================


function taoNhanXetAI(){



if(duLieuThiDua.length==0)

return;



let tong=0;



duLieuThiDua.forEach(

hs=>{

tong += hs.diem;

}

);



let tb = Math.round(

tong / duLieuThiDua.length

);





let text =

`

🤖 NHẬN XÉT THI ĐUA TUẦN


Lớp 97 có điểm trung bình:

${tb} điểm


Nhận xét:


${
tb>=100

?

"Tập thể lớp duy trì tốt phong trào thi đua, nhiều học sinh có ý thức tự giác và tinh thần trách nhiệm."

:

"Lớp cần tiếp tục nâng cao ý thức tự quản, thực hiện tốt nội quy và nhiệm vụ học tập."

}



GVCN tiếp tục động viên, khích lệ học sinh phát huy ưu điểm và khắc phục hạn chế.


`;




document.getElementById(

"nhanXetAI"

).innerText=text;



}







window.onload=function(){



taiDuLieu();


hienThiBang();



};



</script>




</div>
