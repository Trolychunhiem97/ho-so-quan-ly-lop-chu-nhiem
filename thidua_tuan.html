<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Thi đua tuần lớp 97</title>

<script src="danhsach.js"></script>


<style>

body{
font-family:Arial;
background:#f2f7ff;
padding:20px;
}


.container{
background:white;
padding:25px;
border-radius:20px;
}


h1{
text-align:center;
color:#1565c0;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}


th{
background:#1565c0;
color:white;
padding:10px;
}


td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}


input{
width:60px;
text-align:center;
}


button{

background:#1565c0;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
margin:10px;

}

</style>


</head>



<body>


<div class="container">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>

Tuần số:

<select id="soTuan">

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>

</select>

</p>



<table id="bang">


<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Điểm đầu tuần</th>

<th>Cộng</th>

<th>Trừ</th>

<th>Tổng điểm</th>

<th>Xếp loại</th>


</tr>


</table>



<button onclick="tinhDiem()">

🔄 Tính điểm

</button>



<button onclick="luuTuan()">

💾 Lưu tuần

</button>



<button onclick="xemLichSu()">

📂 Xem lịch sử

</button>



<a href="index.html">

<button>

🏠 Trang chủ

</button>

</a>


<h2 id="lichSu"></h2>


</div>




<script>


let bang=document.getElementById("bang");



danhSachHocSinh.forEach((ten,index)=>{


let row=bang.insertRow();


row.innerHTML=`

<td>${index+1}</td>

<td>${ten}</td>

<td>100</td>

<td>
<input class="cong" value="0">
</td>

<td>
<input class="tru" value="0">
</td>

<td class="tong">
100
</td>

<td class="loai">
⭐ Xuất sắc
</td>

`;


});





function tinhDiem(){


let rows=document.querySelectorAll("#bang tr");


for(let i=1;i<rows.length;i++){


let cong=
Number(rows[i].querySelector(".cong").value)||0;


let tru=
Number(rows[i].querySelector(".tru").value)||0;



let diem=100+cong-tru;



rows[i].cells[5].innerHTML=diem;



let loai="";


if(diem>=100)

loai="⭐ Xuất sắc";

else if(diem>=90)

loai="🟢 Tốt";

else if(diem>=70)

loai="🟡 Khá";

else

loai="🔴 Cần cố gắng";


rows[i].cells[6].innerHTML=loai;


}


}






function luuTuan(){


tinhDiem();



let ds=[];


let rows=document.querySelectorAll("#bang tr");



for(let i=1;i<rows.length;i++){


ds.push({

ten:
rows[i].cells[1].innerHTML,


diem:
Number(rows[i].cells[5].innerHTML),


xeploai:
rows[i].cells[6].innerHTML


});


}



let lichSu=

JSON.parse(localStorage.getItem("lichSuTuan97")) || [];



let soTuan=
document.getElementById("soTuan").value;



// xóa dữ liệu cũ của tuần đó nếu có

lichSu=
lichSu.filter(x=>x.tuan!=soTuan);



lichSu.push({

tuan:soTuan,

ngay:new Date().toLocaleDateString(),

hocSinh:ds


});



localStorage.setItem(

"lichSuTuan97",

JSON.stringify(lichSu)

);



alert(
"Lưu thành công tuần "+soTuan
);



}





function xemLichSu(){


let lichSu=

JSON.parse(localStorage.getItem("lichSuTuan97")) || [];



let text="";


lichSu.forEach(t=>{


text +=

"Tuần "+t.tuan+
" - "+
t.ngay+
"<br>";


});



document.getElementById("lichSu").innerHTML=

"📂 Lịch sử:<br>"+text;



}



</script>


</body>

</html>
