<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Thi đua tuần - Lớp 97
</title>


<script src="phanquyen.js"></script>
<script src="danhsach.js"></script>
<script src="dulieu.js"></script>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:25px 40px;

}



.header h1{

margin:0;

font-size:34px;

}


.header p{

font-size:18px;

}





.btn-home{

margin-top:15px;

padding:12px 25px;

border:none;

border-radius:15px;

background:white;

color:#1565c0;

font-weight:bold;

font-size:16px;

cursor:pointer;

}


.btn-home:hover{

background:#e3f2fd;

}





.container{

max-width:1400px;

margin:auto;

padding:25px;

}



.box{

background:white;

padding:25px;

border-radius:25px;

margin-bottom:25px;

box-shadow:
0 8px 20px rgba(0,0,0,.12);

}



.control{

display:flex;

gap:20px;

}



select{

padding:12px 20px;

border-radius:12px;

font-size:16px;

}



.stat{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

}



.stat div{

background:#f2f7ff;

padding:20px;

border-radius:20px;

text-align:center;

}



.stat h2{

color:#1565c0;

margin:0;

}




table{

width:100%;

border-collapse:collapse;

}


th{

background:#1565c0;

color:white;

padding:15px;

}


td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



footer{

text-align:center;

padding:20px;

color:#666;

}


</style>


</head>



<body>



<div class="header">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
🤖 Trợ lý quản lý lớp - GVCN Trần Sáng
</p>



<button class="btn-home"
onclick="veTrangChu()">

🏠 Trang chủ quản lý lớp 97

</button>



</div>







<div class="container">



<div class="box">


<h2>
📅 Chọn tuần đánh giá
</h2>


<div class="control">


<select id="tuan"
onchange="hienThi()">

</select>



<select id="to"
onchange="hienThi()">


<option value="0">
Tất cả tổ
</option>


<option value="1">
Tổ 1
</option>


<option value="2">
Tổ 2
</option>


<option value="3">
Tổ 3
</option>


</select>



</div>


</div>







<div class="box">


<h2>
📊 Tổng hợp
</h2>



<div class="stat">


<div>

<h2 id="tong">
0
</h2>

<p>
👨‍🎓 Học sinh
</p>

</div>



<div>

<h2 id="dg">
0
</h2>

<p>
✅ Đã đánh giá
</p>

</div>



<div>

<h2 id="cdg">
0
</h2>

<p>
⏳ Chưa đánh giá
</p>

</div>




<div>

<h2 id="tb">
0
</h2>

<p>
⭐ Điểm TB
</p>

</div>



</div>


</div>







<div class="box">


<h2>
📋 Bảng thi đua tuần
</h2>


<table>


<thead>

<tr>

<th>
STT
</th>

<th>
Họ tên
</th>

<th>
Tổ
</th>

<th>
Điểm
</th>

<th>
Xếp loại
</th>

<th>
Nhận xét
</th>


</tr>

</thead>


<tbody id="bang">

</tbody>


</table>


</div>



</div>




<footer>

Trường THCS Trần Phú

<br>

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</footer>





<script>


// tạo 35 tuần


let htmlTuan="";


for(let i=1;i<=35;i++){


htmlTuan += `

<option value="${i}">
Tuần ${i}
</option>

`;

}


document.getElementById(
"tuan"
).innerHTML=htmlTuan;







function hienThi(){


let tuan =
Number(
document.getElementById("tuan").value
);



let to =
Number(
document.getElementById("to").value
);



let ds =
layDanhSachHocSinh();



let diem =
layDiemTuan();



let html="";

let dem=0;

let so=0;

let tongDiem=0;




ds.forEach(hs=>{


if(
to==0 ||
Number(hs.to)==to
){


dem++;



let d =
diem.find(x=>

x.hocSinhId==hs.id

&&

x.tuan==tuan

);




if(d){

so++;

tongDiem += Number(d.diem);

}



html += `

<tr>

<td>
${dem}
</td>


<td>
${hs.hoTen}
</td>


<td>
Tổ ${hs.to}
</td>


<td>
${d?d.diem:"-"}
</td>


<td>
${d?"Đã đánh giá":"Chưa đánh giá"}
</td>


<td>
${d?d.nhanXet:""}
</td>


</tr>

`;



}


});




document.getElementById(
"bang"
).innerHTML=html;



document.getElementById(
"tong"
).innerHTML=dem;


document.getElementById(
"dg"
).innerHTML=so;



document.getElementById(
"cdg"
).innerHTML=
dem-so;



document.getElementById(
"tb"
).innerHTML=

so?

(tongDiem/so).toFixed(1)

:

0;



}







// QUAY VỀ TRANG CHỦ


function veTrangChu(){



let user =
localStorage.getItem(
"nguoiDungDangNhap"
);



if(!user){


alert(
"Không tìm thấy phiên đăng nhập"
);


return;


}



window.location.href="./trangchu.html";



}





khoiTaoDuLieu();


hienThi();



</script>



</body>

</html>
