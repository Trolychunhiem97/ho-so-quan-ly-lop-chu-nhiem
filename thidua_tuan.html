<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Thi đua tuần lớp 97
</title>


<script src="phanquyen.js"></script>
<script src="danhsach.js"></script>
<script src="dulieu.js"></script>



<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

color:white;

padding:35px;

text-align:center;

}



.header h1{

margin:0;

font-size:32px;

}



.container{

max-width:1300px;

margin:auto;

padding:25px;

}



.card{

background:white;

padding:25px;

border-radius:22px;

margin-bottom:25px;

box-shadow:
0 8px 20px rgba(0,0,0,.12);

}



.control{

display:flex;

gap:20px;

flex-wrap:wrap;

}



select{

padding:12px 20px;

font-size:16px;

border-radius:12px;

border:1px solid #ccc;

}



.stat{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}



.stat-box{

padding:20px;

border-radius:18px;

background:#f5f9ff;

text-align:center;

}



.stat-box h2{

color:#1565c0;

margin:5px;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1565c0;

color:white;

padding:14px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



tr:hover{

background:#f5f9ff;

}



.xs{

color:green;

font-weight:bold;

}


.kha{

color:#1565c0;

font-weight:bold;

}


.dat{

color:#e67e22;

font-weight:bold;

}


.yeu{

color:red;

font-weight:bold;

}



.top{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}



.medal{

background:#f7f7f7;

padding:15px;

border-radius:15px;

text-align:center;

font-size:18px;

}



</style>


</head>




<body>


<div class="header">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
Trợ lý quản lý lớp - GVCN Trần Sáng
</p>


</div>




<div class="container">



<div class="card">


<h2>
📅 Chọn tuần và tổ
</h2>


<div class="control">


<select id="chonTuan"
onchange="hienThi()">

</select>



<select id="chonTo"
onchange="hienThi()">

<option value="0">
Tất cả tổ
</option>

<option value="1">
Tổ 1
</option>

<option value="2">
Tổ 2
</option>

<option value="3">
Tổ 3
</option>


</select>


</div>


</div>





<div class="card">


<h2>
📊 Tổng quan
</h2>


<div class="stat">


<div class="stat-box">

<h2 id="tongHS">
0
</h2>

<p>
👨‍🎓 Tổng học sinh
</p>

</div>




<div class="stat-box">

<h2 id="daDanhGia">
0
</h2>

<p>
✅ Đã đánh giá
</p>

</div>





<div class="stat-box">

<h2 id="chuaDanhGia">
0
</h2>

<p>
⏳ Chưa đánh giá
</p>

</div>





<div class="stat-box">

<h2 id="diemTB">
0
</h2>

<p>
⭐ Điểm trung bình
</p>

</div>



</div>


</div>






<div class="card">


<h2>
📋 Bảng thi đua
</h2>


<table>


<thead>

<tr>

<th>
STT
</th>


<th>
Họ tên
</th>


<th>
Tổ
</th>


<th>
Điểm
</th>


<th>
Xếp loại
</th>


<th>
Nhận xét
</th>


</tr>


</thead>


<tbody id="bang">

</tbody>


</table>



</div>






<div class="card">


<h2>
🏅 Top 5 tuần
</h2>


<div class="top"
id="top5">

</div>


</div>



</div>







<script>


// tạo 35 tuần


function taoTuan(){


let html="";


for(let i=1;i<=35;i++){


html+=`

<option value="${i}">
Tuần ${i}
</option>

`;

}


document.getElementById(
"chonTuan"
).innerHTML=html;


}



taoTuan();






function xepLoai(diem){


if(diem>=90)
return "<span class='xs'>Xuất sắc</span>";


if(diem>=75)
return "<span class='kha'>Khá</span>";


if(diem>=50)
return "<span class='dat'>Đạt</span>";


return "<span class='yeu'>Cần cố gắng</span>";

}




function hienThi(){



let tuan=
Number(
document.getElementById("chonTuan").value
);



let to=
Number(
document.getElementById("chonTo").value
);



let ds=
layDanhSachHocSinh();



let diem=
layDiemTuan();



let bang="";

let danhSach=[];




ds.forEach(hs=>{


if(
to===0 ||
hs.to===to
){



let d=
diem.find(x=>

x.hocSinhId===hs.id
&&
x.tuan===tuan

);



danhSach.push({

ten:hs.hoTen,

to:hs.to,

diem:d?d.diem:null,

nhanxet:d?d.nhanXet:"Chưa đánh giá"

});


}



});





danhSach.sort((a,b)=>{


if(!a.diem)
return 1;


if(!b.diem)
return -1;


return b.diem-a.diem;


});






let tong=0;

let soDanhGia=0;




danhSach.forEach((hs,i)=>{


if(hs.diem){

tong+=Number(hs.diem);

soDanhGia++;

}



bang+=`

<tr>

<td>${i+1}</td>

<td>${hs.ten}</td>

<td>Tổ ${hs.to}</td>

<td>
${hs.diem ?? "-"}
</td>

<td>
${hs.diem?
xepLoai(hs.diem)
:
"Chưa đánh giá"}
</td>

<td>
${hs.nhanxet}
</td>


</tr>

`;



});





document.getElementById("bang").innerHTML=bang;




document.getElementById(
"tongHS"
).innerHTML=danhSach.length;



document.getElementById(
"daDanhGia"
).innerHTML=soDanhGia;



document.getElementById(
"chuaDanhGia"
).innerHTML=
danhSach.length-soDanhGia;



document.getElementById(
"diemTB"
).innerHTML=

soDanhGia?
(tong/soDanhGia).toFixed(1)
:
0;






let top="";


danhSach
.filter(x=>x.diem)
.slice(0,5)
.forEach((x,i)=>{


top+=`

<div class="medal">

🏅 Hạng ${i+1}

<br>

<b>${x.ten}</b>

<br>

${x.diem} điểm

</div>

`;



});



document.getElementById(
"top5"
).innerHTML=top;



}





hienThi();



</script>


</body>

</html>
