<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<title>Thi đua tuần lớp 97</title>

<link rel="stylesheet" href="style.css">

<script src="danhsach.js"></script>


<style>

.container{
background:white;
padding:25px;
border-radius:20px;
}

h1{
text-align:center;
color:#1565c0;
}


table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}


th{

background:#1565c0;
color:white;
padding:10px;

}


td{

border:1px solid #ddd;
padding:8px;
text-align:center;

}


input{

width:60px;
text-align:center;

}


button{

background:#1565c0;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
margin:10px;

}


</style>


</head>



<body>


<div class="container">


<h1>
🏆 THI ĐUA TUẦN LỚP 97
</h1>


<p>
Tuần số:
<input id="soTuan" value="1">
</p>



<table id="bang">


<tr>

<th>STT</th>

<th>Họ và tên</th>

<th>Điểm đầu tuần</th>

<th>Cộng</th>

<th>Trừ</th>

<th>Tổng điểm</th>

<th>Xếp loại</th>

<th>Nhận xét</th>

</tr>


</table>



<button onclick="tinhDiem()">
🔄 Tính điểm
</button>


<button onclick="luuTuan()">
💾 Lưu kết quả tuần
</button>


<button onclick="location.reload()">
🧹 Tuần mới
</button>



<a href="index.html">

<button>
⬅ Trang chủ
</button>

</a>



</div>




<script>


let bang=document.getElementById("bang");



danhSachHocSinh.forEach((ten,index)=>{


let dong=bang.insertRow();


dong.innerHTML=`

<td>${index+1}</td>

<td>${ten}</td>

<td>100</td>


<td>
<input class="cong" value="0">
</td>


<td>
<input class="tru" value="0">
</td>


<td class="tong">
100
</td>


<td class="xeploai">
Xuất sắc
</td>


<td>
<input class="nhanxet" style="width:150px">
</td>


`;


});





function tinhDiem(){


let dong=document.querySelectorAll("#bang tr");


for(let i=1;i<dong.length;i++){


let cong=
Number(dong[i].querySelector(".cong").value)||0;


let tru=
Number(dong[i].querySelector(".tru").value)||0;



let tong=100+cong-tru;



dong[i].querySelector(".tong").innerHTML=tong;



let loai="";


if(tong>=100)

loai="⭐ Xuất sắc";


else if(tong>=90)

loai="🟢 Tốt";


else if(tong>=70)

loai="🟡 Khá";


else

loai="🔴 Cần cố gắng";



dong[i].querySelector(".xeploai").innerHTML=loai;



}



}





function luuTuan(){


let duLieu=[];


let dong=document.querySelectorAll("#bang tr");



for(let i=1;i<dong.length;i++){


duLieu.push({

ten:dong[i].cells[1].innerHTML,

diem:Number(dong[i].cells[5].innerHTML),

xeploai:dong[i].cells[6].innerHTML

});


}



let tuan={


soTuan:
document.getElementById("soTuan").value,


ngay:
new Date().toLocaleDateString(),


hocSinh:duLieu



};



localStorage.setItem(

"ketQuaTuan97",

JSON.stringify(tuan)

);



alert("Đã lưu kết quả tuần!");



}


</script>



</body>

</html>
