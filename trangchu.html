<style>


body{

margin:0;

font-family:"Segoe UI",Arial;

background:#eef5ff;

}



.header{

background:linear-gradient(
135deg,
#1565c0,
#42a5f5
);

.container{

max-width:1200px;

margin:auto;

}



.user-box{

padding:25px;

border-radius:25px;

box-shadow:0 8px 20px #ccc;

}



.grid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(230px,1fr));

}



.card{

background:white;

padding:25px;

border-radius:25px;

box-shadow:0 5px 15px #ddd;

text-align:center;

transition:.3s;

}



.card:hover{

}



.icon{

}



h2{

color:#1565c0;

}



button{

background:#1565c0;

color:white;

border:none;

padding:12px 20px;

border-radius:12px;

cursor:pointer;

}



.hide{

display:none;

}



</style>

<script>


// =================================
// KIỂM TRA ĐĂNG NHẬP
// =================================


let nguoiDung = layNguoiDung();



if(!nguoiDung){


alert(
"Bạn chưa đăng nhập"
);


window.location.href="index.html";


}






// HIỂN THỊ THÔNG TIN


document.getElementById(

"thongTinUser"

).innerHTML=


`

👤 Tài khoản:

<b>${nguoiDung.ten}</b>


<br><br>


🔐 Quyền:

<b>${nguoiDung.quyen}</b>


`;








// =================================
// PHÂN QUYỀN
// =================================



function hienThiQuyen(){



let chucNangGVCN=

document.querySelectorAll(".gvcn");





if(nguoiDung.quyen!=="gvcn"){



chucNangGVCN.forEach(

(item)=>{

item.classList.add("hide");

}

);



}



}



hienThiQuyen();







// =================================
// MỞ TRANG
// =================================


function moTrang(url){


window.location.href=url;


}



</script>
