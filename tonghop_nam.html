<script>


// =====================================
// ĐỌC DỮ LIỆU THÁNG
// =====================================


let duLieuThang = JSON.parse(

localStorage.getItem(

"xepLoaiThang97"

)

)

|| [];





let tongHopNam=[];






// =====================================
// TỔNG HỢP CUỐI NĂM
// =====================================


function taoTongHopNam(){



tongHopNam=[];



let danhSach={};






// Gom dữ liệu theo học sinh


duLieuThang.forEach(

(hs)=>{



if(!danhSach[hs.ten]){


danhSach[hs.ten]=[];

}



danhSach[hs.ten].push(hs);



});







Object.keys(danhSach).forEach(

(ten)=>{



let ds=

danhSach[ten];





let tong=0;



ds.forEach(

(x)=>{


tong += Number(x.diem);


});






let diemTB=

Math.round(

tong/ds.length

);







let xepLoai="";






if(diemTB>=110){


xepLoai="Tốt";


}

else if(diemTB>=90){


xepLoai="Khá";


}

else if(diemTB>=70){


xepLoai="Đạt";


}

else{


xepLoai="Cần hỗ trợ";


}







let nhanXet=

taoNhanXetNam(

xepLoai,

diemTB

);






tongHopNam.push({


ten:ten,


diemTB:diemTB,


xepLoai:xepLoai,


nhanXet:nhanXet


});




});







localStorage.setItem(

"tongHopNam97",

JSON.stringify(

tongHopNam

)

);







hienThiTongHop();



}










// =====================================
// AI NHẬN XÉT CUỐI NĂM
// =====================================


function taoNhanXetNam(

loai,

diem

){



if(loai=="Tốt"){


return

"Học sinh có ý thức rèn luyện tốt, "

+

tích cực trong học tập và hoạt động tập thể. "

+

"Cần tiếp tục phát huy trong năm học tiếp theo.";


}




if(loai=="Khá"){


return

"Học sinh có nhiều cố gắng, "

+

cơ bản hoàn thành tốt nhiệm vụ học tập và rèn luyện. "

+

"Cần mạnh dạn hơn để phát triển bản thân.";


}





if(loai=="Đạt"){


return

"Học sinh đã có sự tiến bộ nhưng cần "

+

duy trì tính tự giác, nâng cao tinh thần học tập.";


}





return

"Học sinh cần được quan tâm, "

+

phối hợp giữa gia đình và nhà trường "

+

để có biện pháp hỗ trợ phù hợp.";


}









// =====================================
// HIỂN THỊ BẢNG
// =====================================


function hienThiTongHop(){



let bang=

document.getElementById(

"bang"

);




bang.innerHTML=

`

<tr>

<th>STT</th>

<th>Học sinh</th>

<th>Điểm TB</th>

<th>Xếp loại</th>

<th>Nhận xét</th>

</tr>

`;








let demTot=0;

let demKha=0;

let demHoTro=0;







tongHopNam.sort(

(a,b)=>

b.diemTB-a.diemTB

);







tongHopNam.forEach(

(hs,index)=>{



if(hs.xepLoai=="Tốt")

demTot++;



if(hs.xepLoai=="Khá")

demKha++;



if(hs.xepLoai=="Cần hỗ trợ")

demHoTro++;







bang.innerHTML +=


`

<tr>

<td>${index+1}</td>

<td>${hs.ten}</td>

<td>⭐ ${hs.diemTB}</td>

<td>${hs.xepLoai}</td>

<td>${hs.nhanXet}</td>

</tr>

`;




});








document.getElementById(

"soHS"

).innerHTML=

tongHopNam.length;





document.getElementById(

"tot"

).innerHTML=

demTot;





document.getElementById(

"kha"

).innerHTML=

demKha;





document.getElementById(

"canHoTro"

).innerHTML=

demHoTro;









// Nhận xét chung của AI


let nhanXetLop="";



if(demTot>demHoTro){



nhanXetLop=

"🤖 Lớp có kết quả rèn luyện tích cực. "

+

"Nhiều học sinh có ý thức tốt, "

+

cần tiếp tục duy trì phong trào thi đua.";


}

else{


nhanXetLop=

"🤖 Lớp cần tăng cường công tác phối hợp, "

+

quan tâm hỗ trợ những học sinh còn hạn chế "

+

để nâng cao chất lượng chung.";


}







document.getElementById(

"aiNhanXet"

).innerHTML=

nhanXetLop;



}







window.onload=function(){


taoTongHopNam();


};



</script>
