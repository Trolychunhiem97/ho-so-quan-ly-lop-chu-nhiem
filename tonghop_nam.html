</head>


<body>


<div class="container">


<h2>
🏫 TRƯỜNG THCS TRẦN PHÚ
</h2>


<h1>
📊 TỔNG HỢP CUỐI NĂM LỚP 97
</h1>



<div class="user" id="nguoiDung">

</div>



<div style="text-align:center">


<button onclick="tongHopNam()">

📊 Tổng hợp năm

</button>


<button onclick="taoAI_NhanXetNam()">

🤖 AI nhận xét cuối năm

</button>



<button onclick="luuTongHopNam()">

💾 Lưu dữ liệu

</button>



<button onclick="location.href='xuat_tonghop_word.html'">

📄 Xuất Word

</button>



<button onclick="location.href='index.html'">

🏠 Trang chủ

</button>


</div>



<div class="thongke" id="thongKe">

</div>



<table id="bangTongHop">


<tr>

<th>
STT
</th>

<th>
Họ tên
</th>

<th>
Điểm TB năm
</th>

<th>
Xếp loại
</th>

<th>
Nhận xét AI
</th>

</tr>


</table>



<div class="footer">

Trợ lý quản lý lớp 97 - GVCN Trần Sáng

</div>
<script>


// ===============================
// KIỂM TRA NGƯỜI DÙNG
// ===============================


let nguoiDung = JSON.parse(

localStorage.getItem(
"nguoiDungDangNhap"
)

);



if(!nguoiDung){

location.href="dangnhap.html";

}



document.getElementById(
"nguoiDung"
).innerHTML =

"👤 Xin chào: <b>"
+
nguoiDung.ten
+
"</b>";







// ===============================
// DANH SÁCH HỌC SINH
// ===============================


let dsHocSinh=[];



if(typeof danhSachHocSinh!="undefined"){

dsHocSinh=danhSachHocSinh;

}

else{


dsHocSinh=[

"Nguyễn Văn A",

"Trần Văn B",

"Lê Thị C"

];


}









// ===============================
// LẤY DỮ LIỆU THÁNG
// ===============================


function layDuLieuThang(){


return JSON.parse(

localStorage.getItem(
"xepLoaiThang97"
)

)

||{

duLieu:[]

};


}









// ===============================
// TỔNG HỢP NĂM
// ===============================


function tongHopNam(){



let data=

layDuLieuThang();



let bang=

document.getElementById(
"bangTongHop"
);



bang.innerHTML=`

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Điểm TB năm</th>

<th>Xếp loại</th>

<th>Nhận xét AI</th>

</tr>

`;




let thongKe={


xuatSac:0,

tot:0,

kha:0,

canCoGang:0


};






let danhSachAI=[];






dsHocSinh.forEach(

(hs,index)=>{



let diem=[];



let tim=

data.duLieu.find(

(x)=>x.ten==hs

);



if(tim){

diem.push(

Number(tim.diem)

);

}




let tb=0;



if(diem.length){

tb=Math.round(

diem.reduce(

(a,b)=>a+b,

0

)

/diem.length

);

}





let xepLoai="";



if(tb>=110){


xepLoai="🌟 Xuất sắc";

thongKe.xuatSac++;


}

else if(tb>=100){


xepLoai="✅ Tốt";

thongKe.tot++;


}

else if(tb>=90){


xepLoai="👍 Khá";

thongKe.kha++;


}

else{


xepLoai="⚠ Cần cố gắng";

thongKe.canCoGang++;


}








// Chuẩn bị dữ liệu cho AI


danhSachAI.push({

ten:hs,

diem:tb,

xepLoai:xepLoai,

hocTap:"",

laoDong:"",

yThuc:""


});







bang.innerHTML +=`

<tr>

<td>${index+1}</td>

<td>${hs}</td>

<td><b>${tb}</b></td>

<td>${xepLoai}</td>

<td class="nhanXet">

Chưa tạo

</td>

</tr>

`;



});






document.getElementById(

"thongKe"

).innerHTML=


`
📊 THỐNG KÊ LỚP 97

<br><br>

🌟 Xuất sắc: ${thongKe.xuatSac} học sinh

<br>

✅ Tốt: ${thongKe.tot} học sinh

<br>

👍 Khá: ${thongKe.kha} học sinh

<br>

⚠ Cần cố gắng: ${thongKe.canCoGang} học sinh

`;





// lưu tạm cho AI

localStorage.setItem(

"duLieuAI97",

JSON.stringify(

danhSachAI

)

);



}









// ===============================
// AI NHẬN XÉT CUỐI NĂM
// ===============================


function taoAI_NhanXetNam(){



let data=

JSON.parse(

localStorage.getItem(

"duLieuAI97"

)

)

||[];





let ketQua=

taoNhanXetLop97(

data

);





let dong=

document.querySelectorAll(

"#bangTongHop tr"

);






for(let i=1;i<dong.length;i++){


if(ketQua[i-1]){


dong[i].cells[4].innerText=

ketQua[i-1].nhanXet;


}


}





alert(

"🤖 AI đã tạo nhận xét riêng cho từng học sinh!"

);



}








// ===============================
// LƯU TỔNG HỢP NĂM
// ===============================



function luuTongHopNam(){



let dong=

document.querySelectorAll(

"#bangTongHop tr"

);



let ketQua=[];






for(let i=1;i<dong.length;i++){


ketQua.push({


ten:

dong[i].cells[1].innerText,


diem:

Number(

dong[i].cells[2].innerText

),


xepLoai:

dong[i].cells[3].innerText,


nhanXet:

dong[i].cells[4].innerText


});


}





localStorage.setItem(

"tongHopNam97",

JSON.stringify({

namHoc:"2026-2027",

ngay:

new Date().toLocaleString("vi-VN"),


duLieu:ketQua


})

);





alert(

"✅ Đã lưu tổng hợp năm!"

);



}






window.onload=function(){


tongHopNam();


};


</script>

</div>
