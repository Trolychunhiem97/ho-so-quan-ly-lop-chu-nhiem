<script>


// Lấy dữ liệu theo tháng

function layDuLieuThang(){


return JSON.parse(

localStorage.getItem(

"duLieuLop97TheoThang"

)

)||{};


}






// Danh sách tháng theo học kỳ


function layDanhSachThang(){



let loai =

document.getElementById("loai").value;



if(loai=="HK1"){


return [

"Tháng 9",

"Tháng 10",

"Tháng 11",

"Tháng 12",

"Tháng 1"

];


}



if(loai=="HK2"){


return [

"Tháng 2",

"Tháng 3",

"Tháng 4",

"Tháng 5"

];


}



return [

"Tháng 9",

"Tháng 10",

"Tháng 11",

"Tháng 12",

"Tháng 1",

"Tháng 2",

"Tháng 3",

"Tháng 4",

"Tháng 5"

];


}







// =============================
// TỔNG HỢP DỮ LIỆU
// =============================


function tongHop(){



let data=

layDuLieuThang();



let thangCanLay=

layDanhSachThang();



let bang=

document.getElementById(

"bangTongHop"

);



bang.innerHTML=`

<tr>

<th>STT</th>

<th>Họ tên</th>

<th>Điểm TB</th>

<th>Hạnh kiểm</th>

<th>Xếp loại</th>

<th>Nhận xét</th>

</tr>

`;






danhSachHocSinh.forEach(

(ten,index)=>{


let tong=0;

let dem=0;

let hk=[];





thangCanLay.forEach(thang=>{


let item=data[thang];



if(item){



// lấy dữ liệu thi đua

try{


let lichSu=

JSON.parse(

item.thiDua

)||[];




lichSu.forEach(t=>{


let hs=

t.hocSinh.find(

x=>x.ten==ten

);



if(hs){


tong +=

Number(hs.diem);


dem++;


}


});



}catch(e){}





// lấy hạnh kiểm

try{


let hkData=

JSON.parse(

item.hanhKiem

)||[];



if(hkData.length){



let cuoi=

hkData[hkData.length-1];



let hsHK=

cuoi.hocSinh.find(

x=>x.ten==ten

);



if(hsHK)

hk.push(hsHK.xeploai);



}



}catch(e){}



}



});







let diem=

dem?

(tong/dem).toFixed(2):

0;





let hanhKiem=

hk.length?

hk[hk.length-1]:

"Chưa có";





let xepLoai="";



if(diem>=90){

xepLoai="Tốt";

}

else if(diem>=75){

xepLoai="Khá";

}

else{

xepLoai="Cần cố gắng";

}







bang.innerHTML +=`


<tr>

<td>${index+1}</td>

<td>${ten}</td>

<td>${diem}</td>

<td>${hanhKiem}</td>

<td>${xepLoai}</td>

<td class="nhanxet">

Chưa tạo

</td>

</tr>


`;





}

);





alert(

"✅ Đã tổng hợp dữ liệu thành công!"

);



}









// =============================
// AI NHẬN XÉT TỔNG KẾT
// =============================


function taoNhanXetTongKet(){



let rows=

document.querySelectorAll(

"#bangTongHop tr"

);



for(let i=1;i<rows.length;i++){



let hs={


ten:

rows[i].cells[1].innerText,


diem:

rows[i].cells[2].innerText,


hanhKiem:

rows[i].cells[3].innerText



};





let nx=

taoNhanXetHocKy(hs);



rows[i].cells[5].innerText=

nx;



}



alert(

"🤖 Đã tạo nhận xét tổng kết!"

);



}








// =============================
// LƯU TỔNG HỢP
// =============================


function luuTongHop(){



localStorage.setItem(

"tongHopLop97",

document.getElementById(

"bangTongHop"

).innerHTML

);



localStorage.setItem(

"nhanXetTongHop97",

document.getElementById(

"nhanXetChung"

).value

);




alert(

"💾 Đã lưu kết quả tổng hợp!"

);



}








// Tự mở dữ liệu cũ

window.onload=function(){


let old=

localStorage.getItem(

"tongHopLop97"

);



if(old){


document.getElementById(

"bangTongHop"

).innerHTML=

old;


}



let nx=

localStorage.getItem(

"nhanXetTongHop97"

);



if(nx){


document.getElementById(

"nhanXetChung"

).value=

nx;


}



}
