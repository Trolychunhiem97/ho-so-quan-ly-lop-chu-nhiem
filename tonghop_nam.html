<script>


// =====================================
// TỔNG HỢP NĂM LỚP 97
// =====================================


const KEY_TONG_HOP = "tongHopNam97";


let duLieuNam = [];






// =====================================
// LẤY DỮ LIỆU
// =====================================


function layDuLieu(){


let thiDua = JSON.parse(

localStorage.getItem(

"thiDuaTuan97"

)

)

|| [];



let thang = JSON.parse(

localStorage.getItem(

"xepLoaiThang97"

)

)

|| [];



let hoSo = layHoSoHocSinh();





return {


thiDua:thiDua,


thang:thang,


hoSo:hoSo


};


}









// =====================================
// TẠO TỔNG HỢP NĂM
// =====================================


function taoTongHop(){



let data = layDuLieu();




duLieuNam=[];






danhSachHocSinh.forEach(

(ten,index)=>{



let diemTuan=100;



let diemThang=100;







let hsTuan=data.thiDua.find(

(x)=>x.hoTen==ten

);





if(hsTuan){


diemTuan=hsTuan.diem;


}







let hsThang=data.thang.find(

(x)=>x.hoTen==ten

);





if(hsThang){


diemThang=hsThang.diem;


}








let diemTB=Math.round(

(

diemTuan + diemThang

)

/

2

);







let xepLoai = xepLoaiNam(

diemTB

);






let nhanXet = taoNhanXetHS(

ten,

xepLoai,

diemTB

);








duLieuNam.push({


stt:index+1,


hoTen:ten,


diemTB:diemTB,


xepLoai:xepLoai,


nhanXet:nhanXet


});




});







localStorage.setItem(

KEY_TONG_HOP,

JSON.stringify(

duLieuNam

)

);





hienThiTongHop();



}









// =====================================
// XẾP LOẠI NĂM
// =====================================


function xepLoaiNam(diem){



if(diem>=90)

return "Tốt";



if(diem>=80)

return "Khá";



if(diem>=65)

return "Đạt";



return "Cần cố gắng";


}









// =====================================
// NHẬN XÉT HỌC SINH
// =====================================


function taoNhanXetHS(

ten,

loai,

diem

){



if(loai=="Tốt"){


return (

ten +

" có ý thức rèn luyện tốt, "

+

duy trì nền nếp học tập và tích cực tham gia hoạt động tập thể."

);


}



if(loai=="Khá"){


return (

ten +

" có nhiều cố gắng trong học tập và rèn luyện, cần tiếp tục phát huy."

);


}



if(loai=="Đạt"){


return (

ten +

" đã có sự tiến bộ nhưng cần nâng cao tính tự giác."

);


}



return (

ten +

" cần được quan tâm, phối hợp giữa gia đình và nhà trường để tiến bộ."

);


}









// =====================================
// HIỂN THỊ BẢNG
// =====================================


function hienThiTongHop(){



let bang=document.getElementById(

"bangTongHop"

);



bang.innerHTML="";





let tot=0;

let kha=0;

let can=0;







duLieuNam.forEach(

(hs)=>{



if(hs.xepLoai=="Tốt")

tot++;



if(hs.xepLoai=="Khá")

kha++;



if(hs.xepLoai=="Cần cố gắng")

can++;







let mau="";



if(hs.xepLoai=="Tốt")

mau="tot";



if(hs.xepLoai=="Khá")

mau="kha";



if(hs.xepLoai=="Cần cố gắng")

mau="y";








bang.innerHTML +=



`

<tr>

<td>${hs.stt}</td>

<td>${hs.hoTen}</td>

<td>${hs.diemTB}</td>

<td class="${mau}">

${hs.xepLoai}

</td>

<td>

${hs.nhanXet}

</td>

</tr>

`;



});






document.getElementById(

"soHS"

).innerText=

duLieuNam.length;



document.getElementById(

"soTot"

).innerText=

tot;



document.getElementById(

"soKha"

).innerText=

kha;



document.getElementById(

"soCanHoTro"

).innerText=

can;



}








// =====================================
// AI NHẬN XÉT CHUNG
// =====================================


function taoNhanXetNam(){



let tot=

duLieuNam.filter(

(x)=>x.xepLoai=="Tốt"

).length;



let text="";





if(tot>=20){


text=

`

🤖 NHẬN XÉT CUỐI NĂM LỚP 97


Tập thể lớp có nhiều học sinh đạt kết quả rèn luyện tốt.


Học sinh có ý thức thực hiện nội quy,
tham gia tích cực các hoạt động.


Cần tiếp tục phát huy tinh thần tự quản,
đoàn kết và hỗ trợ nhau trong học tập.


`;



}

else{


text=

`

🤖 NHẬN XÉT CUỐI NĂM LỚP 97


Lớp cần tiếp tục tăng cường nền nếp,
ý thức tự giác và tinh thần trách nhiệm.


GVCN cần phối hợp thường xuyên với phụ huynh
để hỗ trợ học sinh còn hạn chế.


`;



}






document.getElementById(

"aiNam"

).innerText=text;



}







window.onload=function(){


let old = localStorage.getItem(

KEY_TONG_HOP

);



if(old){


duLieuNam=JSON.parse(old);


}

else{


taoTongHop();


}



hienThiTongHop();



};




</script>
